  key.position.set(20, 30, 15);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -30;
  key.shadow.camera.right = 30;
  key.shadow.camera.top = 30;
  key.shadow.camera.bottom = -30;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 100;
  key.shadow.bias = -0.0006;
  scene.add(key);
  scene.add(key.target);
  App.gameKeyLight = key;

  scene.add(new THREE.HemisphereLight(0xa8c8ff, 0x4a3a2a, 0.7));
  scene.add(new THREE.AmbientLight(0x506080, 0.5));

  // Ground (plaza with tiles)
  const groundGeo = new THREE.PlaneGeometry(240, 240, 60, 60);
  const gp = groundGeo.attributes.position;
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), y = gp.getY(i);
    const d = Math.hypot(x, y);
    const t = clamp((d - 20)/30, 0, 1);
    const h = (Math.sin(x*0.12)*Math.cos(y*0.13)*1.4 + Math.sin(x*0.4+y*0.3)*0.5) * t*t*(3-2*t);
    gp.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({
    map: stoneTileTexture(),
    roughness: 0.9, metalness: 0.08, color: 0xb0a890,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
  App.ground = ground;

  // City — walls, statues, plazas, stalls
  buildCity(scene);

  // Trees (outside city)
  App.trees = [];
  for (let i = 0; i < 35; i++) {
    const a = rand(0, TAU);
    const r = rand(28, 70);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const tree = buildTree({ scale: rand(0.9, 1.5) });
    tree.position.set(x, 0, z);
    tree.rotation.y = rand(0, TAU);
    scene.add(tree);
    App.trees.push(tree);
  }

  // Rocks
  for (let i = 0; i < 25; i++) {
    const a = rand(0, TAU);
    const r = rand(22, 65);
    const rock = buildRock(rand(0.4, 1.2));
    rock.position.set(Math.cos(a)*r, rand(0.05, 0.3), Math.sin(a)*r);
    rock.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    scene.add(rock);
  }

  // NPCs at stalls
  buildNPCs(scene);

  // Player
  buildPlayer(scene);

  // Enemies
  for (let i = 0; i < 6; i++) spawnEnemy(scene);

  // Rain
  buildRain(scene);

  // Postprocessing
  if (EffectComposer && RenderPass && UnrealBloomPass) {
    try {
      const composer = new EffectComposer(App.gameRenderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), 0.6, 0.55, 0.85));
      composer.render();
      App.gameComposer = composer;
      console.log('[Game] Composer OK');
    } catch(e) {
      console.warn('[Game] Composer failed:', e);
      App.gameComposer = null;
    }
  }

  // Test render
  App.gameRenderer.render(scene, camera);
  console.log('[Game] Test render OK');

  App.gameClock = new THREE.Clock();
  const mm = $('minimap');
  App.minimapCtx = mm ? mm.getContext('2d') : null;
}

function buildCity(scene) {
  const city = new THREE.Group();
  const R = 20; // city radius

  // ---- Plaza floor (raised, tiled) ----
  const plazaGeo = new THREE.CircleGeometry(R, 48);
  const plazaMat = new THREE.MeshStandardMaterial({
    map: stoneTileTexture(), roughness: 0.85, metalness: 0.1, color: 0xb8a888,
  });
  const plaza = new THREE.Mesh(plazaGeo, plazaMat);
  plaza.rotation.x = -Math.PI/2;
  plaza.position.y = 0.06;
  plaza.receiveShadow = true;
  city.add(plaza);

  // ---- Fortress walls (segments) ----
  const wallMat = new THREE.MeshStandardMaterial({
    map: wallTexture(), roughness: 0.9, metalness: 0.05, color: 0x7a7060,
  });
  const towerMat = new THREE.MeshStandardMaterial({
    map: wallTexture(), roughness: 0.85, metalness: 0.08, color: 0x6a6050,
  });
  const segmentCount = 24;
  for (let i = 0; i < segmentCount; i++) {
    // Leave 2-segment gap for the city entrance
    if (i >= 4 && i <= 6) continue;

    const a = (i/segmentCount)*TAU;
    const wx = Math.cos(a)*R;
    const wz = Math.sin(a)*R;

    const seg = new THREE.Group();
    // Main wall block
    const wallH = 3.4;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, wallH, 1.2),
      wallMat
    );
    block.position.y = wallH/2;
    block.castShadow = true;
    block.receiveShadow = true;
    seg.add(block);

    // Crenellation (battlements)
    for (let c = -1; c <= 1; c++) {
      const merlon = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.6, 1.3),
        wallMat
      );
      merlon.position.set(c*0.9, wallH + 0.3, 0);
      merlon.castShadow = true;
      seg.add(merlon);
    }

    seg.position.set(wx, 0, wz);
    seg.rotation.y = -a;
    city.add(seg);
  }

  // ---- Corner towers ----
  const towerPositions = [
    { a: 0, x: 1, z: 0 },
    { a: Math.PI/2, x: 0, z: 1 },
    { a: Math.PI, x: -1, z: 0 },
    { a: 3*Math.PI/2, x: 0, z: -1 },
  ];
  for (const t of towerPositions) {
    const tx = t.x * (R + 0.3);
    const tz = t.z * (R + 0.3);
    const tower = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(1.4, 1.6, 6.0, 8),
      towerMat
    );
    base.position.y = 3.0;
    base.castShadow = true;
    base.receiveShadow = true;
    tower.add(base);
    // Conical roof
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(1.7, 1.6, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a2a3a, roughness: 0.85 })
    );
    roof.position.y = 6.8;
    roof.castShadow = true;
    tower.add(roof);
    // Spire
    const spire = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.9, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a2a1a, metalness: 0.7, roughness: 0.5 })
    );
    spire.position.y = 8.0;
    tower.add(spire);
    // Banner (plane)
    const bannerMat = new THREE.MeshStandardMaterial({
      color: 0x8a2020, side: THREE.DoubleSide, roughness: 0.85,
    });
    const banner = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.6, 3, 6), bannerMat);
    banner.position.set(0, 7.4, 0.1);
    banner.userData.isBanner = true;
    banner.userData.phase = rand(0, TAU);
    tower.add(banner);

    tower.position.set(tx, 0, tz);
    city.add(tower);
  }

  // ---- Gothic statues at city center ----
  const statuePositions = [
    { x: -6, z: -6, rot: 0.6 },
    { x:  6, z: -6, rot: -0.6 },
    { x: -6, z:  6, rot: -2.4 },
    { x:  6, z:  6, rot: 2.4 },
  ];
  for (const sp of statuePositions) {
    const st = buildStatue(0.85, 0x8a7a60);
    st.position.set(sp.x, 0, sp.z);
    st.rotation.y = sp.rot;
    st.castShadow = true;
    city.add(st);
  }

  // ---- Central obelisk / altar ----
  const obeliskMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a3a, metalness: 0.85, roughness: 0.25,
    emissive: 0x3a5aff, emissiveIntensity: 0.5,
  });
  const obelisk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 6.5, 6), obeliskMat);
  obelisk.position.y = 3.25;
  obelisk.castShadow = true;
  city.add(obelisk);

  // Floating rune around obelisk
  const haloRune = new THREE.Mesh(
    new THREE.TorusGeometry(0.9, 0.05, 6, 32),
    new THREE.MeshBasicMaterial({ color: 0x7cd9ff, transparent: true, opacity: 0.9 })
  );
  haloRune.position.y = 6.2;
  haloRune.rotation.x = Math.PI/2;
  haloRune.userData.isHalo = true;
  city.add(haloRune);

  // ---- Fountains ----
  for (let i = 0; i < 2; i++) {
    const fx = (i === 0 ? -9 : 9);
    const fz = (i === 0 ? -3 : 3);
    const f = new THREE.Group();
    // Basin
    const basin = new THREE.Mesh(
      new THREE.CylinderGeometry(1.6, 1.9, 0.5, 20),
      new THREE.MeshStandardMaterial({ color: 0x7a7060, roughness: 0.85, metalness: 0.1 })
    );
    basin.position.y = 0.25;
    basin.castShadow = true;
    f.add(basin);
    // Water
    const water = new THREE.Mesh(
      new THREE.CylinderGeometry(1.35, 1.35, 0.15, 20),
      new THREE.MeshStandardMaterial({
        color: 0x2a5a90, roughness: 0.05, metalness: 0.9,
        transparent: true, opacity: 0.92,
      })
    );
    water.position.y = 0.55;
    f.add(water);
    // Central column
    const col = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.22, 1.8, 10),
      new THREE.MeshStandardMaterial({ color: 0x6a6050, roughness: 0.85 })
    );
    col.position.y = 1.4;
    col.castShadow = true;
    f.add(col);
    // Top figure
    const top = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0x8a7a60, roughness: 0.9 })
    );
    top.position.y = 2.5;
    f.add(top);

    f.position.set(fx, 0, fz);
    city.add(f);
  }

  // ---- Market stalls ----
  const stallMat = new THREE.MeshStandardMaterial({ color: 0x4a2f1a, roughness: 0.85 });
  const canopyColors = [0x9a3030, 0x308a8a, 0x5a3a8a, 0x8a5a20];
  App.stallPositions = [];
  const stallDefs = [
    { x:-4,  z:-10, rot:0, type:'potion', color:0x4a9e4a, icon:'🧪' },
    { x: 4,  z:-10, rot:0, type:'weapon', color:0xff6030, icon:'⚔️' },
    { x:-4,  z: 10, rot:Math.PI, type:'armor', color:0x4a5aa0, icon:'🛡️' },
    { x: 4,  z: 10, rot:Math.PI, type:'runes', color:0xa04ad0, icon:'🔮' },
  ];
  for (const sp of stallDefs) {
    const stall = new THREE.Group();
    // Counter
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.75, 1.1), stallMat);
    counter.position.y = 0.38;
    counter.castShadow = true;
    counter.receiveShadow = true;
    stall.add(counter);
    // Canopy
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.14, 1.7),
      new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.9 })
    );
    canopy.position.y = 2.25;
    canopy.castShadow = true;
    stall.add(canopy);
    // Poles
    for (const px of [-1.1, 1.1]) for (const pz of [-0.55, 0.55]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.25, 6), stallMat);
      pole.position.set(px, 1.12, pz);
      stall.add(pole);
    }
    // Goods on counter
    for (let k = 0; k < 3; k++) {
      const item = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 10, 8),
        new THREE.MeshStandardMaterial({
          color: sp.color, emissive: sp.color, emissiveIntensity: 0.5,
          roughness: 0.4,
        })
      );
      item.position.set((k-1)*0.5, 0.88, 0);
      item.castShadow = true;
      stall.add(item);
    }
    stall.position.set(sp.x, 0, sp.z);
    stall.rotation.y = sp.rot;
    city.add(stall);
    App.stallPositions.push({ x: sp.x, z: sp.z, type: sp.type });
  }

  scene.add(city);
  App.cityGroup = city;
}

function buildNPCs(scene) {
  const types = [
    { id:'potion', name:'Аптекарь Линэль', emoji:'🧝‍♀️', text:'Зелья хранят жизнь.' },
    { id:'weapon', name:'Кузнец Борн', emoji:'🧔', text:'Сталь не лжёт.' },
    { id:'armor', name:'Бронник Мирра', emoji:'🛡️', text:'Броня — вторая кожа.' },
    { id:'runes', name:'Рунослов Тейн', emoji:'🧙', text:'Руны помнят древнее.' },
  ];
  App.npcs = [];
  if (!App.stallPositions) return;
  for (let i = 0; i < App.stallPositions.length; i++) {
    const sp = App.stallPositions[i];
    const npc = buildCharacter(RACES[i % RACES.length]);
    npc.scale.setScalar(0.95);
    npc.userData.baseScale = 0.95;
    npc.position.set(sp.x, 0, sp.z + 1.5);
    npc.rotation.y = Math.PI;
    npc.userData.isNPC = true;
    scene.add(npc);
    App.npcs.push(npc);
  }
}

function buildPlayer(scene) {
  if (App.player) {
    scene.remove(App.player);
    disposeObject(App.player);
  }
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const g = buildCharacter(race);
  g.position.set(0, 0, 0);
  g.userData.baseScale = 1.0;
  g.userData.vel = { x: 0, z: 0 };
  g.userData.hitFlash = 0;
  scene.add(g);
  App.player = g;
  console.log('[Game] Player built:', race.name);
}

function spawnEnemy(scene) {
  const a = rand(0, TAU);
  const r = rand(24, 50);
  const x = Math.cos(a)*r, z = Math.sin(a)*r;

  const baseRace = RACES[1];
  const mutant = {
    ...baseRace,
    id: 'mutant',
    color: 0xff2020,
    accent: 0xff4040,
    skin: [90, 40, 40],
    cloth: 0x2a0a0a,
    metal: [70, 30, 30],
    hair: 0x1a0505,
    hairStyle: 'mohawk',
  };
  const e = buildCharacter(mutant, { isMutant: true });
  e.position.set(x, 0, z);
  e.userData.baseScale = 1.05;
  e.scale.setScalar(1.05);
  e.userData.isEnemy = true;
  e.userData.hp = 55;
  e.userData.maxHp = 55;
  e.userData.speed = rand(1.8, 2.8);
  e.userData.damage = 8;
  e.userData.attackCd = 0;
  e.userData.hitFlash = 0;
  e.userData.vel = { x: 0, z: 0 };
  scene.add(e);
  App.enemies.push(e);
}

function buildRain(scene) {
  const count = 600;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vel = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3] = rand(-30, 30);
    pos[i*3+1] = rand(0, 40);
    pos[i*3+2] = rand(-30, 30);
    vel[i] = rand(22, 34);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const rain = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.14, color: 0xaaccff,
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  rain.userData.vel = vel;
  scene.add(rain);
  App.rain = rain;
}

function disposeObject(obj) {
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

// ---------------------------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------------------------
function startGameLoop() {
  if (App.gameRafId !== null) return;
  const loop = () => {
    App.gameRafId = requestAnimationFrame(loop);
    try {
      if (!App.gameClock || !App.gameScene || !App.gameCamera) return;
      const dt = Math.min(App.gameClock.getDelta(), 0.05);
      App.time += dt;

      // FPS counter
      App.stats.frames++;
      if (App.time - App.stats.lastFpsTime > 1) {
        App.stats.fps = App.stats.frames;
        App.stats.frames = 0;
        App.stats.lastFpsTime = App.time;
      }

      updateDayNight(dt);
      updateWeather(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateNPCs(dt);
      updateParticles(dt);
      updateCamera(dt);
      updateBanners(dt);
      updateCds(dt);
      updateSkillCds();

      if (App.player && App.gameKeyLight) {
        App.gameKeyLight.target.position.copy(App.player.position);
        App.gameKeyLight.position.set(
          App.player.position.x + 20, 30, App.player.position.z + 15
        );
      }

      updateHUD();
      updateMinimap();

      let ok = false;
      if (App.gameComposer) {
        try { App.gameComposer.render(); ok = true; }
        catch(e) { console.warn('[Game] composer fail', e); App.gameComposer = null; }
      }
      if (!ok) App.gameRenderer.render(App.gameScene, App.gameCamera);
    } catch(e) { console.error('[GameLoop]', e); }
  };
  loop();
}
function stopGameLoop() {
  if (App.gameRafId !== null) { cancelAnimationFrame(App.gameRafId); App.gameRafId = null; }
}

// ---------------------------------------------------------------------------
// WORLD UPDATE
// ---------------------------------------------------------------------------
function updateDayNight(dt) {
  App.dayTime = (App.dayTime + dt/240) % 1;
  const elev = Math.sin((App.dayTime - 0.25) * TAU) * 90;
  const f = clamp(elev/60 + 0.2, 0, 1);
  if (App.gameKeyLight) {
    App.gameKeyLight.intensity = 0.4 + f * 3.0;
    App.gameKeyLight.color.setHSL(lerp(0.07, 0.13, f), 0.75, lerp(0.5, 0.75, f));
  }
  App.gameRenderer.toneMappingExposure = lerp(0.65, 1.15, f);
  if (App.gameFog) {
    const c = new THREE.Color();
    c.setHSL(lerp(0.62, 0.08, f), 0.5, lerp(0.2, 0.65, f));
    App.gameFog.color.copy(c);
    App.gameScene.background.copy(c);
  }
}

function updateWeather(dt) {
  if (Math.random() < dt/60) {
    App.weather.targetRain = Math.random() < 0.35 ? 1 : 0;
  }
  App.weather.rain = lerp(App.weather.rain, App.weather.targetRain, 1-Math.pow(0.005, dt));
  if (App.rain) {
    App.rain.material.opacity = App.weather.rain * 0.75;
    const p = App.rain.geometry.attributes.position;
    const vel = App.rain.userData.vel;
    const cam = App.gameCamera;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - vel[i]*dt;
      if (y < 0) {
        y = rand(28, 40);
        p.setX(i, cam.position.x + rand(-25, 25));
        p.setZ(i, cam.position.z + rand(-25, 25));
      }
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }
}

function isInCity() {
  const p = App.player;
  if (!p) return false;
  return dist(p.position.x, p.position.z, 0, 0) < 20;
}

function updatePlayer(dt) {
  const p = App.player;
  if (!p) return;
  p.userData.hitFlash = Math.max(0, p.userData.hitFlash - dt);

  const speed = 5.5;
  const tx = App.playerInput.moveX * speed;
  const tz = App.playerInput.moveY * speed;
  p.userData.vel.x = lerp(p.userData.vel.x, tx, 1-Math.pow(0.001, dt));
  p.userData.vel.z = lerp(p.userData.vel.z, tz, 1-Math.pow(0.001, dt));
  p.position.x += p.userData.vel.x * dt;
  p.position.z += p.userData.vel.z * dt;

  const mag = Math.hypot(App.playerInput.moveX, App.playerInput.moveY);
  if (mag > 0.1) {
    const tf = Math.atan2(App.playerInput.moveX, App.playerInput.moveY);
    let diff = tf - p.rotation.y;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    p.rotation.y += diff * (1-Math.pow(0.0001, dt));
  }
  p.position.x = clamp(p.position.x, -100, 100);
  p.position.z = clamp(p.position.z, -100, 100);
  animateCharacter(p, dt, { baseScale: 1.0 });
}

function updateEnemies(dt) {
  const p = App.player;
  if (!p) return;
  for (let i = App.enemies.length-1; i >= 0; i--) {
    const e = App.enemies[i];
    if (!e || e.userData.hp <= 0) continue;
    e.userData.attackCd = Math.max(0, e.userData.attackCd - dt);
    e.userData.hitFlash = Math.max(0, e.userData.hitFlash - dt);

    if (isInCity()) {
      const away = Math.atan2(e.position.x, e.position.z);
      e.userData.vel.x = lerp(e.userData.vel.x, Math.sin(away)*3, 1-Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, Math.cos(away)*3, 1-Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      animateCharacter(e, dt, { baseScale: 1.05 });
      continue;
    }

    const dx = p.position.x - e.position.x;
    const dz = p.position.z - e.position.z;
    const d = Math.hypot(dx, dz);
    if (d > 1.2 && d < 14) {
      const nx = dx/d, nz = dz/d;
      e.userData.vel.x = lerp(e.userData.vel.x, nx*e.userData.speed, 1-Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, nz*e.userData.speed, 1-Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      const tf = Math.atan2(nx, nz);
      let diff = tf - e.rotation.y;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      e.rotation.y += diff * (1-Math.pow(0.001, dt));
    } else if (d <= 1.5 && e.userData.attackCd <= 0) {
      e.userData.attackCd = 1.3;
      App.hud.hp = Math.max(0, App.hud.hp - e.userData.damage);
      p.userData.hitFlash = 0.25;
      const fl = $('dmgFlash');
      if (fl) { fl.classList.add('hit'); setTimeout(()=>fl.classList.remove('hit'), 130); }
      ChatLog.add('combat', `${e.userData.damage} урона получено`);
      if (App.hud.hp <= 0) respawnPlayer();
    }
    animateCharacter(e, dt, { baseScale: 1.05 });
  }
}

function respawnPlayer() {
  const p = App.player;
  if (!p) return;
  p.position.set(0, 0, 5);
  App.hud.hp = App.hud.maxHp;
  App.hud.mana = App.hud.maxMana;
  showToast('ВОЗРОЖДЕНИЕ У ОБЕЛИСКА');
  ChatLog.add('system', 'Вы возродились в городе.');
}

function updateNPCs(dt) {
  for (const npc of App.npcs) {
    animateCharacter(npc, dt, { baseScale: 0.95 });
  }
}

function updateParticles(dt) {
  if (!App.gameScene) return;
  const keep = [];
  for (const pt of App.particles) {
    pt.userData.life -= dt;
    if (pt.userData.life <= 0) {
      App.gameScene.remove(pt);
      if (pt.geometry) pt.geometry.dispose();
      if (pt.material) pt.material.dispose();
      continue;
    }
    pt.position.x += pt.userData.vx * dt;
    pt.position.z += pt.userData.vz * dt;
    pt.position.y += pt.userData.vy * dt;
    pt.userData.vy -= 9.8 * dt * 0.5;
    pt.userData.vx *= Math.pow(0.1, dt);
    pt.userData.vz *= Math.pow(0.1, dt);
    const t = pt.userData.life / pt.userData.maxLife;
    pt.material.opacity = t;
    pt.scale.setScalar(0.4 + t*0.6);
    keep.push(pt);
  }
  App.particles = keep;
}

function updateBanners(dt) {
  if (!App.cityGroup) return;
  App.cityGroup.traverse((o) => {
    if (o.userData.isBanner) {
      const pos = o.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        pos.setZ(i, Math.sin(App.time*2 + (o.userData.phase||0) + y*3) * 0.1 * y);
      }
      pos.needsUpdate = true;
    }
    if (o.userData.isHalo) o.rotation.z = App.time * 0.7;
  });
}

function updateCds(dt) {
  for (const k of Object.keys(App.cd)) {
    App.cd[k] = Math.max(0, App.cd[k] - dt);
  }
  const btnAttack = $('btnAttack');
  if (btnAttack) {
    const c = Math.max(App.cd.light, App.cd.heavy);
    if (c > 0) {
      btnAttack.style.setProperty('--cd', (c/0.65*360) + 'deg');
      btnAttack.classList.add('cd-active');
    } else {
      btnAttack.classList.remove('cd-active');
    }
  }
}

function updateCamera(dt) {
  const p = App.player;
  if (!p || !App.gameCamera) return;
  const cam = App.gameCamera;

  const nearEnemies = App.enemies.filter(e =>
    dist(e.position.x, e.position.z, p.position.x, p.position.z) < 8
  ).length;

  let targetMode = 'idle';
  if (nearEnemies > 0 && !isInCity()) targetMode = 'combat';
  else if (isInCity()) targetMode = 'city';
  App.camMode = targetMode;

  let camDist = 7.5, camHeight = 4.8, lookY = 1.1;
  if (App.camMode === 'combat') { camDist = 5.8; camHeight = 3.8; lookY = 1.3; }
  else if (App.camMode === 'city') { camDist = 9; camHeight = 5.2; lookY = 1.2; }

  cam.position.x = lerp(cam.position.x, p.position.x, 1-Math.pow(0.0008, dt));
  cam.position.z = lerp(cam.position.z, p.position.z + camDist, 1-Math.pow(0.0008, dt));
  cam.position.y = lerp(cam.position.y, camHeight, 1-Math.pow(0.002, dt));
  cam.lookAt(p.position.x, lookY, p.position.z);

  if (p.userData.hitFlash > 0) {
    const s = p.userData.hitFlash * 15;
    cam.position.x += rand(-s, s) * 0.02;
    cam.position.y += rand(-s, s) * 0.02;
  }
}

// ---------------------------------------------------------------------------
// COMBAT
// ---------------------------------------------------------------------------
function playerAttack(type) {
  const p = App.player;
  if (!p) return;
  const cdKey = type === 'heavy' ? 'heavy' : 'light';
  if (App.cd[cdKey] > 0) return;
  App.cd[cdKey] = type === 'heavy' ? 0.65 : 0.35;

  const ad = p.userData.armData;
  if (ad && ad.right) {
    const orig = ad.right.rotation.x;
    ad.right.rotation.x = -1.3;
    setTimeout(() => { if (ad.right) ad.right.rotation.x = orig; }, 170);
  }

  const range = type === 'heavy' ? 3.2 : 2.3;
  const facing = p.rotation.y;
  let hits = 0;
  for (const e of App.enemies) {
    if (!e || e.userData.hp <= 0) continue;
    const dx = e.position.x - p.position.x;
    const dz = e.position.z - p.position.z;
    const d = Math.hypot(dx, dz);
    if (d > range) continue;
    const ang = Math.atan2(dx, dz);
    let diff = ang - facing;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    if (Math.abs(diff) > 1.4) continue;
    const dmg = type === 'heavy' ? 42 : 22;
    e.userData.hp -= dmg;
    e.userData.hitFlash = 0.25;
    e.userData.vel.x += (dx/d) * 5;
    e.userData.vel.z += (dz/d) * 5;
    spawnHitParticles(e.position, type === 'heavy');
    showDamageNumber(e.position, dmg, type === 'heavy' ? 'heavy' : 'slash');
    ChatLog.add('combat', `Нанесено ${dmg} урона`);
    hits++;
    if (e.userData.hp <= 0) killEnemy(e);
  }
  if (hits === 0 && type === 'heavy') {
    // Miss — dust cloud
    spawnHitParticles({
      x: p.position.x + Math.sin(facing) * 2,
      z: p.position.z + Math.cos(facing) * 2,
    }, false);
  }
}

function killEnemy(e) {
  const i = App.enemies.indexOf(e);
  if (i >= 0) App.enemies.splice(i, 1);
  if (App.gameScene) App.gameScene.remove(e);
  disposeObject(e);

  App.hud.xp += 25;
  App.hud.gold += randi(3, 12);
  App.killCount++;
  App.questProgress++;

  ChatLog.add('loot', `+${randi(3,12)} золота, +25 опыта`);

  if (App.hud.xp >= App.hud.xpNext) {
    App.hud.xp -= App.hud.xpNext;
    App.hud.xpNext = Math.floor(App.hud.xpNext * 1.4);
    App.hud.level++;
    App.hud.maxHp += 15;
    App.hud.hp = App.hud.maxHp;
    App.hud.maxMana += 10;
    App.hud.mana = App.hud.maxMana;
    showToast('УРОВЕНЬ ' + App.hud.level, 'magic');
    ChatLog.add('system', `Достигнут уровень ${App.hud.level}!`);
  }

  if (App.questProgress >= App.questGoal) {
    ChatLog.add('system', 'Задание выполнено! Вернитесь в город.');
    App.questProgress = 0;
    const q = $('questDesc');
    if (q) q.textContent = 'Новое задание: исследуйте лес';
  } else {
    const q = $('questDesc');
    if (q) q.textContent = `Уничтожено мутантов: ${App.questProgress} / ${App.questGoal}`;
  }

  setTimeout(() => {
    if (App.gameRafId !== null && App.gameScene) spawnEnemy(App.gameScene);
  }, 3500);
}

function playerCast() {
  if (App.cd.cast > 0 || App.hud.mana < 15) {
    if (App.hud.mana < 15) showToast('НЕ ХВАТАЕТ МАНЫ');
    return;
  }
  App.hud.mana -= 15;
  App.cd.cast = 0.9;
  const p = App.player;
  if (!p || !App.gameScene) return;
  const facing = p.rotation.y;
  const cx = p.position.x + Math.sin(facing) * 3;
  const cz = p.position.z + Math.cos(facing) * 3;

  // Fireball
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 14, 12),
    new THREE.MeshBasicMaterial({ color: 0xff8030, transparent: true, opacity: 0.95 })
  );
  sphere.position.set(cx, 1.2, cz);
  App.gameScene.add(sphere);
  // Light
  const light = new THREE.PointLight(0xff8030, 12, 6);
  light.position.set(cx, 1.2, cz);
  App.gameScene.add(light);
  const st = App.time;
  const tick = () => {
    if (!sphere.parent) return;
    const t = (App.time - st) / 0.55;
    if (t >= 1) {
      App.gameScene.remove(sphere);
      App.gameScene.remove(light);
      sphere.geometry.dispose();
      sphere.material.dispose();
      return;
    }
    sphere.scale.setScalar(1 + t * 2);
    light.intensity = 12 * (1 - t);
    requestAnimationFrame(tick);
  };
  tick();

  let hits = 0;
  for (const e of App.enemies) {
    if (dist(cx, cz, e.position.x, e.position.z) < 3) {
      const dmg = 55;
      e.userData.hp -= dmg;
      e.userData.hitFlash = 0.3;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, dmg, 'cast');
      ChatLog.add('combat', `Огненный шар: ${dmg} урона`);
      hits++;
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnMagicParticles(cx, cz, 0xff8030);
  if (hits === 0) showToast('ПРОМАХ', 'magic');
}

function playerUlt() {
  if (App.cd.ult > 0 || App.hud.mana < 40) {
    if (App.hud.mana < 40) showToast('НЕ ХВАТАЕТ МАНЫ');
    return;
  }
  App.hud.mana -= 40;
  App.cd.ult = 5.0;
  const p = App.player;
  if (!p) return;

  // Column of light
  const col = new THREE.Mesh(
    new THREE.CylinderGeometry(4, 4, 12, 24, 1, true),
    new THREE.MeshBasicMaterial({
      color: 0xb85aff, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
    })
  );
  col.position.set(p.position.x, 6, p.position.z);
  App.gameScene.add(col);
  const st = App.time;
  const tick = () => {
    if (!col.parent) return;
    const t = (App.time - st) / 1.2;
    if (t >= 1) {
      App.gameScene.remove(col);
      col.geometry.dispose();
      col.material.dispose();
      return;
    }
    col.material.opacity = 0.55 * (1 - t);
    col.scale.set(1 + t * 0.5, 1, 1 + t * 0.5);
    requestAnimationFrame(tick);
  };
  tick();

  for (const e of Array.from(App.enemies)) {
    if (dist(p.position.x, p.position.z, e.position.x, e.position.z) < 8) {
      const dmg = 120;
      e.userData.hp -= dmg;
      e.userData.hitFlash = 0.4;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, dmg, 'ult');
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnMagicParticles(p.position.x, p.position.z, 0xb85aff);
  showToast('РАЗЛОМ ОТКРЫТ!', 'magic');
  ChatLog.add('system', 'Вы применили РАЗЛОМ — массовое AOE.');
}

function playerDash() {
  if (App.cd.dash > 0) return;
  App.cd.dash = 2.0;
  const p = App.player;
  if (!p) return;
  const facing = p.rotation.y;
  p.position.x += Math.sin(facing) * 4.5;
  p.position.z += Math.cos(facing) * 4.5;
  spawnMagicParticles(p.position.x, p.position.z, 0x7cd9ff);
}

function playerHeal() {
  if (App.cd.heal > 0 || App.hud.mana < 25) {
    if (App.hud.mana < 25) showToast('НЕ ХВАТАЕТ МАНЫ');
    return;
  }
  App.hud.mana -= 25;
  App.cd.heal = 4.0;
  App.hud.hp = Math.min(App.hud.maxHp, App.hud.hp + 40);
  showToast('+40 HP', 'good');
  const p = App.player;
  if (p) spawnMagicParticles(p.position.x, p.position.z, 0x7cffb0);
}

function playerPotion() {
  if (App.cd.potion > 0) return;
  App.cd.potion = 3.0;
  App.hud.hp = Math.min(App.hud.maxHp, App.hud.hp + 25);
  App.hud.mana = Math.min(App.hud.maxMana, App.hud.mana + 15);
  showToast('+25 HP / +15 MP', 'good');
}

function spawnHitParticles(pos, big) {
  if (!App.gameScene) return;
  const n = big ? 16 : 8;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(2, 5);
    const geo = new THREE.SphereGeometry(rand(0.04, 0.1), 5, 4);
    const mat = new THREE.MeshBasicMaterial({
      color: Math.random() < 0.5 ? 0xffc879 : 0xff6060,
      transparent: true, opacity: 0.95,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(pos.x, rand(0.5, 1.2), pos.z);
    pt.userData.vx = Math.cos(a) * s;
    pt.userData.vz = Math.sin(a) * s;
    pt.userData.vy = rand(1, 4);
    pt.userData.life = rand(0.4, 0.9);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function spawnMagicParticles(cx, cz, color) {
  if (!App.gameScene) return;
  for (let i = 0; i < 20; i++) {
    const a = rand(0, TAU);
    const r = rand(0.2, 0.6);
    const geo = new THREE.SphereGeometry(rand(0.05, 0.14), 6, 5);
    const mat = new THREE.MeshBasicMaterial({
      color: color || 0xb85aff, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(cx + Math.cos(a)*r, rand(0.5, 1.5), cz + Math.sin(a)*r);
    pt.userData.vx = Math.cos(a)*rand(3, 8);
    pt.userData.vz = Math.sin(a)*rand(3, 8);
    pt.userData.vy = rand(2, 6);
    pt.userData.life = rand(0.5, 1.2);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function showDamageNumber(pos, dmg, kind) {
  if (!App.gameScene) return;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  if (!ctx) return;
  ctx.font = 'bold 44px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.95)';
  let color = '#ffffff';
  if (kind === 'heavy') color = '#ffd88a';
  else if (kind === 'cast') color = '#ffb060';
  else if (kind === 'ult') color = '#ff80d0';
  const txt = '-' + Math.round(dmg);
  ctx.strokeText(txt, 64, 32);
  ctx.fillStyle = color;
  ctx.fillText(txt, 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.position.set(pos.x, 2.0, pos.z);
  sprite.scale.set(1.5, 0.75, 1);
  sprite.userData.vy = 2.2;
  sprite.userData.vx = 0;
  sprite.userData.vz = 0;
  sprite.userData.life = 1.0;
  sprite.userData.maxLife = 1.0;
  App.gameScene.add(sprite);
  App.particles.push(sprite);
}

// ---------------------------------------------------------------------------
// HUD UPDATE
// ---------------------------------------------------------------------------
function updateHUD() {
  const hp = App.hud;
  const hpFill = $('hpFill');
  const mpFill = $('mpFill');
  const xpFill = $('xpFill');
  const hpText = $('hpText');
  const mpText = $('mpText');
  const pcLvl = $('pcLvl');

  if (hpFill) hpFill.style.width = (hp.hp / hp.maxHp * 100) + '%';
  if (mpFill) mpFill.style.width = (hp.mana / hp.maxMana * 100) + '%';
  if (xpFill) xpFill.style.width = (hp.xp / hp.xpNext * 100) + '%';
  if (hpText) hpText.textContent = `${Math.round(hp.hp)} / ${hp.maxHp}`;
  if (mpText) mpText.textContent = `${Math.round(hp.mana)} / ${hp.maxMana}`;
  if (pcLvl) pcLvl.textContent = String(hp.level);

  // Regen
  hp.mana = clamp(hp.mana + 5 * 0.016, 0, hp.maxMana);
  if (isInCity()) hp.hp = clamp(hp.hp + 6 * 0.016, 0, hp.maxHp);
}

function updateMinimap() {
  const ctx = App.minimapCtx;
  const canvas = $('minimap');
  if (!ctx || !canvas || !App.player) return;
  const W = canvas.width, H = canvas.height;
  const p = App.player;
  const range = 55;
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
  bg.addColorStop(0, 'rgba(20,30,60,.9)');
  bg.addColorStop(1, 'rgba(5,8,20,.95)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const toScreen = (wx, wz) => ({
    x: W/2 + ((wx - p.position.x)/range) * (W/2),
    y: H/2 + ((wz - p.position.z)/range) * (H/2),
  });

  // City circle
  const c = toScreen(0, 0);
  ctx.fillStyle = 'rgba(124,217,255,.12)';
  ctx.strokeStyle = 'rgba(124,217,255,.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(c.x, c.y, (20/range)*(W/2), 0, TAU);
  ctx.fill();
  ctx.stroke();

  // NPCs (gold)
  for (const n of App.npcs) {
    const s = toScreen(n.position.x, n.position.z);
    ctx.fillStyle = '#ffe7b0';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 5, 0, TAU);
    ctx.fill();
  }
  // Enemies (red)
  for (const e of App.enemies) {
    const s = toScreen(e.position.x, e.position.z);
    ctx.fillStyle = '#ff4040';
    ctx.shadowColor = '#ff2020';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 4, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  // Player arrow (center)
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(p.rotation.y);
  ctx.fillStyle = '#7cd9ff';
  ctx.shadowColor = '#7cd9ff';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(7, 8);
  ctx.lineTo(0, 5);
  ctx.lineTo(-7, 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const coordsEl = $('mapCoords');
  if (coordsEl) {
    const zone = isInCity() ? 'ТИХИЙ ПРИЧАЛ' : 'ЛЕС ШЕПЧУЩИХ';
    coordsEl.textContent = `X:${Math.round(p.position.x)} Z:${Math.round(p.position.z)} · ${zone}`;
  }
}

// ---------------------------------------------------------------------------
// INPUT — robust joystick + skill buttons
// ---------------------------------------------------------------------------
const Input = {
  joystick: {
    active: false,
    pointerId: null,
    curX: 0, curY: 0,
    homeX: 0, homeY: 0,
    maxR: 60,
    el: null,
    knob: null,
  },

  init() {
    this.joystick.el = $('joystick');
    this.joystick.knob = $('joyKnob');
    if (!this.joystick.el || !this.joystick.knob) return;

    // Set initial home position from CSS
    this.setHomeFromLayout();

    // Attach to window — most reliable
    window.addEventListener('pointerdown', (e) => this.onDown(e), { passive: false });
    window.addEventListener('pointermove', (e) => this.onMove(e), { passive: false });
    window.addEventListener('pointerup', (e) => this.onUp(e), { passive: false });
    window.addEventListener('pointercancel', (e) => this.onUp(e), { passive: false });

    // Kill joystick if window loses focus
    window.addEventListener('blur', () => this.resetJoystick());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.resetJoystick();
    });

    // Keyboard for desktop testing
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
  },

  setHomeFromLayout() {
    const j = this.joystick;
    if (!j.el) return;
    // Home: bottom-left above the chat area
    const w = window.innerWidth;
    const h = window.innerHeight;
    // Aim for ~130px from left, ~130px from bottom (but above safe area)
    const x = Math.max(120, w * 0.14);
    const y = h - Math.max(120, h * 0.16);
    j.homeX = x;
    j.homeY = y;
    j.curX = x;
    j.curY = y;
    j.el.style.left = x + 'px';
    j.el.style.top = y + 'px';
    j.el.classList.add('visible');
    this.resetKnobVisual();
  },

  resetKnobVisual() {
    if (this.joystick.knob) {
      this.joystick.knob.style.transform = 'translate(-50%,-50%)';
    }
  },

  resetJoystick() {
    const j = this.joystick;
    j.active = false;
    j.pointerId = null;
    App.playerInput.moveX = 0;
    App.playerInput.moveY = 0;
    this.resetKnobVisual();
    if (j.el) {
      j.el.classList.remove('active');
      j.curX = j.homeX;
      j.curY = j.homeY;
      j.el.style.left = j.homeX + 'px';
      j.el.style.top = j.homeY + 'px';
    }
  },

  onDown(e) {
    const j = this.joystick;
    if (j.pointerId !== null) return;  // already captured
    if (!j.el) return;

    // Don't capture if the touch is on an interactive UI element
    const tgt = e.target;
    if (tgt && tgt.closest && tgt.closest('button, .skill-slot, .hud.interactive, #chatPanel, #minimapPanel, #portraitPanel, #raidFrames')) {
      return;
    }

    // Only activate in left half of screen
    if (e.clientX > window.innerWidth * 0.55) return;
    // Only activate below top HUD area (avoid portrait / minimap)
    if (e.clientY < 100) return;

    j.pointerId = e.pointerId;
    j.active = true;
    j.curX = e.clientX;
    j.curY = e.clientY;
    j.el.style.left = e.clientX + 'px';
    j.el.style.top = e.clientY + 'px';
    j.el.classList.add('active');
    this.updateKnob(e.clientX, e.clientY);
    e.preventDefault();
  },

  onMove(e) {
    const j = this.joystick;
    if (!j.active || j.pointerId !== e.pointerId) return;
    this.updateKnob(e.clientX, e.clientY);
    e.preventDefault();
  },

  onUp(e) {
    const j = this.joystick;
    if (j.pointerId !== e.pointerId) return;
    this.resetJoystick();
    e.preventDefault();
  },

  updateKnob(clientX, clientY) {
    const j = this.joystick;
    let dx = clientX - j.curX;
    let dy = clientY - j.curY;
    const d = Math.hypot(dx, dy);
    if (d > j.maxR) {
      dx = (dx/d) * j.maxR;
      dy = (dy/d) * j.maxR;
    }
    j.knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    const mag = Math.hypot(dx, dy) / j.maxR;
    if (mag < 0.15) {
      App.playerInput.moveX = 0;
      App.playerInput.moveY = 0;
    } else {
      App.playerInput.moveX = dx / j.maxR;
      App.playerInput.moveY = dy / j.maxR;
    }
  },

  onKey(e, down) {
    const k = e.key.toLowerCase();
    const v = down ? 1 : 0;
    if (k === 'w' || k === 'arrowup') App.playerInput.moveY = down ? -1 : 0;
    if (k === 's' || k === 'arrowdown') App.playerInput.moveY = down ? 1 : 0;
    if (k === 'a' || k === 'arrowleft') App.playerInput.moveX = down ? -1 : 0;
    if (k === 'd' || k === 'arrowright') App.playerInput.moveX = down ? 1 : 0;
    if (!down) return;
    if (k === ' ') { e.preventDefault(); playerAttack('light'); }
    if (k === 'e') playerCast();
    if (k === 'q') playerUlt();
    if (k === 'shift') playerDash();
    if (k === 'f') playerHeal();
    if (k === 'r') playerPotion();
  },
};

// Attack button (large) — hold for heavy
function initAttackButton() {
  const btn = $('btnAttack');
  if (!btn) return;
  let holdTimer = null;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    playerAttack('light');
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(() => playerAttack('heavy'), 220);
  }, { passive: false });
  const clr = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
  btn.addEventListener('pointerup', clr);
  btn.addEventListener('pointercancel', clr);
  btn.addEventListener('pointerleave', clr);
}

// ---------------------------------------------------------------------------
// RACE UI
// ---------------------------------------------------------------------------
function buildRaceUI() {
  const list = $('raceList');
  if (!list) return;
  list.innerHTML = '';
  for (const r of RACES) {
    const c = document.createElement('div');
    c.className = 'race-card';
    c.dataset.raceId = r.id;
    c.innerHTML = `
      <div class="rc-name">${r.name}</div>
      <div class="rc-desc">${r.desc}</div>
      <div class="rc-tag">${r.tag}</div>
    `;
    c.addEventListener('click', () => selectRace(r.id));
    list.appendChild(c);
  }
  selectRace(App.currentRace);
}

function selectRace(id) {
  App.currentRace = id;
  const race = RACES.find(r => r.id === id);
  if (!race) return;
  document.querySelectorAll('.race-card').forEach(el => {
    el.classList.toggle('active', el.dataset.raceId === id);
  });
  const setStat = (id, barId, val) => {
    const el = $(id), bar = $(barId);
    if (el) el.textContent = String(val);
    if (bar) bar.style.width = (val / 15 * 100) + '%';
  };
  setStat('statStr', 'barStr', race.stats.str);
  setStat('statAgi', 'barAgi', race.stats.agi);
  setStat('statInt', 'barInt', race.stats.int);
  setStat('statEth', 'barEth', race.stats.eth);
  rebuildMenuCharacter();
}

// ---------------------------------------------------------------------------
// RESIZE
// ---------------------------------------------------------------------------
function handleResize() {
  const w = Math.max(window.innerWidth, 320);
  const h = Math.max(window.innerHeight, 240);

  if (App.menuRenderer && App.menuCamera) {
    App.menuRenderer.setSize(w, h, false);
    App.menuCamera.aspect = w/h;
    App.menuCamera.updateProjectionMatrix();
    if (App.menuComposer) App.menuComposer.setSize(w, h);
  }
  if (App.gameRenderer && App.gameCamera) {
    App.gameRenderer.setSize(w, h, false);
    App.gameCamera.aspect = w/h;
    App.gameCamera.updateProjectionMatrix();
    if (App.gameComposer) App.gameComposer.setSize(w, h);
  }
  // Reposition joystick home on resize
  if (Input.joystick && !Input.joystick.active) {
    Input.setHomeFromLayout();
  }
}
window.addEventListener('resize', handleResize, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(handleResize, 200), { passive: true });

// ---------------------------------------------------------------------------
// MENU → GAME TRANSITION
// ---------------------------------------------------------------------------
async function enterGame() {
  const lbl = $('btnPlay');
  if (lbl) lbl.textContent = 'СОЗДАНИЕ РАЗЛОМА…';
  stopMenuLoop();

  const menuEl = $('menu'); if (menuEl) menuEl.style.display = 'none';
  const menuCanvas = $('menuCanvas'); if (menuCanvas) menuCanvas.style.display = 'none';
  const gameEl = $('game'); if (gameEl) gameEl.classList.add('active');
  const gameCanvas = $('gameCanvas'); if (gameCanvas) gameCanvas.style.display = 'block';

  // Rebuild player with selected race
  if (App.gameScene) buildPlayer(App.gameScene);

  handleResize();
  if (App.gameClock) App.gameClock.getDelta();
  startGameLoop();
  showToast('ДОБРО ПОЖАЛОВАТЬ В AETHELGARD', 'magic');
  ChatLog.add('system', 'Вы вошли в мир. Тихое место, не так ли?');
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
async function boot() {
  try {
    Loader.pct(3);
    Loader.text('Проверка WebGL…');
    await new Promise(r => setTimeout(r, 60));

    const test = document.createElement('canvas');
    if (!test.getContext('webgl2') && !test.getContext('webgl')) {
      throw new Error('WebGL не поддерживается');
    }

    await loadDeps();

    Loader.pct(28);
    Loader.text('Строим меню…');
    await new Promise(r => setTimeout(r, 60));
    buildMenuScene();

    Loader.pct(58);
    Loader.text('Генерация мира…');
    await new Promise(r => setTimeout(r, 60));
    buildGameScene();

    Loader.pct(80);
    Loader.text('Разогрев шейдеров…');
    if (App.menuRenderer) try { App.menuRenderer.compile(App.menuScene, App.menuCamera); } catch(e){}
    if (App.gameRenderer) try { App.gameRenderer.compile(App.gameScene, App.gameCamera); } catch(e){}
    await new Promise(r => setTimeout(r, 150));

    // Build UI
    buildRaceUI();
    buildRaidFrames();
    buildSkillBar();
    initAttackButton();
    Input.init();
    ChatLog.init();

    Loader.pct(100);
    Loader.text('Готово!');
    Loader.ready();
    window.__apexReady = true;

    const startBtn = $('loaderStart');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        Loader.hide();
        setTimeout(() => {
          const m = $('menu'); if (m) m.style.display = 'block';
          handleResize();
          if (App.menuClock) App.menuClock.getDelta();
          startMenuLoop();
        }, 400);
      });
    }

    const playBtn = $('btnPlay');
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        enterGame().catch(e => console.error('[Play]', e));
      });
    }

    console.log('[Boot] Complete');
  } catch(e) {
    console.error('[Boot] Failed:', e);
    window.__apexFailed = true;
    Loader.text('Ошибка');
    Loader.error(e.message || 'Неизвестная ошибка');
  }
}

// Pause when hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopMenuLoop();
    stopGameLoop();
    Input.resetJoystick();
  } else {
    const gameEl = $('game');
    if (gameEl && gameEl.classList.contains('active')) {
      if (App.gameClock) App.gameClock.getDelta();
      startGameLoop();
    } else {
      const menuEl = $('menu');
      if (menuEl && menuEl.style.display !== 'none') {
        if (App.menuClock) App.menuClock.getDelta();
        startMenuLoop();
      }
    }
  }
}, { passive: true });

boot();
</script>
