<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0612">
<title>APEX — Rifters of Aethelgard</title>
<style>
/* ============================================================
   APEX — Full MMO HUD (Warhammer Online style) + landscape mobile
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
  --gold:#ffd68a; --gold-d:#8a5a1c; --gold-l:#ffe7b0;
  --blood:#c9384a; --mana:#3b7ad6; --energy:#e0a020;
  --panel-bg:linear-gradient(135deg,rgba(18,12,26,.94),rgba(8,5,14,.97));
  --panel-border:1px solid rgba(180,140,80,.55);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05030a;
  color:#e8dfd0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Cinzel",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased}
canvas{display:block;outline:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}

/* ============== VIGNETTE OVERLAY ============== */
.vignette{position:absolute;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}

/* ============== LOADER ============== */
#loader{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#1a0a28 0%,#05030a 70%);transition:opacity .6s ease}
#loader.hide{opacity:0;pointer-events:none}
.rune{width:88px;height:88px;margin-bottom:22px;border-radius:50%;
  border:2px solid transparent;border-top-color:#ffd68a;border-bottom-color:rgba(180,80,255,.6);
  box-shadow:0 0 30px rgba(255,180,80,.5);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:"Cinzel",Georgia,serif;font-size:36px;letter-spacing:.4em;
  color:#ffe7b0;margin:0 0 22px;font-weight:900;
  text-shadow:0 0 20px rgba(255,180,80,.8),0 0 50px rgba(255,120,40,.4)}
.loader-bar{width:min(400px,80vw);height:6px;border-radius:3px;
  background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(180,140,80,.35)}
.loader-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#8a5a1c,#ffe7b0,#ff9c4a);
  box-shadow:0 0 18px #ffd68a;transition:width .3s ease}
.loader-status{margin-top:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:#d8c7a0;opacity:.9;text-align:center;font-family:"Cinzel",Georgia,serif;min-height:14px}
.loader-percent{margin-top:6px;font-family:"Cinzel",Georgia,serif;font-size:22px;
  font-weight:700;color:#ffe7b0;letter-spacing:.12em}
.loader-start{margin-top:22px;padding:15px 46px;font-family:"Cinzel",Georgia,serif;
  font-size:14px;letter-spacing:.35em;text-transform:uppercase;font-weight:700;color:#1a0d04;
  border-radius:4px;background:linear-gradient(180deg,#ffe4a0 0%,#e0a94e 45%,#a06b20 55%,#52330c 100%);
  box-shadow:0 0 40px rgba(255,180,80,.7),0 12px 30px rgba(0,0,0,.85);
  opacity:.35;pointer-events:none;transition:all .25s ease}
.loader-start.ready{opacity:1;pointer-events:auto}
.loader-start.ready:active{transform:scale(.97)}
.loader-error{margin-top:16px;padding:10px 16px;color:#ffb0b0;font-size:11px;
  background:rgba(80,20,20,.7);border:1px solid rgba(255,100,100,.6);border-radius:8px;
  max-width:80vw;text-align:center;display:none;line-height:1.5;word-break:break-word}

/* ============== RACE SELECT ============== */
#menu{position:absolute;inset:0;z-index:50;display:none}
#logo{position:absolute;top:calc(2% + var(--sa-t));left:50%;transform:translateX(-50%);
  text-align:center;pointer-events:none;z-index:2}
#logo h1{margin:0;font-family:"Cinzel",Georgia,serif;font-size:clamp(34px,6vw,76px);
  letter-spacing:.35em;font-weight:900;
  background:linear-gradient(180deg,#fff1ce 0%,#e8c88c 40%,#b8823a 70%,#6b4520 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,190,110,.7))}
#logo .sub{margin-top:2px;font-size:clamp(9px,1vw,11px);letter-spacing:.7em;
  color:#d8c7a0;opacity:.85;text-transform:uppercase;font-weight:600}
#logo .sub span{color:#ff9c4a;text-shadow:0 0 8px rgba(255,140,60,.9)}

.race-panel{position:absolute;top:calc(22% + var(--sa-t));left:calc(2% + var(--sa-l));
  width:clamp(200px,22vw,290px);padding:16px;z-index:2;
  background:var(--panel-bg);border:var(--panel-border);border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.85),inset 0 0 30px rgba(255,180,80,.05)}
.race-panel h2{margin:0 0 10px;font-family:"Cinzel",Georgia,serif;font-size:12px;
  letter-spacing:.28em;color:var(--gold);text-transform:uppercase;text-align:center;
  text-shadow:0 0 12px rgba(255,180,80,.6)}
.race-list{display:flex;flex-direction:column;gap:6px}
.race-card{position:relative;padding:9px 11px;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg,rgba(50,35,80,.55),rgba(15,10,25,.85));
  border:1px solid rgba(140,110,70,.45);transition:all .25s ease}
.race-card.active{border-color:#ffc879;
  background:linear-gradient(135deg,rgba(90,60,30,.85),rgba(40,25,60,.95));
  box-shadow:0 0 22px rgba(255,180,80,.5);transform:translateX(5px)}
.rc-name{font-family:"Cinzel",Georgia,serif;font-size:11.5px;letter-spacing:.12em;
  color:#f0dcb4;margin-bottom:2px;text-transform:uppercase}
.race-card.active .rc-name{color:#ffe7b0}
.rc-desc{font-size:9px;line-height:1.3;color:rgba(220,200,180,.7)}
.rc-tag{display:inline-block;padding:2px 6px;margin-top:4px;font-size:7.5px;
  letter-spacing:.18em;border:1px solid rgba(255,180,80,.5);border-radius:3px;
  color:#ffbe72;text-transform:uppercase}

.stats-panel{position:absolute;top:calc(22% + var(--sa-t));right:calc(2% + var(--sa-r));
  width:clamp(180px,20vw,260px);padding:14px;z-index:2;
  background:var(--panel-bg);border:var(--panel-border);border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.85)}
.stats-panel h3{margin:0 0 8px;font-family:"Cinzel",Georgia,serif;font-size:11px;
  letter-spacing:.28em;color:var(--gold);text-align:center;text-transform:uppercase}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:10.5px}
.stat-row .lbl{color:rgba(220,200,180,.75);letter-spacing:.1em;text-transform:uppercase;font-size:8.5px}
.stat-row .val{color:#ffe7b0;font-weight:700;font-size:11.5px}
.stat-bar{height:3px;border-radius:2px;margin-top:2px;background:rgba(0,0,0,.6);overflow:hidden}
.stat-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff8040,#ffd070);
  transition:width .5s ease}

.btn-play{position:absolute;bottom:calc(4% + var(--sa-b));left:50%;transform:translateX(-50%);
  z-index:20;padding:18px 68px;font-family:"Cinzel",Georgia,serif;
  font-size:clamp(14px,1.6vw,19px);letter-spacing:.35em;text-transform:uppercase;font-weight:900;
  color:#1a0d04;border-radius:6px;
  background:linear-gradient(180deg,#fff0c4 0%,#ffd070 30%,#e0a94e 55%,#8a5a1c 100%);
  box-shadow:0 0 0 1px rgba(255,240,190,1) inset,0 0 0 4px rgba(60,30,10,.95) inset,
  0 0 60px rgba(255,200,120,.85),0 18px 40px rgba(0,0,0,.9);
  transition:all .25s ease;white-space:nowrap}
.btn-play:active{transform:translateX(-50%) scale(.97)}

/* ============================================================
   GAME HUD — full MMO layout
   ============================================================ */
#game{position:absolute;inset:0;z-index:5;display:none}
#game.active{display:block}

/* --- Common panel style --- */
.hud{position:absolute;z-index:10;pointer-events:none}
.hud.interactive{pointer-events:auto}
.panel{background:var(--panel-bg);border:var(--panel-border);border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.8),inset 0 0 20px rgba(255,180,80,.04),
  0 0 0 1px rgba(255,200,120,.08) inset}

/* --- PORTRAIT + HP/MP (top-left) --- */
#portraitPanel{left:calc(8px + var(--sa-l));top:calc(8px + var(--sa-t));
  width:190px;padding:8px;display:flex;gap:8px;align-items:center}
.avatar{width:62px;height:62px;border-radius:50%;flex-shrink:0;position:relative;
  background:radial-gradient(circle at 40% 30%,rgba(255,220,150,.35),rgba(40,20,60,.9));
  border:2px solid rgba(255,200,120,.75);
  box-shadow:0 0 18px rgba(255,180,80,.55),inset 0 0 16px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;font-size:34px}
.avatar-lvl{position:absolute;bottom:-4px;right:-4px;
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(180deg,#ffe4a0,#a06b20);
  color:#1a0d04;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(0,0,0,.6);
  box-shadow:0 2px 6px rgba(0,0,0,.7),0 0 10px rgba(255,180,80,.6)}
.stats-stack{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.pc-name{font-size:10px;letter-spacing:.12em;color:#ffe7b0;text-transform:uppercase;
  font-weight:700;text-shadow:0 0 8px rgba(255,200,120,.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:3px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.9));
  border:1px solid rgba(0,0,0,.7);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.bar-fill{position:absolute;inset:0;width:100%;transition:width .25s linear;
  background-size:100% 100%}
.bar-hp .bar-fill{background:linear-gradient(180deg,#ff5a5a,#8a1a1a);box-shadow:0 0 10px rgba(255,80,80,.7)}
.bar-mp .bar-fill{background:linear-gradient(180deg,#5a9aff,#1a3a8a);box-shadow:0 0 10px rgba(90,150,255,.7)}
.bar-xp .bar-fill{background:linear-gradient(180deg,#ffd070,#8a5a1c);box-shadow:0 0 10px rgba(255,200,80,.7)}
.bar-xp{height:6px}
.bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  padding:0 5px;font-size:9px;font-weight:700;color:#fff;
  text-shadow:0 0 4px #000,0 0 6px #000;z-index:2;letter-spacing:.05em}

/* --- RAID FRAMES (below portrait) --- */
#raidFrames{left:calc(8px + var(--sa-l));top:calc(82px + var(--sa-t));
  width:190px;display:flex;flex-direction:column;gap:3px}
.raid-row{display:flex;gap:6px;align-items:center;padding:3px 5px;
  background:linear-gradient(90deg,rgba(20,15,30,.85),rgba(10,8,18,.75));
  border:1px solid rgba(120,90,60,.4);border-radius:4px}
.raid-av{width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 40% 30%,rgba(255,220,150,.35),rgba(40,20,60,.9));
  border:1px solid rgba(255,200,120,.6);
  display:flex;align-items:center;justify-content:center;font-size:12px}
.raid-info{flex:1;min-width:0}
.raid-name{font-size:9px;color:#e0cba0;letter-spacing:.06em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raid-hp{height:6px;margin-top:2px;border-radius:2px;overflow:hidden;
  background:rgba(0,0,0,.7);border:1px solid rgba(0,0,0,.8)}
.raid-hp i{display:block;height:100%;background:linear-gradient(180deg,#6ec86e,#205a20);
  transition:width .3s ease}

/* --- MINIMAP (top-right) --- */
#minimapPanel{right:calc(8px + var(--sa-r));top:calc(8px + var(--sa-t));
  width:150px;padding:6px}
.minimap-inner{position:relative;width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at center,rgba(20,30,60,.95),rgba(5,8,20,.98));
  border:2px solid rgba(180,140,80,.75);
  box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 22px rgba(120,80,40,.4)}
#minimap{width:100%;height:100%;display:block}
.compass-rose{position:absolute;inset:2px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,
    rgba(255,200,120,.25) 0deg 1deg,transparent 1deg 89deg,
    rgba(255,200,120,.4) 89deg 91deg,transparent 91deg 179deg,
    rgba(255,200,120,.25) 179deg 181deg,transparent 181deg 269deg,
    rgba(255,200,120,.4) 269deg 271deg,transparent 271deg 359deg);
  mix-blend-mode:screen}
.map-coords{margin-top:4px;font-size:9px;letter-spacing:.15em;color:#d8c7a0;
  text-align:center;text-transform:uppercase}
.quest-tracker{margin-top:6px;padding:6px 8px;border-radius:6px;
  background:rgba(0,0,0,.5);border-left:3px solid #ffd68a;
  font-size:9.5px;color:#e0cba0;letter-spacing:.06em;line-height:1.4}
.quest-tracker .qt-title{color:#ffd68a;font-weight:700;text-transform:uppercase;
  font-size:9px;letter-spacing:.15em}

/* --- CHAT (bottom-left above joystick) --- */
#chatPanel{left:calc(8px + var(--sa-l));bottom:calc(210px + var(--sa-b));
  width:clamp(200px,26vw,300px);height:110px;display:flex;flex-direction:column;
  font-size:11px}
.chat-tabs{display:flex;background:rgba(0,0,0,.6);border-radius:6px 6px 0 0;
  border-bottom:1px solid rgba(180,140,80,.4)}
.chat-tab{flex:1;padding:4px 6px;font-size:9px;text-align:center;color:#a89478;
  cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:all .15s}
.chat-tab.active{color:#ffd68a;background:linear-gradient(180deg,rgba(255,180,80,.15),transparent);
  text-shadow:0 0 8px rgba(255,180,80,.6)}
.chat-log{flex:1;overflow-y:auto;padding:4px 6px;
  background:rgba(0,0,0,.55);
  display:flex;flex-direction:column-reverse;gap:2px;
  scrollbar-width:thin;scrollbar-color:rgba(180,140,80,.5) transparent}
.chat-log::-webkit-scrollbar{width:3px}
.chat-log::-webkit-scrollbar-thumb{background:rgba(180,140,80,.5);border-radius:2px}
.chat-line{font-size:10px;line-height:1.35;color:#d8c7a0;word-wrap:break-word}
.chat-line .who{color:#9cc8ff;font-weight:600}
.chat-line .who.party{color:#9cff9c}
.chat-line .who.guild{color:#ffb4e0}
.chat-line .sys{color:#ffd68a}
.chat-line .dmg{color:#ff8888}
.chat-line .loot{color:#ffe7b0;font-weight:600}
.chat-tabs .chat-input-btn{color:#a89478;flex:0.7;font-size:10px}

/* --- SKILL BAR (bottom-right) --- */
#skillBar{right:calc(8px + var(--sa-r));bottom:calc(8px + var(--sa-b));
  width:clamp(280px,40vw,460px);height:88px;position:relative}
.skill-grid{position:absolute;left:0;right:110px;top:0;height:88px;
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:44px 44px;
  gap:4px;padding:4px;background:var(--panel-bg);border:var(--panel-border);
  border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.85)}
.skill-slot{position:relative;border-radius:6px;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,rgba(40,25,60,.9),rgba(15,10,25,.95));
  border:1px solid rgba(180,140,80,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:all .12s ease;
  box-shadow:inset 0 0 12px rgba(0,0,0,.7)}
.skill-slot:hover{border-color:rgba(255,220,160,.95);
  box-shadow:0 0 14px rgba(255,200,120,.5),inset 0 0 12px rgba(0,0,0,.7)}
.skill-slot:active{transform:scale(.93)}
.skill-slot.locked{opacity:.4;filter:grayscale(1)}
.skill-slot .slot-key{position:absolute;top:1px;left:3px;font-size:8px;
  color:#c8b088;font-weight:700;text-shadow:0 0 4px #000}
.skill-slot .slot-cd{position:absolute;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;
  text-shadow:0 0 4px #000;pointer-events:none;transform-origin:top;
  transition:transform .1s linear}
.skill-slot.cd-active .slot-cd{transform:scaleY(1)}
.skill-slot.cd-active .slot-cd.hidden{transform:scaleY(0)}
.skill-slot.ready-anim{animation:slotReady .6s ease}
@keyframes slotReady{0%{box-shadow:0 0 30px rgba(255,220,120,1),inset 0 0 20px rgba(255,220,120,.6)}
  100%{box-shadow:inset 0 0 12px rgba(0,0,0,.7)}}

/* --- BIG ATTACK BUTTON --- */
#btnAttack{position:absolute;right:0;bottom:0;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,220,150,.6),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(180,90,30,.95),rgba(40,15,5,.98));
  border:3px solid rgba(255,220,150,.95);
  box-shadow:0 0 40px rgba(255,180,80,.8),inset 0 0 30px rgba(255,200,120,.4),
  0 8px 20px rgba(0,0,0,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff8e0;font-family:"Cinzel",Georgia,serif;
  text-shadow:0 0 12px rgba(255,200,120,1),0 2px 4px rgba(0,0,0,.9);
  transition:transform .08s ease-out;touch-action:none;user-select:none;
  font-weight:700;letter-spacing:.1em;cursor:pointer;z-index:2}
#btnAttack .big-icon{font-size:32px;line-height:1}
#btnAttack .big-label{font-size:9px;letter-spacing:.2em;margin-top:2px;opacity:.95}
#btnAttack:active{transform:scale(.92);
  box-shadow:0 0 70px rgba(255,220,150,1),inset 0 0 40px rgba(255,220,120,.6),
  0 4px 10px rgba(0,0,0,.9)}
#btnAttack.cd-active::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -90deg,rgba(0,0,0,.7) var(--cd,0deg),transparent var(--cd,0deg))}

/* --- VIRTUAL JOYSTICK --- */
#joystick{position:absolute;width:180px;height:180px;z-index:15;
  transform:translate(-50%,-50%);
  transition:left .25s ease,top .25s ease,opacity .2s ease;
  pointer-events:none;opacity:0}
#joystick.visible{opacity:1}
#joystick.active{transition:none}
.joy-base{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,rgba(30,55,100,.35),rgba(8,15,35,.6));
  border:3px solid rgba(140,200,255,.75);
  box-shadow:0 0 30px rgba(80,160,255,.55),inset 0 0 50px rgba(60,120,240,.35),
  0 0 0 4px rgba(0,0,0,.35)}
.joy-base::before{content:"";position:absolute;inset:18px;border-radius:50%;
  border:1px dashed rgba(140,200,255,.4)}
.joy-base::after{content:"";position:absolute;inset:38%;border-radius:50%;
  background:radial-gradient(circle,rgba(140,200,255,.5),transparent 70%)}
.joy-knob{position:absolute;width:72px;height:72px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 28%,rgba(240,250,255,.98),rgba(110,170,240,.85));
  box-shadow:0 0 30px rgba(140,200,255,.95),inset 0 -10px 18px rgba(50,110,220,.6),
  0 6px 14px rgba(0,0,0,.65);
  transition:transform .04s linear}
.joy-knob::after{content:"";position:absolute;inset:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,rgba(180,220,255,.7));
  box-shadow:inset 0 0 14px rgba(60,120,240,.7)}

/* --- DAMAGE FLASH --- */
#dmgFlash{position:absolute;inset:0;pointer-events:none;z-index:14;
  background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(255,20,50,.75));
  opacity:0;transition:opacity .12s}
#dmgFlash.hit{opacity:1}

/* --- ACTION TOASTS --- */
#toasts{position:absolute;top:38%;left:50%;transform:translateX(-50%);
  z-index:13;display:flex;flex-direction:column;gap:4px;align-items:center;
  pointer-events:none}
.toast{padding:6px 18px;border-radius:4px;
  background:linear-gradient(135deg,rgba(40,20,60,.92),rgba(15,8,25,.96));
  border:1px solid rgba(255,200,120,.7);font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:#ffe7b0;text-shadow:0 0 10px rgba(255,180,80,.9);
  animation:toastIn .4s cubic-bezier(.2,.9,.3,1.4);white-space:nowrap;
  box-shadow:0 0 25px rgba(255,150,60,.4)}
.toast.magic{border-color:rgba(184,90,255,.85);color:#e0c8ff}
.toast.good{border-color:rgba(140,255,180,.85);color:#c8ffd8}
.toast.crit{border-color:rgba(255,100,100,.95);color:#ffd0d0;

<!-- ============================================================

<script>
window.__apexReady = false;
window.__apexFailed = false;
setTimeout(function(){
  if (!window.__apexReady && !window.__apexFailed) {
    window.__apexFailed = true;
    var e = document.getElementById('loaderError');
    var s = document.getElementById('loaderStatus');
    if (s) s.textContent = 'Модуль не загрузился';
    if (e) { e.style.display = 'block'; e.textContent = 'Проверьте интернет и перезагрузите страницу.'; }
  }
}, 20000);
window.addEventListener('error', function(ev){
  console.error('[Global]', ev.error || ev.message);
  if (!window.__apexReady) {
    window.__apexFailed = true;
    var e = document.getElementById('loaderError');
    if (e) { e.style.display='block'; e.textContent = 'Ошибка: ' + (ev.message||'неизвестно'); }
  }
});
window.addEventListener('unhandledrejection', function(ev){ console.error('[Promise]', ev.reason); });
</script>

<script type="module">
// ============================================================================
// APEX — Reliable bootstrap, full MMO HUD, working joystick
// ============================================================================
window.__apexBooting = true;

// ---------------------------------------------------------------------------
// SHORTCUTS
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const TAU = Math.PI*2;
const dist = (ax,az,bx,bz) => Math.hypot(bx-ax,bz-az);

// ---------------------------------------------------------------------------
// LOADER
// ---------------------------------------------------------------------------
const Loader = {
  pct(p) {
    const f = $('loaderFill'); if (f) f.style.width = clamp(p,0,100)+'%';
    const pe = $('loaderPct'); if (pe) pe.textContent = Math.round(clamp(p,0,100))+'%';
  },
  text(t) { const s = $('loaderStatus'); if (s) s.textContent = t; },
  error(t) {
    const e = $('loaderError'); if (e) { e.style.display='block'; e.textContent = t; }
  },
  ready() { const b = $('loaderStart'); if (b) b.classList.add('ready'); },
  hide() { const el = $('loader'); if (el) el.classList.add('hide'); }
};

// ---------------------------------------------------------------------------
// THREE.JS — dynamic import with fallback
// ---------------------------------------------------------------------------
let THREE = null;
let EffectComposer = null, RenderPass = null, UnrealBloomPass = null;

async function loadDeps() {
  Loader.pct(4); Loader.text('Загрузка Three.js…');
  try {
    THREE = await Promise.race([
      import('https://unpkg.com/three@0.160.0/build/three.module.js'),
      new Promise((_,r) => setTimeout(()=>r(new Error('timeout')), 15000))
    ]);
    if (!THREE.WebGLRenderer) throw new Error('Three.js не полный');
    console.log('[Boot] Three.js OK', THREE.REVISION);
  } catch(e) {
    console.error(e);
    throw new Error('Не удалось загрузить Three.js');
  }

  Loader.pct(14); Loader.text('Загрузка постобработки…');
  try {
    const [ec, rp, ub] = await Promise.race([
      Promise.all([
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js'),
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js'),
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js'),
      ]),
      new Promise((_,r) => setTimeout(()=>r(new Error('timeout')), 10000))
    ]);
    EffectComposer = ec.EffectComposer;
    RenderPass = rp.RenderPass;
    UnrealBloomPass = ub.UnrealBloomPass;
    console.log('[Boot] Post-processing OK');
  } catch(e) {
    console.warn('[Boot] Post-processing off:', e.message);
    EffectComposer = RenderPass = UnrealBloomPass = null;
  }
}

// ---------------------------------------------------------------------------
// PROCEDURAL TEXTURES (small sizes for mobile)
// ---------------------------------------------------------------------------
const TEXCACHE = new Map();
function canvasTex(w, h, drawFn, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (!ctx) return null;
  drawFn(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat, opts.repeat);
  if (opts.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 2;
  return t;
}

function stoneTileTexture() {
  if (TEXCACHE.has('tile')) return TEXCACHE.get('tile');
  const t = canvasTex(256, 256, (ctx, w, h) => {
    // Base stone
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const n = Math.sin(x*0.15)*Math.cos(y*0.13)*0.5+0.5;
        const n2 = Math.sin(x*0.4+y*0.3)*0.5+0.5;
        const v = (n*0.5+n2*0.5);
        img.data[i] = 95 + v*45;
        img.data[i+1] = 88 + v*42;
        img.data[i+2] = 72 + v*38;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    // Draw tile grid lines
    ctx.strokeStyle = 'rgba(40,30,20,.55)';
    ctx.lineWidth = 3;
    const tile = 64;
    for (let x = 0; x <= w; x += tile) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y <= h; y += tile) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    // Slight inner shadow per tile
    for (let tx = 0; tx < w; tx += tile) {
      for (let ty = 0; ty < h; ty += tile) {
        ctx.strokeStyle = 'rgba(255,240,200,.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx+2, ty+2, tile-4, tile-4);
      }
    }
  }, { repeat: 6 });
  TEXCACHE.set('tile', t);
  return t;
}

function wallTexture() {
  if (TEXCACHE.has('wall')) return TEXCACHE.get('wall');
  const t = canvasTex(192, 192, (ctx, w, h) => {
    // Brick pattern
    ctx.fillStyle = '#4a4034'; ctx.fillRect(0,0,w,h);
    const brickH = 24, brickW = 48;
    for (let row = 0; row < h/brickH; row++) {
      const offset = row % 2 ? brickW/2 : 0;
      for (let col = -1; col < w/brickW+1; col++) {
        const bx = col*brickW + offset;
        const by = row*brickH;
        const v = Math.random()*40;
        ctx.fillStyle = `rgb(${78+v},${68+v},${58+v})`;
        ctx.fillRect(bx+1, by+1, brickW-2, brickH-2);
        // Highlight
        ctx.fillStyle = 'rgba(255,230,180,.08)';
        ctx.fillRect(bx+1, by+1, brickW-2, 2);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,.3)';
        ctx.fillRect(bx+1, by+brickH-3, brickW-2, 2);
      }
    }
  }, { repeat: 4 });
  TEXCACHE.set('wall', t);
  return t;
}

function barkTexture() {
  if (TEXCACHE.has('bark')) return TEXCACHE.get('bark');
  const t = canvasTex(128, 128, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const nx = x/w, ny = y/h;
        const n1 = Math.sin(nx*30 + Math.sin(ny*6)*2);
        const n2 = Math.sin(nx*12 + ny*3);
        const crack = Math.pow(Math.abs(Math.sin(nx*16 + Math.sin(ny*4)*3)), 0.7);
        const v = clamp((n1*0.3+n2*0.3)*0.5+0.5+(1-crack)*0.15, 0, 1);
        img.data[i] = 68 + v*82;
        img.data[i+1] = 48 + v*58;
        img.data[i+2] = 30 + v*38;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: 2 });
  TEXCACHE.set('bark', t);
  return t;
}

function leafTexture() {
  if (TEXCACHE.has('leaf')) return TEXCACHE.get('leaf');
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 128);
  for (let k = 0; k < 12; k++) {
    const cx = 64 + rand(-30,30);
    const cy = 64 + rand(-30,30);
    const r = rand(14, 28);
    const ang = rand(0, TAU);
    const shade = rand(70, 140);
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    grad.addColorStop(0, `rgba(${40+shade*0.4},${100+shade},${30+shade*0.3},1)`);
    grad.addColorStop(0.7, `rgba(${20+shade*0.3},${60+shade*0.8},${18+shade*0.2},1)`);
    grad.addColorStop(1, 'rgba(15,40,15,0)');
    ctx.fillStyle = grad;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.beginPath(); ctx.ellipse(0, 0, r, r*0.55, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  TEXCACHE.set('leaf', t);
  return t;
}

function rockTexture() {
  if (TEXCACHE.has('rock')) return TEXCACHE.get('rock');
  const t = canvasTex(128, 128, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const nx = x/w*10, ny = y/h*10;
        const n1 = Math.sin(nx*2.1)*Math.cos(ny*1.7);
        const n2 = Math.sin(nx*5.3+ny*3.1)*0.6;
        const n3 = Math.sin(nx*13+ny*9)*0.3;
        const v = (n1+n2+n3)/2*0.5+0.5;
        const g = 65 + v*70;
        const moss = Math.max(0, n1)*0.35;
        img.data[i] = g*0.9 + moss*30;
        img.data[i+1] = g + moss*50;
        img.data[i+2] = g*0.85;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: 2 });
  TEXCACHE.set('rock', t);
  return t;
}

function glowTexture() {
  if (TEXCACHE.has('glow')) return TEXCACHE.get('glow');
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,240,200,0.55)');
  g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  TEXCACHE.set('glow', t);
  return t;
}

// ---------------------------------------------------------------------------
// RACES
// ---------------------------------------------------------------------------
const RACES = [
  { id:'elf', name:'Пепельный Эльф',
    desc:'Дитя сожжённых лесов. Быстр, точен, повелевает пеплом.',
    tag:'Стрелок • Тень',
    stats:{str:6,agi:14,int:10,eth:8},
    color:0x4a9eff, accent:0x99ddff,
    skin:[210,175,145], cloth:0x2a3a55, metal:[150,160,175],
    hair:0xdcc8b0, hairStyle:'long' },
  { id:'orc', name:'Железный Орк',
    desc:'Кузнец войны. Каждый удар — молот, каждое слово — приговор.',
    tag:'Танк • Берсерк',
    stats:{str:15,agi:5,int:6,eth:4},
    color:0xff6b35, accent:0xffb07a,
    skin:[95,125,55], cloth:0x8a2a1a, metal:[130,100,70],
    hair:0x1a0a05, hairStyle:'mohawk' },
  { id:'monk', name:'Кибер-Монах',
    desc:'Синтез плоти и света. Управляет эфиром, лечит союзников.',
    tag:'Маг • Поддержка',
    stats:{str:5,agi:8,int:14,eth:15},
    color:0xb85aff, accent:0xf0c0ff,
    skin:[220,205,240], cloth:0x1a1030, metal:[200,190,215],
    hair:0xffffff, hairStyle:'bald' },
];

// ---------------------------------------------------------------------------
// CHARACTER BUILDER — detailed humanoid, no crude primitives
// ---------------------------------------------------------------------------
function buildCharacter(race, opts = {}) {
  const g = new THREE.Group();
  const isMutant = !!opts.isMutant;

  const skinColor = new THREE.Color(race.skin[0]/255, race.skin[1]/255, race.skin[2]/255);
  const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.62, metalness: 0.04 });
  const clothMat = new THREE.MeshStandardMaterial({ color: race.cloth, roughness: 0.85, metalness: 0.06 });
  const metalMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(race.metal[0]/255, race.metal[1]/255, race.metal[2]/255),
    roughness: 0.32, metalness: 0.9,
  });
  const accentMat = new THREE.MeshStandardMaterial({
    color: race.color, roughness: 0.28, metalness: 0.85,
    emissive: new THREE.Color(race.color).multiplyScalar(isMutant ? 0.6 : 0.35),
    emissiveIntensity: 1.3,
  });
  const hairMat = new THREE.MeshStandardMaterial({ color: race.hair, roughness: 0.9 });
  const eyeMat = new THREE.MeshStandardMaterial({
    color: race.accent, emissive: race.accent,
    emissiveIntensity: isMutant ? 3.5 : 2.2, roughness: 0.15,
  });

  // ---- Torso (lathe profile) ----
  const torsoPts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i/10;
    const r = 0.22 + Math.sin(t*Math.PI*0.85)*0.16 - t*t*0.04;
    torsoPts.push(new THREE.Vector2(Math.max(0.06, r), t*0.85));
  }
  const torso = new THREE.Mesh(new THREE.LatheGeometry(torsoPts, 12), clothMat);
  torso.position.y = 0.7;
  torso.castShadow = true;
  g.add(torso);

  // ---- Chest armor ----
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.42, 0.34), metalMat);
  chest.position.set(0, 1.35, 0.01);
  chest.castShadow = true;
  g.add(chest);
  // Rune inlay on chest
  const rune = new THREE.Mesh(
    new THREE.TorusGeometry(0.09, 0.012, 6, 20),
    accentMat
  );
  rune.position.set(0, 1.35, 0.19);
  rune.rotation.x = Math.PI/2;
  g.add(rune);

  // ---- Belt ----
  const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.07, 14), metalMat);
  belt.position.y = 0.85;
  g.add(belt);
  const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.03), accentMat);
  buckle.position.set(0, 0.85, 0.27);
  g.add(buckle);

  // ---- Shoulders ---- (multi-layer pauldrons)
  for (const sx of [-1, 1]) {
    const shBase = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 10, 8, 0, TAU, 0, Math.PI*0.6),
      metalMat
    );
    shBase.position.set(sx*0.31, 1.46, 0);
    shBase.rotation.z = sx*-0.32;
    shBase.scale.set(1.15, 1, 1.2);
    shBase.castShadow = true;
    g.add(shBase);
    // Spike on top
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.13, 5), metalMat);
    spike.position.set(sx*0.37, 1.56, 0);
    spike.rotation.z = sx * -0.4;
    g.add(spike);
  }

  // ---- Head ----
  const headGeo = new THREE.SphereGeometry(0.15, 18, 14);
  const hpos = headGeo.attributes.position;
  for (let i = 0; i < hpos.count; i++) {
    const y = hpos.getY(i);
    if (y < 0) {
      hpos.setX(i, hpos.getX(i) * (1 - (-y)*0.35));
      hpos.setZ(i, hpos.getZ(i) * (1 - (-y)*0.25));
    }
  }
  headGeo.computeVertexNormals();
  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.y = 1.72;
  head.scale.set(1, 1.12, 1.02);
  head.castShadow = true;
  g.add(head);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 0.09, 10), skinMat);
  neck.position.y = 1.58;
  g.add(neck);

  // Eyes
  const scleraMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.25 });
  for (const sx of [-1, 1]) {
    const eye = new THREE.Group();
    const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), scleraMat);
    sclera.scale.set(1, 0.85, 0.7);
    eye.add(sclera);
    const iris = new THREE.Mesh(new THREE.CircleGeometry(0.017, 12), eyeMat);
    iris.position.z = 0.023; eye.add(iris);
    const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.007, 8),
      new THREE.MeshBasicMaterial({ color: 0x000000 }));
    pupil.position.z = 0.025; eye.add(pupil);
    eye.position.set(sx*0.058, 1.74, 0.132);
    eye.rotation.y = sx*0.1;
    g.add(eye);
  }

  // Nose, mouth
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), skinMat);
  nose.position.set(0, 1.71, 0.145); nose.scale.set(0.9, 1.1, 1.4);
  g.add(nose);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.007, 0.011),
    new THREE.MeshStandardMaterial({ color: 0x5a2a2a, roughness: 0.7 }));
  mouth.position.set(0, 1.665, 0.14);
  g.add(mouth);

  // Ears
  for (const sx of [-1, 1]) {
    let ear;
    if (race.id === 'elf') {
      const pts = [];
      for (let i = 0; i <= 5; i++) {
        const t = i/5;
        pts.push(new THREE.Vector2(0.011 + t*0.005, t*0.075));
      }
      ear = new THREE.Mesh(new THREE.LatheGeometry(pts, 6), skinMat);
      ear.rotation.z = sx * -0.4;
      ear.rotation.x = -0.1;
    } else {
      ear = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), skinMat);
      ear.scale.set(0.5, 1.1, 0.9);
      ear.rotation.z = sx * 0.2;
    }
    ear.position.set(sx*0.14, 1.72, 0);
    g.add(ear);
  }

  // Hair
  if (race.hairStyle === 'long') {
    const hairShell = new THREE.Mesh(
      new THREE.SphereGeometry(0.165, 14, 10, 0, TAU, 0, Math.PI*0.65),
      hairMat
    );
    hairShell.position.y = 1.74;
    hairShell.scale.set(1.02, 1.03, 1.05);
    g.add(hairShell);
    for (let i = 0; i < 5; i++) {
      const a = (i/5)*TAU;
      const strand = new THREE.Mesh(new THREE.BoxGeometry(0.02, rand(0.14, 0.22), 0.03), hairMat);
      strand.position.set(Math.sin(a)*0.12, 1.62, Math.cos(a)*0.12);
      strand.rotation.z = Math.sin(a)*0.3;
      strand.rotation.x = Math.cos(a)*0.3;
      g.add(strand);
    }
  } else if (race.hairStyle === 'mohawk') {
    for (let i = 0; i < 6; i++) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.09 - i*0.008, 5), hairMat);
      spike.position.set(0, 1.87 + (i-3)*0.001, -0.06 + i*0.024);
      spike.rotation.x = -0.15;
      g.add(spike);
    }
  }

  // Arms (upper + forearm + hand)
  const armData = {};
  for (const sx of [-1, 1]) {
    const arm = new THREE.Group();
    arm.position.set(sx*0.31, 1.38, 0);

    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.19, 4, 8), skinMat);
    upper.position.y = -0.12; upper.castShadow = true;
    arm.add(upper);
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.19, 4, 8), skinMat);
    fore.position.y = -0.34; fore.castShadow = true;
    arm.add(fore);

    // Bracer
    const bracer = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.056, 0.12, 10), metalMat);
    bracer.position.y = -0.28;
    arm.add(bracer);

    // Hand — palm + 4 fingers
    const hand = new THREE.Group();
    hand.position.y = -0.47;
    hand.add(new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.055, 0.026), skinMat));
    for (let f = 0; f < 4; f++) {
      const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.0055, 0.032, 3, 5), skinMat);
      finger.position.set(-0.018 + f*0.012, -0.044, 0);
      hand.add(finger);
    }
    arm.add(hand);

    arm.userData = { sx, upper, fore, hand };
    g.add(arm);
    armData[sx === -1 ? 'left' : 'right'] = arm;
  }

  // Legs
  for (const sx of [-1, 1]) {
    const leg = new THREE.Group();
    leg.position.set(sx*0.105, 0.72, 0);
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.068, 0.22, 4, 8), clothMat);
    thigh.position.y = -0.14; thigh.castShadow = true;
    leg.add(thigh);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.056, 0.22, 4, 8), clothMat);
    shin.position.y = -0.4; shin.castShadow = true;
    leg.add(shin);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.1, 0.17), metalMat);
    boot.position.set(0, -0.58, 0.03); boot.castShadow = true;
    leg.add(boot);
    g.add(leg);
  }

  // Cape (elf)
  if (race.id === 'elf') {
    const cape = new THREE.Mesh(
      new THREE.PlaneGeometry(0.5, 0.8, 4, 6),
      new THREE.MeshStandardMaterial({ color: race.cloth, roughness: 0.9, side: THREE.DoubleSide })
    );
    cape.position.set(0, 1.05, -0.19);
    cape.userData.isCape = true;
    g.add(cape);
  }

  // Cyber monk wings + halo
  if (race.id === 'monk') {
    for (const sx of [-1, 1]) {
      const wing = new THREE.Group();
      wing.position.set(sx*0.26, 1.55, -0.08);
      for (let i = 0; i < 4; i++) {
        const shard = new THREE.Mesh(
          new THREE.ConeGeometry(0.028, 0.3 + i*0.04, 4),
          new THREE.MeshStandardMaterial({
            color: race.accent, emissive: race.color,
            emissiveIntensity: 2.0, transparent: true, opacity: 0.75,
          })
        );
        shard.position.set(0, i*0.07, 0);
        shard.rotation.z = sx * (0.3 + i*0.15);
        shard.userData.isShard = true;
        wing.add(shard);
      }
      wing.userData = { isWing: true, side: sx };
      g.add(wing);
    }
    const halo = new THREE.Mesh(
      new THREE.TorusGeometry(0.19, 0.014, 6, 24),
      new THREE.MeshBasicMaterial({ color: race.accent, transparent: true, opacity: 0.85 })
    );
    halo.position.y = 2.0;
    halo.rotation.x = Math.PI/2;
    halo.userData.isHalo = true;
    g.add(halo);
  }

  // Weapon (in right hand)
  const weapon = buildWeapon(race, metalMat, accentMat);
  if (weapon) {
    weapon.position.set(0.31, 1.0, 0.15);
    weapon.userData.isWeapon = true;
    g.add(weapon);
  }

  // Mutant spikes (enemies)
  if (isMutant) {
    for (let i = 0; i < 5; i++) {
      const spike = new THREE.Mesh(
        new THREE.ConeGeometry(0.03, 0.15 - i*0.015, 5),
        new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.7, metalness: 0.4 })
      );
      spike.position.set(0, 1.55 - i*0.09, -0.19);
      spike.rotation.x = -0.6;
      g.add(spike);
    }
  }

  g.userData.armData = armData;
  g.userData.animTime = rand(0, 10);
  g.userData.baseScale = 1;
  return g;
}

      new THREE.CylinderGeometry(0.035, 0.042, 1.15, 8),

    );

      band.position.y = yy;

  } else {

      new THREE.CylinderGeometry(0.028, 0.032, 1.45, 8),

    crystal.position.y = 1.0;

    w.add(crystal);
  }
  return w;
}

// Full-body idle anim
function animateCharacter(g, dt, opts = {}) {
  if (!g || !g.userData) return;
  g.userData.animTime += dt;
  const t = g.userData.animTime;
  const bs = opts.baseScale || g.userData.baseScale || 1;
  const breath = Math.sin(t * 1.8) * 0.012;
  g.scale.y = bs * (1 + breath);

  g.traverse((o) => {
    if (o.userData.isCape) {
      const pos = o.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        pos.setZ(i, Math.sin(t*2 + y*3) * 0.03);
      }
      pos.needsUpdate = true;
    }
    if (o.userData.isWing) {
      o.rotation.z = o.userData.side * (0.2 + Math.sin(t*1.5)*0.08);
    }
    if (o.userData.isShard) {
      o.material.emissiveIntensity = 1.5 + Math.sin(t*3 + o.position.y*5)*0.6;
    }
    if (o.userData.isHalo) o.rotation.z = t * 1.2;
    if (o.userData.isCrystal) o.rotation.y = t * 2;
  });

  if (g.userData.armData) {
    for (const k of ['left', 'right']) {
      const arm = g.userData.armData[k];
      if (arm) {
        arm.rotation.x = Math.sin(t*1.4 + (k === 'left' ? 0 : Math.PI)) * 0.05;
        arm.rotation.z = (k === 'left' ? 1 : -1) * 0.05;
      }
    }
  }
}

// ---------------------------------------------------------------------------
// TREE BUILDER — detailed trunk + branches + instanced leaf clusters
// ---------------------------------------------------------------------------
function buildTree(opts = {}) {
  const g = new THREE.Group();
  const scale = opts.scale || 1;

  const barkMat = new THREE.MeshStandardMaterial({
    map: barkTexture(), roughness: 0.92, metalness: 0.02, color: 0x9a8060,
  });

  // Trunk — tapered with slight bend
  const trunkH = rand(2.6, 3.6) * scale;
  const trunkGeo = new THREE.CylinderGeometry(0.1*scale, 0.24*scale, trunkH, 7, 6);
  const tp = trunkGeo.attributes.position;
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i);
    const t = (y / trunkH) + 0.5;
    const bend = Math.sin(t*2) * 0.08 * scale;
    tp.setX(i, x + bend);
    const radial = Math.hypot(x, z);
    if (radial > 0.001) {
      const noise = Math.sin(t*30 + x*15)*0.007 + Math.cos(t*18 + z*12)*0.005;
      const nr = radial + noise;
      tp.setX(i, (x/radial)*nr + bend);
      tp.setZ(i, (z/radial)*nr);
    }
  }
  trunkGeo.computeVertexNormals();
  const trunk = new THREE.Mesh(trunkGeo, barkMat);
  trunk.position.y = trunkH/2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  g.add(trunk);

  // Branches
  const tips = [];
  const branches = randi(4, 7);
  for (let b = 0; b < branches; b++) {
    const a = (b/branches)*TAU + rand(-0.3, 0.3);
    const startY = trunkH * rand(0.4, 0.85);
    const len = rand(0.65, 1.25) * scale;
    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018*scale, 0.048*scale, len, 5, 2),
      barkMat
    );
    branch.position.set(0, startY, 0);
    branch.rotation.z = -Math.PI/3;
    branch.rotation.y = a;
    branch.translateOnAxis(new THREE.Vector3(0, -1, 0), -len/2);
    branch.castShadow = true;
    g.add(branch);

    const tipPos = new THREE.Vector3(
      Math.sin(a) * Math.sin(Math.PI/3) * len,
      startY + Math.cos(Math.PI/3) * len * 0.5,
      Math.cos(a) * Math.sin(Math.PI/3) * len
    );
    tips.push(tipPos);
  }
  tips.push(new THREE.Vector3(0, trunkH * 1.05, 0));

  // Leaves — InstancedMesh
  const leafMat = new THREE.MeshStandardMaterial({
    map: leafTexture(), alphaTest: 0.4, side: THREE.DoubleSide,
    roughness: 0.85, color: 0xffffff,
  });
  const leafCount = 300;
  const leafGeo = new THREE.PlaneGeometry(0.18*scale, 0.18*scale);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < leafCount; i++) {
    const tip = tips[randi(0, tips.length-1)];
    const r = rand(0, 0.75) * scale;
    const theta = rand(0, TAU);
    const phi = rand(0, Math.PI);
    dummy.position.set(
      tip.x + Math.sin(phi)*Math.cos(theta)*r,
      tip.y + Math.cos(phi)*r*0.65,
      tip.z + Math.sin(phi)*Math.sin(theta)*r
    );
    dummy.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    const s = rand(0.7, 1.3);
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  }
  leaves.instanceMatrix.needsUpdate = true;
  g.add(leaves);

  return g;
}

// GOTHIC STATUE BUILDER
// ---------------------------------------------------------------------------
function buildStatue(scale = 1, color = 0x8a7a60) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: 0.85, metalness: 0.05,
    map: rockTexture(),
  });
  const accentMat = new THREE.MeshStandardMaterial({
    color: 0xffd68a, emissive: 0xff9c4a, emissiveIntensity: 0.6,
    roughness: 0.4, metalness: 0.7,
  });

  // Base (octagonal)
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.35, 8), mat);
  base.position.y = 0.17;
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  // Plinth
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.8, 0.85), mat);
  plinth.position.y = 0.75;
  plinth.castShadow = true;
  g.add(plinth);

  // Robed body (lathe, tall)
  const bodyPts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i/10;
    let r = 0.35 - t*0.15 + Math.sin(t*Math.PI)*0.08;
    if (t > 0.75) r *= 0.85;
    bodyPts.push(new THREE.Vector2(Math.max(0.12, r), t*1.6));
  }
  const body = new THREE.Mesh(new THREE.LatheGeometry(bodyPts, 10), mat);
  body.position.y = 1.15;
  body.castShadow = true;
  g.add(body);

  // Head with hood
  const hood = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10, 0, TAU, 0, Math.PI*0.75), mat);
  hood.position.y = 2.85;
  hood.scale.set(1, 1.15, 1);
  hood.castShadow = true;
  g.add(hood);

  // Extended sword (arm + blade)
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.12), mat);
  arm.position.set(0.42, 2.15, 0.1);
  arm.rotation.z = 0.4;
  g.add(arm);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.1, 0.02), mat);
  blade.position.set(0.75, 1.6, 0.1);
  blade.rotation.z = 0.15;
  blade.castShadow = true;
  g.add(blade);
  const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.06), accentMat);
  hilt.position.set(0.68, 2.15, 0.1);
  hilt.rotation.z = 0.4;
  g.add(hilt);

  // Wings
  for (const sx of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.2, 3, 5), mat);
    wing.position.set(sx * 0.28, 2.4, -0.15);
    wing.rotation.y = sx * 0.4;
    wing.rotation.z = sx * 0.15;
    wing.userData.isWing = true;
    g.add(wing);
  }

  // Rune at bottom
  const rune = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.02, 6, 24), accentMat);
  rune.rotation.x = Math.PI/2;
  rune.position.y = 0.36;
  rune.userData.isHalo = true;
  g.add(rune);

  g.scale.setScalar(scale);
  return g;
}

// ---------------------------------------------------------------------------
// ROCK
// ---------------------------------------------------------------------------
function buildRock(scale) {
  const geo = new THREE.IcosahedronGeometry(scale, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = Math.sin(x*4 + y*2)*0.2 + Math.sin(z*5 + x*3)*0.15;
    p.setXYZ(i, x*(1+n), y*(1+n*0.7), z*(1+n));
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: rockTexture(), roughness: 0.92, metalness: 0.08, color: 0x8a8070,
  }));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function showToast(text, kind) {
  const wrap = $('toasts');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1800);
}

const ChatLog = {
  lines: [],
  currentTab: 'general',
  init() {
    const tabs = document.querySelectorAll('.chat-tab');
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        if (t.classList.contains('chat-input-btn')) return;
        document.querySelectorAll('.chat-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.currentTab = t.dataset.tab;
        this.render();
      });
    });
    this.add('system', 'Добро пожаловать в Aethelgard, странник!');
    this.add('system', 'Используйте джойстик слева для движения.');
    // Simulated incoming chat
    const fakePlayers = ['Aeliana','Korgath','Sylwen','Dravok','Morrigan','Talan','Vex','Ysolde'];
    const fakeMessages = [
      'Кто-нибудь видел элитного мутанта у стен?',
      'Продаю зачарованные руны, цена договорная!',
      'Иду на восток, присоединяйтесь!',
      'Эй, подождите меня у обелиска.',
      'Осторожно, там высокий уровень заражения!',
      'Кто хочет в подземелье? Нужен танк и хил.',
      'Торговец даёт скидку на зелья!',
    ];
    setInterval(() => {
      const w = fakePlayers[randi(0, fakePlayers.length-1)];
      const m = fakeMessages[randi(0, fakeMessages.length-1)];
      this.add('guild', m, w);
    }, 8000 + Math.random()*5000);
  },
  add(kind, text, who) {
    const time = new Date();
    const t = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
    const line = { kind, text, who, time };
    this.lines.push(line);
    if (this.lines.length > 60) this.lines.shift();
    this.render();
  },
  render() {
    const log = $('chatLog');
    if (!log) return;
    const filtered = this.lines.filter(l => {
      if (this.currentTab === 'general') return l.kind !== 'combat';
      if (this.currentTab === 'combat') return l.kind === 'combat' || l.kind === 'system';
      if (this.currentTab === 'guild') return l.kind === 'guild' || l.kind === 'system';
      return true;
    });
    log.innerHTML = filtered.slice(-30).map(l => {
      let line = `<div class="chat-line">`;
      if (l.who) line += `<span class="who ${l.kind === 'guild' ? 'guild' : ''}">[${l.who}]</span> `;
      if (l.kind === 'system') line += `<span class="sys">◆ ${l.text}</span>`;
      else if (l.kind === 'combat') line += `<span class="dmg">${l.text}</span>`;
      else if (l.kind === 'loot') line += `<span class="loot">${l.text}</span>`;
      else line += `<span>${l.text}</span>`;
      line += `</div>`;
      return line;
    }).join('');
  }
};

function updateSkillCds() {
  for (const s of SKILLS) {
    const cdLeft = App.cd[s.id] || 0;
    const el = document.querySelector(`.skill-slot[data-id="${s.id}"]`);
    if (!el) continue;
    const cdEl = el.querySelector('.slot-cd');
    if (cdLeft > 0) {
      el.classList.add('cd-active');
      cdEl.classList.remove('hidden');
      cdEl.textContent = cdLeft > 1 ? Math.ceil(cdLeft) : cdLeft.toFixed(1);
    } else {
      el.classList.remove('cd-active');
      cdEl.classList.add('hidden');
    }
  }
}

  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8050ff, 2.8);
  rim.position.set(-3, 2.5, -2);
  scene.add(rim);
  const fill = new THREE.PointLight(0xffa060, 10, 8);
  fill.position.set(-2, 1.5, 2);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0x4a3a5a, 1.2));

  // Pedestal
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(1.0, 1.15, 0.22, 24),
    new THREE.MeshStandardMaterial({ color: 0x2a1e38, roughness: 0.5, metalness: 0.6 })
  );
  ped.position.y = -0.11;
  ped.receiveShadow = true;
  scene.add(ped);

  // Runic rings
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xffc879, emissive: 0xff9c4a, emissiveIntensity: 1.6,
    roughness: 0.3, metalness: 0.9,
  });
  const r1 = new THREE.Mesh(new THREE.TorusGeometry(1.03, 0.018, 6, 48), ringMat);
  r1.rotation.x = Math.PI/2;
  r1.position.y = 0.01;
  scene.add(r1);
  App.menuRings.push({ mesh: r1, speed: 0.5 });
  const r2 = new THREE.Mesh(new THREE.TorusGeometry(1.13, 0.013, 6, 48), ringMat.clone());
  r2.rotation.x = Math.PI/2;
  r2.position.y = 0.02;
  scene.add(r2);
  App.menuRings.push({ mesh: r2, speed: -0.35 });

  // Portal in background
  const portal = new THREE.Mesh(
    new THREE.RingGeometry(2.0, 5.0, 40),
    new THREE.MeshBasicMaterial({
      color: 0x8050ff, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    })
  );
  portal.position.set(0, 1.8, -5);
  scene.add(portal);
  App.menuPortal = portal;

  // Particles
  const pc = 180;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(pc*3);
  const col = new Float32Array(pc*3);
  for (let i = 0; i < pc; i++) {
    const a = rand(0, TAU);
    const r = rand(0.5, 2.3);
    pos[i*3] = Math.cos(a)*r;
    pos[i*3+1] = rand(-0.1, 3.0);
    pos[i*3+2] = Math.sin(a)*r;
    const c = new THREE.Color().setHSL(rand(0.07, 0.13), 0.9, rand(0.6, 0.95));
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const parts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.05, vertexColors: true, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, map: glowTexture(),
  }));
  scene.add(parts);
  App.menuParticles = parts;

  // Character
  rebuildMenuCharacter();

  // Postprocessing
  if (EffectComposer && RenderPass && UnrealBloomPass) {
    try {
      const composer = new EffectComposer(App.menuRenderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), 0.75, 0.6, 0.85));
      composer.render();
      App.menuComposer = composer;
      console.log('[Menu] Composer OK');
    } catch(e) {
      console.warn('[Menu] Composer failed:', e);
      App.menuComposer = null;
    }
  }

  // Test render
  App.menuRenderer.render(scene, camera);
  console.log('[Menu] Test render OK');
  App.menuClock = new THREE.Clock();
}

function rebuildMenuCharacter() {
  if (!App.menuScene) return;
  if (App.menuCharacter) {
    App.menuScene.remove(App.menuCharacter);
    disposeObject(App.menuCharacter);
  }
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const ch = buildCharacter(race);
  App.menuScene.add(ch);
  App.menuCharacter = ch;
  console.log('[Menu] Character built:', race.name);
}

function startMenuLoop() {
  if (App.menuRafId !== null) return;
  const loop = () => {
    App.menuRafId = requestAnimationFrame(loop);
    try {
      if (!App.menuClock || !App.menuScene || !App.menuCamera) return;
      const dt = Math.min(App.menuClock.getDelta(), 0.05);
      const t = App.menuClock.elapsedTime;

      if (App.menuCharacter) {
        animateCharacter(App.menuCharacter, dt);
        App.menuCharacter.rotation.y = Math.sin(t*0.3) * 0.4;
      }
      for (const r of App.menuRings) r.mesh.rotation.z += r.speed * dt;
      if (App.menuParticles) {
        const p = App.menuParticles.geometry.attributes.position;
        for (let i = 0; i < p.count; i++) {
          p.setY(i, p.getY(i) + Math.sin(t*0.7 + i*0.3)*dt*0.35);
        }
        p.needsUpdate = true;
      }
      if (App.menuPortal) App.menuPortal.rotation.z += dt * 0.1;

      let ok = false;
      if (App.menuComposer) {
        try { App.menuComposer.render(); ok = true; }
        catch(e) { console.warn('[Menu] composer render fail', e); App.menuComposer = null; }
      }
      if (!ok) App.menuRenderer.render(App.menuScene, App.menuCamera);
    } catch(e) { console.error('[MenuLoop]', e); }
  };
  loop();
}
function stopMenuLoop() {
  if (App.menuRafId !== null) { cancelAnimationFrame(App.menuRafId); App.menuRafId = null; }
}
