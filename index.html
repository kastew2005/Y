<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060a">
<title>APEX — Rifters of Aethelgard</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05060a; color: #e0f0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui > * { pointer-events: auto; }
  .hud-btn {
    position: absolute; padding: 10px 16px;
    background: linear-gradient(135deg, rgba(40,60,110,0.85), rgba(15,25,50,0.9));
    border: 1px solid rgba(120,180,240,0.55);
    border-radius: 10px; color: #cfe6ff;
    font: 600 12px/1 system-ui, sans-serif;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(120,180,240,0.6);
    box-shadow: 0 0 20px rgba(80,150,255,0.25), inset 0 0 12px rgba(80,150,255,0.15);
    cursor: pointer; transition: transform 0.08s, box-shadow 0.2s;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hud-btn:active {
    transform: scale(0.95);
    box-shadow: 0 0 30px rgba(120,200,255,0.5), inset 0 0 20px rgba(80,150,255,0.3);
  }
  .hud-btn.equipped {
    border-color: rgba(255,210,120,0.9); color: #ffe7b0;
    box-shadow: 0 0 25px rgba(255,180,80,0.5), inset 0 0 14px rgba(255,180,80,0.25);
  }
  #topbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; padding: 8px 20px;
    background: linear-gradient(90deg, rgba(10,15,30,0.7), rgba(20,30,60,0.85), rgba(10,15,30,0.7));
    border: 1px solid rgba(120,180,240,0.35);
    border-radius: 999px; font: 600 12px/1 system-ui;
    letter-spacing: 1px; text-transform: uppercase; color: #b8d4ff;
    text-shadow: 0 0 8px rgba(120,180,240,0.7);
    box-shadow: 0 0 25px rgba(60,120,240,0.3);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: none !important; white-space: nowrap;
  }
  #topbar .val { color: #ffffff; font-weight: 700; }
  #topbar .sep { color: rgba(120,180,240,0.5); }
  .panel {
    position: absolute;
    background: linear-gradient(135deg, rgba(10,18,38,0.96), rgba(6,10,22,0.98));
    border: 1px solid rgba(120,180,240,0.45);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(60,120,240,0.2), inset 0 0 30px rgba(60,120,240,0.08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 18px; color: #cfe6ff; font-family: system-ui, sans-serif;
  }
  #inv {
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; z-index: 30;
  }
  #inv.open { display: block; }
  #inv h3 {
    margin: 0 0 12px 0; font: 700 14px/1 system-ui;
    letter-spacing: 2px; text-transform: uppercase; color: #ffd88a;
    text-shadow: 0 0 12px rgba(255,200,100,0.5);
  }
  #invGrid {
    display: grid;
    grid-template-columns: repeat(6, 64px);
    grid-template-rows: repeat(4, 64px);
    gap: 8px;
  }
  .slot {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, rgba(20,30,55,0.9), rgba(10,15,30,0.9));
    border: 1px solid rgba(120,180,240,0.3);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; cursor: grab; position: relative;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .slot:hover { border-color: rgba(180,220,255,0.7); box-shadow: 0 0 18px rgba(120,180,240,0.4); }
  .slot.dragging { opacity: 0.4; }
  .slot .stack {
    position: absolute; right: 4px; bottom: 2px;
    font: 700 11px/1 system-ui; color: #ffe7b0;
    text-shadow: 0 0 6px #000;
  }
  #closeInv {
    position: absolute; right: 12px; top: 12px;
    width: 30px; height: 30px; padding: 0;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  #nexusHost {
    position: absolute; inset: 0; display: none; z-index: 25;
  }
  #nexusHost.open { display: block; }
  #nexusHost canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none;
  }
  #closeNexus {
    position: absolute; right: 20px; top: 20px; z-index: 26;
  }
  #hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font: 500 11px/1.4 system-ui; color: rgba(180,210,240,0.6);
    text-align: center; padding: 6px 16px;
    background: rgba(5,10,20,0.6); border-radius: 999px;
    border: 1px solid rgba(120,180,240,0.2);
    pointer-events: none !important; letter-spacing: 0.4px;
    max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #rotateLock {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: #05060a; z-index: 9999;
    font: 600 16px system-ui; color: #cfe6ff; text-align: center;
    padding: 30px; letter-spacing: 1px;
  }
  @media (orientation: portrait) { #rotateLock { display: flex; } }
  #glitch {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    opacity: 0; transition: opacity 0.5s; mix-blend-mode: screen;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,0,80,0.06) 0px, rgba(255,0,80,0.06) 1px,
      transparent 1px, transparent 3px
    );
  }
  #dmgFlash {
    position: fixed; inset: 0; pointer-events: none; z-index: 14;
    background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(255,30,60,0.65));
    opacity: 0; transition: opacity 0.15s;
  }
  #dmgFlash.hit { opacity: 1; }
  #btnAttack {
    position: absolute; right: 40px; bottom: 60px;
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(150,210,255,0.55), rgba(20,40,80,0.95));
    border: 2px solid rgba(180,220,255,0.85);
    box-shadow: 0 0 40px rgba(100,180,255,0.4), inset 0 0 30px rgba(120,200,255,0.2);
    display: flex; align-items: center; justify-content: center;
    color: #eaf4ff; font: 700 14px/1.2 system-ui;
    letter-spacing: 1px; text-shadow: 0 0 10px rgba(150,220,255,0.9);
    cursor: pointer; touch-action: none;
    transition: transform 0.08s ease-out;
    z-index: 20;
    user-select: none;
  }
  #btnAttack.charging {
    background: radial-gradient(circle at 35% 30%, rgba(255,220,120,0.75), rgba(80,50,10,0.95));
    border-color: rgba(255,220,120,0.9);
    box-shadow: 0 0 60px rgba(255,200,80,0.7), inset 0 0 40px rgba(255,200,80,0.35);
  }
  #btnAttack.pressed { transform: scale(0.92); }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="topbar">
      <span>HP <span class="val" id="hpText">100</span></span>
      <span class="sep">|</span>
      <span>MANA <span class="val" id="manaText">80</span></span>
      <span class="sep">|</span>
      <span>LVL <span class="val" id="lvlText">1</span></span>
      <span class="sep">|</span>
      <span>RIFT <span class="val" id="riftText">0%</span></span>
    </div>

    <button class="hud-btn" id="btnInv" style="right:20px;top:20px;">ИНВЕНТАРЬ</button>
    <button class="hud-btn" id="btnNexus" style="right:20px;top:64px;">ДРЕВО</button>
    <button class="hud-btn equipped" id="btnWeapon" style="right:20px;top:108px;">МЕЧ</button>
    <button class="hud-btn" id="btnLightning" style="right:20px;top:152px;">МОЛНИЯ</button>
    <button class="hud-btn" id="btnFire" style="right:20px;top:196px;">ОГОНЬ</button>
    <button class="hud-btn" id="btnWater" style="right:20px;top:240px;">ВОДА</button>

    <div class="panel" id="inv">
      <button class="hud-btn" id="closeInv">✕</button>
      <h3>ИНВЕНТАРЬ</h3>
      <div id="invGrid"></div>
    </div>

    <div id="nexusHost">
      <button class="hud-btn" id="closeNexus">✕ ЗАКРЫТЬ</button>
    </div>

    <div id="btnAttack">АТАКА</div>

    <div id="hint">Джойстик слева — движение. Кнопка справа — атака (удерживай для тяжёлого).</div>
    <div id="glitch"></div>
    <div id="dmgFlash"></div>
  </div>
  <div id="rotateLock">Поверните устройство горизонтально</div>

<script>
(function () {
  "use strict";

  // =========================================================
  // 0. УТИЛИТЫ
  // =========================================================
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const TAU = Math.PI * 2;
  const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
  const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
  const now = () => performance.now();
  const safeNum = (v, fallback) => (typeof v === "number" && isFinite(v)) ? v : fallback;

  function safe(fn) {
    return function () {
      try { return fn.apply(this, arguments); }
      catch (e) { console.error("[Apex] error:", e); }
    };
  }

  // =========================================================
  // 1. EVENTBUS
  // =========================================================
  class EventBus {
    constructor() { this.map = new Map(); }
    on(evt, fn) {
      if (typeof fn !== "function") return () => {};
      let set = this.map.get(evt);
      if (!set) { set = new Set(); this.map.set(evt, set); }
      set.add(fn);
      return () => { set.delete(fn); };
    }
    emit(evt, payload) {
      const set = this.map.get(evt);
      if (!set || set.size === 0) return;
      for (const fn of Array.from(set)) {
        try { fn(payload); }
        catch (e) { console.error("[Apex] bus " + evt + ":", e); }
      }
    }
  }
  const bus = new EventBus();

  // =========================================================
  // 2. STATE
  // =========================================================
  const State = {
    running: false, paused: false, time: 0,
    camX: 0, camY: 0, shake: 0,
    corruption: 0, level: 1, xp: 0, xpNext: 100,
    riftEnergy: 0,
    dmgFlashT: 0,
    killCount: 0,
  };

  // =========================================================
  // 3. WORLD PULSE (Динамическая система заражения мира)
  // =========================================================
  const World = {
    size: 100, cellSize: 10, cells: [], corruptTimer: 0,
    init() {
      this.cells = [];
      const n = this.size / this.cellSize;
      for (let gx = 0; gx < n; gx++) {
        for (let gy = 0; gy < n; gy++) {
          this.cells.push({
            gx, gy,
            cx: -this.size / 2 + gx * this.cellSize + this.cellSize / 2,
            cy: -this.size / 2 + gy * this.cellSize + this.cellSize / 2,
            corruption: 0.05 + Math.random() * 0.25,
          });
        }
      }
    },
    idx(wx, wy) {
      const n = this.size / this.cellSize;
      const gx = Math.floor((wx + this.size / 2) / this.cellSize);
      const gy = Math.floor((wy + this.size / 2) / this.cellSize);
      if (gx < 0 || gy < 0 || gx >= n || gy >= n) return -1;
      return gx * n + gy;
    },
    at(wx, wy) {
      const i = this.idx(wx, wy);
      return i >= 0 ? this.cells[i] : null;
    },
    pulse(dt, player) {
      for (const c of this.cells) {
        c.corruption = clamp(c.corruption + 0.010 * dt, -1, 1);
      }
      if (player) {
        const cell = this.at(player.x, player.y);
        if (cell) cell.corruption = clamp(cell.corruption - 0.30 * dt, -1, 1);
      }
      let sum = 0;
      for (const c of this.cells) sum += Math.max(0, c.corruption);
      State.corruption = sum / this.cells.length;
    },
    rewardKill(wx, wy) {
      const c = this.at(wx, wy);
      if (c) c.corruption = clamp(c.corruption - 0.09, -1, 1);
    },
    mostCorrupted() {
      let best = null, bestV = -Infinity;
      for (const c of this.cells) if (c.corruption > bestV) { bestV = c.corruption; best = c; }
      return best;
    },
    corruptionAt(wx, wy) {
      const c = this.at(wx, wy);
      return c ? clamp(c.corruption, 0, 1) : 0;
    },
  };

  // =========================================================
  // 4. ENTITIES
  // =========================================================
  let nextId = 1;
  const P = {
    player: null,
    enemies: [],
    projectiles: [],
    zones: [],
    particles: [],
    dmgNumbers: [],
    floatTexts: [],
  };

  function spawnEnemy() {
    const cell = World.mostCorrupted();
    if (!cell || !P.player) return;
    const d = dist(cell.cx, cell.cy, P.player.x, P.player.y);
    if (d > 45) return;

    const elite = cell.corruption > 0.62;
    const hp = elite ? 95 : 42;
    const isNearby = d < 30;
    if (!isNearby && P.enemies.length > 8) return;

    const a = rand(0, TAU);
    const r = rand(1, 4);
    P.enemies.push({
      id: nextId++,
      x: cell.cx + Math.cos(a) * r,
      y: cell.cy + Math.sin(a) * r,
      vx: 0, vy: 0,
      radius: elite ? 0.8 : 0.55,
      mass: elite ? 2.2 : 1,
      friction: 0.86,
      hp, maxHp: hp,
      speed: elite ? 3.0 : 3.7,
      damage: elite ? 16 : 9,
      attackCd: 0,
      isElite: elite,
      aggro: 11,
      hitFlash: 0,
      wobble: rand(0, TAU),
    });
  }

  function spawnParticle(x, y, vx, vy, life, color, size, kind) {
    if (P.particles.length > 500) P.particles.shift();
    P.particles.push({
      x, y, vx, vy, life, maxLife: life,
      color, size: size || 0.15, kind: kind || "spark",
    });
  }

  function spawnBurst(x, y, color, count, spread, speed) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const s = rand(speed * 0.4, speed);
      spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.3, 0.8), color, rand(0.08, 0.22), "spark");
    }
  }

  function spawnDamageNumber(x, y, value, kind) {
    P.dmgNumbers.push({ x, y, vy: -2.2, life: 1.0, value: Math.round(value), kind: kind || "dmg" });
  }

  // =========================================================
  // 5. ЭЛЕМЕНТЫ И БОЕВАЯ СИСТЕМА
  // =========================================================
  const Elements = {
    colors: {
      fire: "#ff6a2c",
      ice: "#7cd9ff",
      lightning: "#ffe259",
      water: "#3d7cff",
      none: "#ffffff",
    },
    spawnZone(x, y, radius, element, life, dps) {
      // Ограничение на количество зон
      if (P.zones.length > 40) P.zones.shift();
      P.zones.push({
        id: nextId++,
        x, y, radius: clamp(radius, 0.5, 8),
        element, life: clamp(life, 0.5, 20),
        maxLife: life, dps: clamp(dps, 0, 200),
        pulse: 0,
      });
    },
    // Реакция: молния по воде = цепная
    reactAt(x, y, element, baseDamage) {
      let reacted = null;
      for (const z of P.zones) {
        const d = dist(x, y, z.x, z.y);
        if (d > z.radius + 1.2) continue;
        const combo = this.combine(element, z.element);
        if (!combo) continue;

        if (combo === "chain") {
          reacted = { type: "chain", x: z.x, y: z.y, radius: z.radius * 1.6, damage: baseDamage * 1.9 };
          spawnBurst(z.x, z.y, "#fff5a0", 30, 0, 6);
          this.spawnZone(z.x, z.y, z.radius * 1.3, "lightning", 0.6, 90);
          World.rewardKill(z.x, z.y);
        } else if (combo === "steam") {
          reacted = { type: "steam", x: z.x, y: z.y, radius: z.radius * 1.2, damage: baseDamage * 0.5 };
          spawnBurst(z.x, z.y, "#e0f0ff", 24, 0, 4);
        } else if (combo === "freeze") {
          reacted = { type: "freeze", x: z.x, y: z.y, radius: z.radius, damage: baseDamage * 1.3 };
          spawnBurst(z.x, z.y, "#9be6ff", 20, 0, 3);
          for (const e of P.enemies) {
            if (dist(e.x, e.y, z.x, z.y) <= z.radius) {
              e.vx *= 0.15; e.vy *= 0.15;
            }
          }
        } else if (combo === "burn") {
          reacted = { type: "burn", x: z.x, y: z.y, radius: z.radius * 1.1, damage: baseDamage * 1.6 };
          spawnBurst(z.x, z.y, "#ffb060", 28, 0, 5);
        }
        if (reacted) break;
      }
      if (reacted) {
        for (const e of P.enemies) {
          const d = dist(e.x, e.y, reacted.x, reacted.y);
          if (d <= reacted.radius) {
            damageEnemy(e, reacted.damage, reacted.type);
          }
        }
      }
      return reacted;
    },
    combine(a, b) {
      const k = a + "+" + b;
      if (k === "lightning+water" || k === "water+lightning") return "chain";
      if (k === "fire+water" || k === "water+fire") return "steam";
      if (k === "ice+water" || k === "water+ice") return "freeze";
      if (k === "fire+ice" || k === "ice+fire") return "burn";
      return null;
    },
    step(dt) {
      const keep = [];
      for (const z of P.zones) {
        z.life -= dt;
        z.pulse += dt * 4;
        if (z.life > 0) keep.push(z);
      }
      P.zones = keep;

      // DoT на игроке и врагах от зон
      for (const z of P.zones) {
        if (z.dps <= 0) continue;
        for (const e of P.enemies) {
          if (dist(e.x, e.y, z.x, z.y) <= z.radius) {
            e.hp -= z.dps * dt * 0.5;
            if (Math.random() < dt * 4) {
              spawnParticle(e.x + rand(-0.3,0.3), e.y + rand(-0.3,0.3), 0, -1, 0.5, this.colors[z.element] || "#fff", 0.12, "spark");
            }
          }
        }
        if (P.player && dist(P.player.x, P.player.y, z.x, z.y) <= z.radius) {
          // В своих зонах не наносим урон — только для врагов. Оставим нейтрально.
        }
      }
    },
  };

  function damageEnemy(e, amount, source) {
    if (!e || e.hp <= 0) return;
    e.hp -= amount;
    e.hitFlash = 0.15;
    spawnDamageNumber(e.x, e.y - e.radius - 0.3, amount, source || "dmg");
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    const i = P.enemies.indexOf(e);
    if (i >= 0) P.enemies.splice(i, 1);
    spawnBurst(e.x, e.y, e.isElite ? "#ff5599" : "#ff3355", e.isElite ? 40 : 22, 0, e.isElite ? 7 : 5);
    spawnBurst(e.x, e.y, "#ffffff", 8, 0, 3);
    World.rewardKill(e.x, e.y);
    State.killCount++;
    gainXp(e.isElite ? 35 : 12);
    State.riftEnergy = clamp(State.riftEnergy + (e.isElite ? 3 : 1), 0, 100);
    State.shake = Math.min(State.shake + (e.isElite ? 12 : 5), 20);
    bus.emit("enemy:killed", { id: e.id, x: e.x, y: e.y, elite: e.isElite });
  }

  function gainXp(v) {
    State.xp += v;
    while (State.xp >= State.xpNext) {
      State.xp -= State.xpNext;
      State.level++;
      State.xpNext = Math.floor(State.xpNext * 1.35 + 40);
      if (P.player) {
        P.player.maxHp += 12;
        P.player.hp = P.player.maxHp;
        P.player.maxMana += 6;
        P.player.mana = P.player.maxMana;
      }
      State.shake = Math.min(State.shake + 10, 22);
      bus.emit("player:levelup", { level: State.level });
    }
  }

  function damagePlayer(amount) {
    if (!P.player) return;
    if (P.player.invuln > 0) return;
    P.player.hp -= amount;
    P.player.hitFlash = 0.25;
    P.player.invuln = 0.35;
    State.shake = Math.min(State.shake + 6, 16);
    State.dmgFlashT = 0.25;
    spawnDamageNumber(P.player.x, P.player.y - 0.9, amount, "hurt");
    if (P.player.hp <= 0) {
      P.player.hp = 0;
      respawnPlayer();
    }
  }

  function respawnPlayer() {
    if (!P.player) return;
    P.player.x = 0; P.player.y = 0;
    P.player.vx = 0; P.player.vy = 0;
    P.player.hp = P.player.maxHp;
    P.player.mana = P.player.maxMana;
    P.player.invuln = 2.0;
    P.enemies.length = 0;
    P.zones.length = 0;
    State.shake = 25;
    State.riftEnergy = Math.max(0, State.riftEnergy - 20);
  }

  // ---- АТАКИ ----
  function playerLightAttack() {
    const p = P.player;
    if (!p) return;
    if (p.weapon === "sword") {
      p.swingT = 0.28;
      p.swingDir *= -1;
      const reach = 2.1;
      const arc = 1.4;
      const fx = Math.cos(p.facing), fy = Math.sin(p.facing);
      for (const e of P.enemies) {
        const dx = e.x - p.x, dy = e.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > reach + e.radius) continue;
        const ang = Math.atan2(dy, dx);
        let diff = ang - p.facing;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        if (Math.abs(diff) > arc) continue;
        const dmg = 18 + State.level * 2;
        damageEnemy(e, dmg, "slash");
        // Отталкивание
        const nx = dx / (d || 1), ny = dy / (d || 1);
        e.vx += nx * 5.5;
        e.vy += ny * 5.5;
        spawnBurst(e.x, e.y, "#ffffff", 6, 0, 3);
      }
      // Воздушный разрез
      for (let i = 0; i < 8; i++) {
        const a = p.facing + rand(-arc, arc);
        const r = rand(0.5, reach);
        spawnParticle(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, Math.cos(a) * 2, Math.sin(a) * 2, 0.25, "#cfe6ff", 0.09, "spark");
      }
    } else if (p.weapon === "bow") {
      // Стрела
      const a = p.facing;
      P.projectiles.push({
        id: nextId++,
        x: p.x + Math.cos(a) * 0.7,
        y: p.y + Math.sin(a) * 0.7,
        vx: Math.cos(a) * 22,
        vy: Math.sin(a) * 22,
        life: 1.2, radius: 0.22,
        damage: 22 + State.level * 2,
        owner: "player",
        element: "none",
        color: "#cfe6ff",
      });
      spawnBurst(p.x + Math.cos(a) * 0.8, p.y + Math.sin(a) * 0.8, "#cfe6ff", 6, 0, 3);
    } else if (p.weapon === "staff") {
      castElementalSpell("fire", 0.5);
    }
  }

  function playerHeavyAttack(charge) {
    const p = P.player;
    if (!p) return;
    const mult = 1 + charge * 1.6;
    if (p.weapon === "sword") {
      p.swingT = 0.4;
      p.swingDir *= -1;
      const reach = 3.0;
      const arc = 1.9;
      for (const e of P.enemies) {
        const dx = e.x - p.x, dy = e.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > reach + e.radius) continue;
        const ang = Math.atan2(dy, dx);
        let diff = ang - p.facing;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        if (Math.abs(diff) > arc) continue;
        const dmg = (30 + State.level * 3) * mult;
        damageEnemy(e, dmg, "heavy");
        const nx = dx / (d || 1), ny = dy / (d || 1);
        e.vx += nx * 12 * mult;
        e.vy += ny * 12 * mult;
        spawnBurst(e.x, e.y, "#ffd88a", 14, 0, 5);
      }
      State.shake = Math.min(State.shake + 8 * mult, 22);
      spawnBurst(p.x + Math.cos(p.facing) * 1.5, p.y + Math.sin(p.facing) * 1.5, "#ffd88a", 20, 0, 5);
    } else if (p.weapon === "bow") {
      // Мощный выстрел — 3 стрелы
      for (let k = -0.18; k <= 0.18; k += 0.18) {
        const a = p.facing + k;
        P.projectiles.push({
          id: nextId++, x: p.x + Math.cos(a) * 0.7, y: p.y + Math.sin(a) * 0.7,
          vx: Math.cos(a) * 26, vy: Math.sin(a) * 26,
          life: 1.4, radius: 0.26,
          damage: (30 + State.level * 3) * mult,
          owner: "player", element: "none", color: "#ffe7b0",
        });
      }
      spawnBurst(p.x + Math.cos(p.facing) * 0.8, p.y + Math.sin(p.facing) * 0.8, "#ffe7b0", 14, 0, 5);
    } else if (p.weapon === "staff") {
      castElementalSpell("fire", 0.5 + charge);
    }
  }

  function castElementalSpell(element, power) {
    const p = P.player;
    if (!p) return;
    if (p.mana < 12) return;
    p.mana -= 12;
    const baseDamage = (20 + State.level * 2) * (0.8 + power);

    const targetX = p.x + Math.cos(p.facing) * 4.5;
    const targetY = p.y + Math.sin(p.facing) * 4.5;

    // Реакция на существующие зоны в точке цели
    const reaction = Elements.reactAt(targetX, targetY, element, baseDamage);
    if (reaction) {
      State.shake = Math.min(State.shake + 10, 20);
    }

    // Основное попадание
    for (const e of P.enemies) {
      if (dist(e.x, e.y, targetX, targetY) <= 2.4) {
        damageEnemy(e, baseDamage, element);
      }
    }

    // Спавним зону
    if (element === "fire") {
      Elements.spawnZone(targetX, targetY, 2.4, "fire", 4.0, 14);
      spawnBurst(targetX, targetY, "#ff6a2c", 30, 0, 6);
    } else if (element === "lightning") {
      Elements.spawnZone(targetX, targetY, 1.8, "lightning", 0.8, 40);
      spawnBurst(targetX, targetY, "#ffe259", 36, 0, 8);
      // Молния — мгновенный урон
      for (const e of P.enemies) {
        if (dist(e.x, e.y, targetX, targetY) <= 3.0) {
          damageEnemy(e, baseDamage * 1.2, "lightning");
        }
      }
      State.shake = Math.min(State.shake + 8, 20);
    } else if (element === "water") {
      Elements.spawnZone(targetX, targetY, 3.0, "water", 6.0, 4);
      spawnBurst(targetX, targetY, "#3d7cff", 28, 0, 4);
    } else if (element === "ice") {
      Elements.spawnZone(targetX, targetY, 2.6, "ice", 4.0, 10);
      spawnBurst(targetX, targetY, "#7cd9ff", 26, 0, 5);
    }

    p.castCooldown = 0.35;
  }

  // =========================================================
  // 6. ФИЗИКА
  // =========================================================
  function integrate(entity, dt) {
    entity.x += entity.vx * dt;
    entity.y += entity.vy * dt;
    const damp = Math.pow(1 - entity.friction, dt);
    entity.vx *= damp;
    entity.vy *= damp;
    // Ограничение мира
    const lim = World.size / 2 - 2;
    entity.x = clamp(entity.x, -lim, lim);
    entity.y = clamp(entity.y, -lim, lim);
    if (!isFinite(entity.x)) entity.x = 0;
    if (!isFinite(entity.y)) entity.y = 0;
  }

  function separate(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const rs = a.radius + b.radius;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rs * rs || d2 < 1e-6) return;
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;
    const overlap = rs - d;
    const totalM = (a.mass || 1) + (b.mass || 1);
    const aShare = (b.mass || 1) / totalM;
    const bShare = (a.mass || 1) / totalM;
    a.x -= nx * overlap * aShare;
    a.y -= ny * overlap * aShare;
    b.x += nx * overlap * bShare;
    b.y += ny * overlap * bShare;
  }

  function resolveCollisions() {
    const all = [P.player, ...P.enemies].filter(Boolean);
    for (let i = 0; i < all.length; i++) {
      for (let j = i + 1; j < all.length; j++) {
        separate(all[i], all[j]);
      }
    }
  }

  // =========================================================
  // 7. AI ВРАГОВ
  // =========================================================
  function updateEnemyAI(e, dt) {
    if (!P.player) return;
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.attackCd = Math.max(0, e.attackCd - dt);
    e.wobble += dt * 3;

    const dx = P.player.x - e.x, dy = P.player.y - e.y;
    const d = Math.hypot(dx, dy);
    if (d < e.aggro && d > 0.01) {
      const nx = dx / d, ny = dy / d;
      const wob = Math.sin(e.wobble) * 0.4;
      const ax = nx + wob * -ny;
      const ay = ny + wob * nx;
      e.vx += ax * e.speed * 4 * dt;
      e.vy += ay * e.speed * 4 * dt;
      const spd = Math.hypot(e.vx, e.vy);
      const maxSp = e.speed;
      if (spd > maxSp) { e.vx = (e.vx / spd) * maxSp; e.vy = (e.vy / spd) * maxSp; }

      const rr = e.radius + P.player.radius + 0.1;
      if (d < rr + 0.4 && e.attackCd <= 0) {
        damagePlayer(e.damage);
        e.attackCd = 0.9;
        const nx2 = -dx / (d || 1), ny2 = -dy / (d || 1);
        P.player.vx += nx2 * 3;
        P.player.vy += ny2 * 3;
        spawnBurst(P.player.x, P.player.y, "#ff3355", 8, 0, 3);
      }
    } else {
      // Праздное блуждание
      e.wobble += dt * 0.8;
      e.vx += Math.cos(e.wobble) * 0.5 * dt;
      e.vy += Math.sin(e.wobble * 1.3) * 0.5 * dt;
    }
  }

  // =========================================================
  // 8. ПРОЕКТИЛЫ
  // =========================================================
  function updateProjectiles(dt) {
    const keep = [];
    for (const pr of P.projectiles) {
      pr.life -= dt;
      if (pr.life <= 0) {
        spawnBurst(pr.x, pr.y, pr.color, 5, 0, 2);
        continue;
      }
      // Подшаги — защита от проскока
      const steps = 3;
      const subDt = dt / steps;
      let consumed = false;
      for (let s = 0; s < steps && !consumed; s++) {
        pr.x += pr.vx * subDt;
        pr.y += pr.vy * subDt;
        if (pr.owner === "player") {
          for (const e of P.enemies) {
            const rr = e.radius + pr.radius;
            if (dist2(pr.x, pr.y, e.x, e.y) <= rr * rr) {
              damageEnemy(e, pr.damage, pr.element);
              const a = Math.atan2(pr.vy, pr.vx);
              e.vx += Math.cos(a) * 3;
              e.vy += Math.sin(a) * 3;
              spawnBurst(pr.x, pr.y, pr.color, 8, 0, 3);
              consumed = true;
              break;
            }
          }
        }
      }
      if (!consumed) {
        // Трейл
        if (Math.random() < 0.6) {
          spawnParticle(pr.x, pr.y, rand(-0.5, 0.5), rand(-0.5, 0.5), 0.3, pr.color, 0.08, "spark");
        }
        keep.push(pr);
      }
    }
    P.projectiles = keep;
  }

  // =========================================================
  // 9. ВВОД: ДЖОЙСТИК (мультитач, левая половина)
  // =========================================================
  const Joystick = {
    active: false,
    pointerId: null,
    baseX: 0, baseY: 0,
    knobX: 0, knobY: 0,
    dx: 0, dy: 0,
    magnitude: 0,
    baseRadius: 80,
    knobRadius: 32,
    deadzone: 0.14,

    // Клик по канвасу в левой половине — активируем
    tryStart(clientX, clientY, pointerId, screenW) {
      if (this.active) return false;
      if (clientX > screenW * 0.55) return false; // правая часть — не джойстик
      this.active = true;
      this.pointerId = pointerId;
      this.baseX = clientX;
      this.baseY = clientY;
      this.knobX = clientX;
      this.knobY = clientY;
      this.dx = 0; this.dy = 0; this.magnitude = 0;
      return true;
    },
    move(clientX, clientY) {
      if (!this.active) return;
      let dx = clientX - this.baseX;
      let dy = clientY - this.baseY;
      const maxR = this.baseRadius - this.knobRadius;
      const d = Math.hypot(dx, dy);
      if (d > maxR) { dx = dx / d * maxR; dy = dy / d * maxR; }
      this.knobX = this.baseX + dx;
      this.knobY = this.baseY + dy;
      const nx = dx / maxR;
      const ny = dy / maxR;
      const mag = Math.min(1, Math.hypot(nx, ny));
      if (mag < this.deadzone) { this.dx = 0; this.dy = 0; this.magnitude = 0; }
      else {
        const nrm = Math.hypot(nx, ny) || 1;
        this.dx = nx / nrm;
        this.dy = ny / nrm;
        this.magnitude = mag;
      }
    },
    end(pointerId) {
      if (pointerId !== this.pointerId) return;
      this.active = false;
      this.pointerId = null;
      this.dx = 0; this.dy = 0; this.magnitude = 0;
    },
  };

  // =========================================================
  // 10. ВВОД: КНОПКА АТАКИ (DOM, context-aware)
  // =========================================================
  const AttackButton = {
    el: null,
    pointerId: null,
    charging: false,
    chargeStart: 0,
    charge: 0,
    weapon: "sword",
    init(el) {
      this.el = el;
      if (!el) return;
      el.addEventListener("pointerdown", this.onDown.bind(this), { passive: false });
      el.addEventListener("pointermove", this.onMove.bind(this), { passive: false });
      el.addEventListener("pointerup", this.onUp.bind(this), { passive: false });
      el.addEventListener("pointercancel", this.onUp.bind(this), { passive: false });
      el.addEventListener("lostpointercapture", this.onUp.bind(this), { passive: false });
      el.addEventListener("contextmenu", (e) => e.preventDefault());
    },
    setWeapon(w) {
      this.weapon = w;
      if (!this.el) return;
      const label = w === "sword" ? "УДАР" : w === "bow" ? "ВЫСТРЕЛ" : "КАСТ";
      this.el.textContent = label;
    },
    onDown(e) {
      if (this.pointerId !== null) return;
      this.pointerId = e.pointerId;
      try { this.el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      this.charging = true;
      this.chargeStart = now();
      this.charge = 0;
      this.el.classList.add("pressed");
      this.el.classList.add("charging");
      e.preventDefault();
    },
    onMove(e) {
      if (this.pointerId !== e.pointerId) return;
      if (this.charging) {
        this.charge = clamp((now() - this.chargeStart) / 1100, 0, 1);
      }
      e.preventDefault();
    },
    onUp(e) {
      if (this.pointerId !== e.pointerId) return;
      this.pointerId = null;
      try { this.el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      this.el.classList.remove("pressed");
      this.el.classList.remove("charging");
      if (!this.charging) return;
      const held = now() - this.chargeStart;
      this.charging = false;
      if (this.weapon === "sword") {
        if (held < 230) playerLightAttack();
        else playerHeavyAttack(clamp(held / 900, 0, 1));
      } else if (this.weapon === "bow") {
        if (held < 230) playerLightAttack();
        else playerHeavyAttack(clamp(held / 900, 0, 1));
      } else {
        // staff: каст силы от зарядки
        castElementalSpell("fire", 0.3 + this.charge);
      }
      this.charge = 0;
      e.preventDefault();
    },
  };

  // =========================================================
  // 11. NEXUS GRID (радиальное древо с pinch-zoom)
  // =========================================================
  const Nexus = {
    host: null,
    canvas: null,
    ctx: null,
    nodes: [],
    edges: [],
    cam: { x: 0, y: 0, zoom: 1 },
    pointers: new Map(),
    pinchStart: 0,
    pinchZoom: 1,
    dragged: null,
    panLast: null,
    dpr: 1,
    cw: 0, ch: 0,
    onUnlock: null,

    init(host, nodes) {
      this.host = host;
      if (!host) return;
      this.canvas = document.createElement("canvas");
      Object.assign(this.canvas.style, {
        position: "absolute", inset: "0",
        width: "100%", height: "100%", touchAction: "none",
      });
      host.appendChild(this.canvas);
      const ctx = this.canvas.getContext("2d");
      if (!ctx) throw new Error("NexusGrid: 2D context unavailable");
      this.ctx = ctx;

      this.nodes = nodes.map((n) => ({ ...n }));
      this.edges = [];
      for (const n of this.nodes) {
        if (n.requires) {
          const r = this.nodes.find((x) => x.id === n.requires);
          if (r) this.edges.push({ a: n, b: r });
        }
      }

      this.canvas.addEventListener("pointerdown", this.onDown.bind(this), { passive: false });
      this.canvas.addEventListener("pointermove", this.onMove.bind(this), { passive: false });
      this.canvas.addEventListener("pointerup", this.onUp.bind(this), { passive: false });
      this.canvas.addEventListener("pointercancel", this.onUp.bind(this), { passive: false });
      this.canvas.addEventListener("wheel", this.onWheel.bind(this), { passive: false });

      this.resize();
      window.addEventListener("resize", () => this.resize());
    },
    resize() {
      if (!this.canvas) return;
      this.dpr = clamp(window.devicePixelRatio || 1, 1, 3);
      const rect = this.canvas.getBoundingClientRect();
      this.cw = rect.width;
      this.ch = rect.height;
      if (this.cw <= 0 || this.ch <= 0) return;
      this.canvas.width = Math.floor(this.cw * this.dpr);
      this.canvas.height = Math.floor(this.ch * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.render();
    },
    w2s(wx, wy) {
      return {
        x: (wx - this.cam.x) * this.cam.zoom + this.cw / 2,
        y: (wy - this.cam.y) * this.cam.zoom + this.ch / 2,
      };
    },
    s2w(sx, sy) {
      return {
        x: (sx - this.cw / 2) / this.cam.zoom + this.cam.x,
        y: (sy - this.ch / 2) / this.cam.zoom + this.cam.y,
      };
    },
    pick(wx, wy) {
      for (const n of this.nodes) {
        const d2 = (n.x - wx) ** 2 + (n.y - wy) ** 2;
        if (d2 <= n.radius * n.radius) return n;
      }
      return null;
    },
    onDown(e) {
      const rect = this.canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      this.pointers.set(e.pointerId, { x: sx, y: sy });
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

      if (this.pointers.size === 1) {
        const w = this.s2w(sx, sy);
        const n = this.pick(w.x, w.y);
        if (n) { this.dragged = n; this.panLast = null; }
        else { this.panLast = { x: sx, y: sy }; }
      } else if (this.pointers.size === 2) {
        const pts = Array.from(this.pointers.values());
        this.pinchStart = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        this.pinchZoom = this.cam.zoom;
        this.dragged = null;
      }
      e.preventDefault();
    },
    onMove(e) {
      if (!this.pointers.has(e.pointerId)) return;
      const rect = this.canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left;
      const sy = e.clientY - rect.top;
      this.pointers.set(e.pointerId, { x: sx, y: sy });

      if (this.pointers.size === 2) {
        const pts = Array.from(this.pointers.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (this.pinchStart > 0) {
          this.cam.zoom = clamp(this.pinchZoom * (d / this.pinchStart), 0.25, 3);
          this.render();
        }
        e.preventDefault();
        return;
      }
      if (this.dragged) {
        const w = this.s2w(sx, sy);
        this.dragged.x = w.x;
        this.dragged.y = w.y;
        this.render();
        e.preventDefault();
        return;
      }
      if (this.panLast) {
        const dx = sx - this.panLast.x;
        const dy = sy - this.panLast.y;
        this.cam.x -= dx / this.cam.zoom;
        this.cam.y -= dy / this.cam.zoom;
        this.panLast = { x: sx, y: sy };
        this.render();
        e.preventDefault();
      }
    },
    onUp(e) {
      this.pointers.delete(e.pointerId);
      try { this.canvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      if (this.dragged) {
        const n = this.dragged;
        this.dragged = null;
        if (!n.unlocked) {
          const req = n.requires ? this.nodes.find((x) => x.id === n.requires) : null;
          const canUnlock = !req || req.unlocked;
          if (canUnlock && State.riftEnergy >= (n.cost || 1)) {
            n.unlocked = true;
            State.riftEnergy -= (n.cost || 1);
            if (typeof this.onUnlock === "function") this.onUnlock(n);
            this.render();
          }
        }
      }
      this.panLast = null;
      if (this.pointers.size < 2) this.pinchStart = 0;
    },
    onWheel(e) {
      const f = Math.exp(-e.deltaY * 0.001);
      this.cam.zoom = clamp(this.cam.zoom * f, 0.25, 3);
      this.render();
      e.preventDefault();
    },
    render() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.cw, this.ch);
      // Фон
      const g = ctx.createRadialGradient(this.cw / 2, this.ch / 2, 40, this.cw / 2, this.ch / 2, Math.max(this.cw, this.ch));
      g.addColorStop(0, "rgba(30,50,90,0.95)");
      g.addColorStop(1, "rgba(2,4,12,0.98)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, this.cw, this.ch);

      // Ребра
      for (const edge of this.edges) {
        const a = this.w2s(edge.a.x, edge.a.y);
        const b = this.w2s(edge.b.x, edge.b.y);
        ctx.strokeStyle = (edge.a.unlocked && edge.b.unlocked)
          ? "rgba(130,220,255,0.85)"
          : "rgba(90,130,190,0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      // Узлы
      for (const n of this.nodes) {
        const p = this.w2s(n.x, n.y);
        const r = n.radius * this.cam.zoom;
        const grad = ctx.createRadialGradient(p.x, p.y, r * 0.2, p.x, p.y, r);
        if (n.unlocked) {
          grad.addColorStop(0, "rgba(200,245,255,1)");
          grad.addColorStop(1, "rgba(50,140,240,0.9)");
        } else {
          const req = n.requires ? this.nodes.find((x) => x.id === n.requires) : null;
          const avail = !req || req.unlocked;
          if (avail) {
            grad.addColorStop(0, "rgba(160,180,220,0.9)");
            grad.addColorStop(1, "rgba(60,80,130,0.75)");
          } else {
            grad.addColorStop(0, "rgba(90,100,130,0.55)");
            grad.addColorStop(1, "rgba(30,40,70,0.55)");
          }
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = n.unlocked ? "rgba(210,250,255,1)" : "rgba(120,150,200,0.7)";
        ctx.lineWidth = 2;
        ctx.stroke();

        if (this.cam.zoom > 0.55) {
          ctx.fillStyle = "#e8f4ff";
          ctx.font = `${Math.round(12 * clamp(this.cam.zoom, 0.6, 1.6))}px system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.fillText(n.name, p.x, p.y + r + 14);
          if (!n.unlocked) {
            ctx.fillStyle = "rgba(255,216,138,0.9)";
            ctx.font = "700 10px system-ui";
            ctx.fillText("⚡ " + (n.cost || 1), p.x, p.y - r - 6);
          }
        }
      }
    },
    isOpen() { return this.host && this.host.classList.contains("open"); },
    open() {
      if (!this.host) return;
      this.host.classList.add("open");
      this.resize();
      this.render();
    },
    close() {
      if (!this.host) return;
      this.host.classList.remove("open");
    },
  };

  // =========================================================
  // 12. ИНВЕНТАРЬ (drag & drop)
  // =========================================================
  const Inventory = {
    grid: null,
    slots: [],
    drag: null,
    COLS: 6,
    ROWS: 4,
    init(gridEl, initial) {
      this.grid = gridEl;
      if (!gridEl) return;
      const total = this.COLS * this.ROWS;
      this.slots = [];
      for (let i = 0; i < total; i++) this.slots.push({ index: i, item: null });
      const seed = initial || [];
      for (let i = 0; i < seed.length && i < total; i++) this.slots[i].item = seed[i];
      this.render();
    },
    render() {
      if (!this.grid) return;
      this.grid.innerHTML = "";
      for (const slot of this.slots) {
        const cell = document.createElement("div");
        cell.className = "slot";
        cell.dataset.index = String(slot.index);
        if (slot.item) {
          cell.textContent = slot.item.icon;
          if (slot.item.stack > 1) {
            const s = document.createElement("span");
            s.className = "stack";
            s.textContent = String(slot.item.stack);
            cell.appendChild(s);
          }
          cell.title = slot.item.name;
          cell.addEventListener("pointerdown", (e) => this.startDrag(e, slot));
        }
        this.grid.appendChild(cell);
      }
    },
    startDrag(e, slot) {
      if (!slot.item || this.drag) return;
      const ghost = document.createElement("div");
      ghost.textContent = slot.item.icon;
      Object.assign(ghost.style, {
        position: "fixed",
        left: (e.clientX - 24) + "px",
        top: (e.clientY - 24) + "px",
        width: "48px", height: "48px",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: "34px", pointerEvents: "none", zIndex: "1000",
        filter: "drop-shadow(0 0 14px rgba(140,200,255,0.95))",
        touchAction: "none",
      });
      document.body.appendChild(ghost);
      this.drag = { item: slot.item, fromIndex: slot.index, ghost, pointerId: e.pointerId };
      try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

      const onMove = (ev) => {
        if (!this.drag) return;
        this.drag.ghost.style.left = (ev.clientX - 24) + "px";
        this.drag.ghost.style.top = (ev.clientY - 24) + "px";
      };
      const onEnd = (ev) => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onEnd);
        window.removeEventListener("pointercancel", onEnd);
        if (!this.drag) return;
        const { item, fromIndex } = this.drag;
        this.drag.ghost.remove();
        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        let toIndex = -1;
        if (target && target.dataset && target.dataset.index !== undefined) {
          toIndex = parseInt(target.dataset.index, 10);
        }
        if (Number.isFinite(toIndex) && toIndex >= 0 && toIndex !== fromIndex && this.slots[toIndex]) {
          const other = this.slots[toIndex].item;
          this.slots[toIndex].item = item;
          this.slots[fromIndex].item = other;
        }
        this.drag = null;
        this.render();
      };
      window.addEventListener("pointermove", onMove, { passive: true });
      window.addEventListener("pointerup", onEnd, { passive: false });
      window.addEventListener("pointercancel", onEnd, { passive: false });
      e.preventDefault();
    },
  };

  // =========================================================
  // 13. РЕНДЕРЕР
  // =========================================================
  const Renderer = {
    canvas: null, ctx: null, dpr: 1, cw: 0, ch: 0, PPU: 36,
    shakeX: 0, shakeY: 0,

    init(canvas) {
      if (!canvas) throw new Error("Canvas #game not found");
      this.canvas = canvas;
      const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      if (!ctx) throw new Error("Canvas 2D unavailable");
      this.ctx = ctx;
      this.resize();
      window.addEventListener("resize", () => this.resize(), { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(() => this.resize(), 120));
    },
    resize() {
      if (!this.canvas) return;
      const dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
      this.dpr = dpr;
      this.cw = window.innerWidth;
      this.ch = window.innerHeight;
      this.canvas.width = Math.max(1, Math.floor(this.cw * dpr));
      this.canvas.height = Math.max(1, Math.floor(this.ch * dpr));
      this.canvas.style.width = this.cw + "px";
      this.canvas.style.height = this.ch + "px";
      // PPU: около 22 юнитов в ширину, но с ограничением
      const targetW = 22;
      this.PPU = clamp(Math.min(this.cw, this.ch * 2.2) / targetW, 24, 92);
      if (Joystick) {
        Joystick.baseRadius = Math.min(90, Math.max(58, this.cw * 0.09));
        Joystick.knobRadius = Math.round(Joystick.baseRadius * 0.42);
      }
    },
    begin() {
      const ctx = this.ctx;
      const c = clamp(State.corruption, 0, 1);
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      // Фон
      const r0 = Math.floor(lerp(6, 40, c));
      const g0 = Math.floor(lerp(8, 6, c));
      const b0 = Math.floor(lerp(16, 22, c));
      const grad = ctx.createRadialGradient(
        this.cw / 2, this.ch / 2, 30,
        this.cw / 2, this.ch / 2, Math.max(this.cw, this.ch)
      );
      grad.addColorStop(0, `rgb(${r0 + 14},${g0 + 14},${b0 + 22})`);
      grad.addColorStop(1, `rgb(${r0},${g0},${b0})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, this.cw, this.ch);

      // Мировая трансформация
      const sh = State.shake;
      this.shakeX = sh > 0 ? rand(-sh, sh) : 0;
      this.shakeY = sh > 0 ? rand(-sh, sh) : 0;
      ctx.save();
      ctx.translate(this.cw / 2 + this.shakeX, this.ch / 2 + this.shakeY);
      ctx.scale(this.PPU, this.PPU);
      ctx.translate(-State.camX, -State.camY);
    },
    end() {
      const ctx = this.ctx;
      ctx.restore();

      // Виньетка
      const grad = ctx.createRadialGradient(
        this.cw / 2, this.ch / 2, Math.min(this.cw, this.ch) * 0.25,
        this.cw / 2, this.ch / 2, Math.max(this.cw, this.ch) * 0.75
      );
      const c = clamp(State.corruption, 0, 1);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(1, `rgba(${Math.floor(10 + c * 60)},0,${Math.floor(20 + c * 10)},${0.45 + c * 0.35})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, this.cw, this.ch);

      // Прицел/прицельный маркер
      if (P.player) this.drawFacingArc(ctx);
      this.drawJoystick(ctx);
    },
    drawGround(ctx) {
      // Сетка
      const W = World.size;
      const half = W / 2;
      const step = 2;
      ctx.lineWidth = 0.03;
      ctx.strokeStyle = "rgba(90,140,220,0.10)";
      ctx.beginPath();
      for (let x = -half; x <= half; x += step) {
        ctx.moveTo(x, -half);
        ctx.lineTo(x, half);
      }
      for (let y = -half; y <= half; y += step) {
        ctx.moveTo(-half, y);
        ctx.lineTo(half, y);
      }
      ctx.stroke();

      // Клетки заражения
      for (const cell of World.cells) {
        const c = cell.corruption;
        if (Math.abs(c) < 0.05) continue;
        const alpha = Math.min(Math.abs(c), 0.5);
        if (c > 0) {
          ctx.fillStyle = `rgba(255,${Math.floor(60 - c * 40)},${Math.floor(90 - c * 60)},${alpha * 0.35})`;
        } else {
          ctx.fillStyle = `rgba(${Math.floor(60 - Math.abs(c) * 40)},${Math.floor(180 + Math.abs(c) * 40)},${Math.floor(120)},${alpha * 0.3})`;
        }
        ctx.fillRect(cell.cx - World.cellSize / 2, cell.cy - World.cellSize / 2, World.cellSize, World.cellSize);
      }
    },
    drawZones(ctx) {
      const t = now() * 0.002;
      for (const z of P.zones) {
        const c = Elements.colors[z.element] || "#fff";
        const pulse = 1 + Math.sin(t * 3 + z.pulse) * 0.06;
        const alpha = clamp(z.life / z.maxLife, 0, 1) * 0.55;
        const grad = ctx.createRadialGradient(z.x, z.y, z.radius * 0.1, z.x, z.y, z.radius * pulse);
        grad.addColorStop(0, this.hexA(c, alpha * 1.2));
        grad.addColorStop(0.7, this.hexA(c, alpha * 0.55));
        grad.addColorStop(1, this.hexA(c, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.radius * pulse, 0, TAU);
        ctx.fill();

        ctx.strokeStyle = this.hexA(c, alpha * 0.9);
        ctx.lineWidth = 0.08;
        ctx.stroke();
      }
    },
    drawShadows(ctx) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      const all = [P.player, ...P.enemies].filter(Boolean);
      for (const e of all) {
        ctx.beginPath();
        ctx.ellipse(e.x, e.y + e.radius * 0.7, e.radius * 1.25, e.radius * 0.5, 0, 0, TAU);
        ctx.fill();
      }
    },
    drawEntities(ctx) {
      const all = [...P.enemies];
      if (P.player) all.push(P.player);
      all.sort((a, b) => a.y - b.y);
      for (const e of all) {
        if (e === P.player) this.drawPlayer(ctx, e);
        else this.drawEnemy(ctx, e);
      }
    },
    drawPlayer(ctx, p) {
      const flash = p.hitFlash > 0;
      // Свечение
      const glow = ctx.createRadialGradient(p.x, p.y, p.radius * 0.5, p.x, p.y, p.radius * 2.6);
      glow.addColorStop(0, "rgba(140,210,255,0.55)");
      glow.addColorStop(1, "rgba(140,210,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * 2.6, 0, TAU);
      ctx.fill();

      // Тело
      const grad = ctx.createRadialGradient(
        p.x - p.radius * 0.4, p.y - p.radius * 0.5, p.radius * 0.15,
        p.x, p.y, p.radius
      );
      if (flash) {
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(1, "#ff8899");
      } else {
        grad.addColorStop(0, "#dff4ff");
        grad.addColorStop(0.5, "#6fb6ea");
        grad.addColorStop(1, "#1c3a66");
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(180,235,255,0.95)";
      ctx.lineWidth = 0.09;
      ctx.stroke();

      // Направление (клинок/посох)
      const fx = Math.cos(p.facing), fy = Math.sin(p.facing);
      const tipX = p.x + fx * p.radius * 1.7;
      const tipY = p.y + fy * p.radius * 1.7;

      // Индикатор оружия
      if (p.weapon === "sword") {
        const swing = p.swingT > 0 ? 1 : 0;
        const arcW = swing ? 1.6 : 0;
        if (swing) {
          const a0 = p.facing - arcW * 0.8 * p.swingDir;
          const a1 = p.facing + arcW * 0.8 * p.swingDir;
          const gArc = ctx.createRadialGradient(p.x, p.y, p.radius * 0.9, p.x, p.y, p.radius * 2.2);
          gArc.addColorStop(0, "rgba(230,245,255,0.0)");
          gArc.addColorStop(0.6, "rgba(200,235,255,0.7)");
          gArc.addColorStop(1, "rgba(120,200,255,0)");
          ctx.fillStyle = gArc;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.arc(p.x, p.y, p.radius * 2.2, a0, a1);
          ctx.closePath();
          ctx.fill();
        }
        ctx.strokeStyle = "#eaf6ff";
        ctx.lineWidth = 0.16;
        ctx.beginPath();
        ctx.moveTo(p.x + fx * p.radius * 0.6, p.y + fy * p.radius * 0.6);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
      } else if (p.weapon === "bow") {
        ctx.strokeStyle = "#eaf6ff";
        ctx.lineWidth = 0.13;
        ctx.beginPath();
        ctx.arc(p.x + fx * p.radius * 0.4, p.y + fy * p.radius * 0.4, p.radius * 0.9,
          p.facing + Math.PI * 0.7, p.facing - Math.PI * 0.7);
        ctx.stroke();
      } else if (p.weapon === "staff") {
        ctx.strokeStyle = "#eaf6ff";
        ctx.lineWidth = 0.14;
        ctx.beginPath();
        ctx.moveTo(p.x + fx * p.radius * 0.3, p.y + fy * p.radius * 0.3);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        // Сфера на конце
        const glowOrb = ctx.createRadialGradient(tipX, tipY, 0.02, tipX, tipY, 0.28);
        glowOrb.addColorStop(0, "rgba(255,230,120,1)");
        glowOrb.addColorStop(1, "rgba(255,160,40,0)");
        ctx.fillStyle = glowOrb;
        ctx.beginPath();
        ctx.arc(tipX, tipY, 0.28, 0, TAU);
        ctx.fill();
      }

      // HP-бар
      const barW = 1.6, barH = 0.16;
      const bx = p.x - barW / 2, by = p.y - p.radius - 0.6;
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(bx, by, barW, barH);
      const hpPct = clamp(p.hp / p.maxHp, 0, 1);
      const hpg = ctx.createLinearGradient(bx, by, bx + barW, by);
      hpg.addColorStop(0, "#4be0a0");
      hpg.addColorStop(1, "#a0ffcc");
      ctx.fillStyle = hpg;
      ctx.fillRect(bx, by, barW * hpPct, barH);
      ctx.strokeStyle = "rgba(200,230,255,0.6)";
      ctx.lineWidth = 0.03;
      ctx.strokeRect(bx, by, barW, barH);

      // Мана
      const byM = by + barH + 0.05;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(bx, byM, barW, barH * 0.6);
      const mg = ctx.createLinearGradient(bx, byM, bx + barW, byM);
      mg.addColorStop(0, "#5fa8ff");
      mg.addColorStop(1, "#b0d8ff");
      ctx.fillStyle = mg;
      ctx.fillRect(bx, byM, barW * clamp(p.mana / p.maxMana, 0, 1), barH * 0.6);
    },
    drawEnemy(ctx, e) {
      const flash = e.hitFlash > 0;
      // Аура элиты
      if (e.isElite) {
        const aura = ctx.createRadialGradient(e.x, e.y, e.radius * 0.5, e.x, e.y, e.radius * 3);
        aura.addColorStop(0, "rgba(255,80,160,0.5)");
        aura.addColorStop(1, "rgba(255,80,160,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 3, 0, TAU);
        ctx.fill();
      }
      const grad = ctx.createRadialGradient(
        e.x - e.radius * 0.3, e.y - e.radius * 0.4, e.radius * 0.15,
        e.x, e.y, e.radius
      );
      if (flash) {
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(1, "#ffd0d0");
      } else if (e.isElite) {
        grad.addColorStop(0, "#ffd6e8");
        grad.addColorStop(0.5, "#ff3d8a");
        grad.addColorStop(1, "#5a0a30");
      } else {
        grad.addColorStop(0, "#ffc8c8");
        grad.addColorStop(0.5, "#d84060");
        grad.addColorStop(1, "#3a0812");
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = e.isElite ? "rgba(255,180,220,1)" : "rgba(255,120,140,0.9)";
      ctx.lineWidth = 0.08;
      ctx.stroke();

      // Глаза
      const lookA = angleTo(e.x, e.y, P.player ? P.player.x : e.x, P.player ? P.player.y : e.y);
      const ex1 = e.x + Math.cos(lookA - 0.35) * e.radius * 0.35;
      const ey1 = e.y + Math.sin(lookA - 0.35) * e.radius * 0.35;
      const ex2 = e.x + Math.cos(lookA + 0.35) * e.radius * 0.35;
      const ey2 = e.y + Math.sin(lookA + 0.35) * e.radius * 0.35;
      ctx.fillStyle = "#ffe259";
      ctx.beginPath();
      ctx.arc(ex1, ey1, e.radius * 0.13, 0, TAU);
      ctx.arc(ex2, ey2, e.radius * 0.13, 0, TAU);
      ctx.fill();

      // HP-бар
      const barW = e.radius * 2.2, barH = 0.12;
      const bx = e.x - barW / 2, by = e.y - e.radius - 0.5;
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(bx, by, barW, barH);
      const pct = clamp(e.hp / e.maxHp, 0, 1);
      const hpg = ctx.createLinearGradient(bx, by, bx + barW, by);
      if (e.isElite) {
        hpg.addColorStop(0, "#ff5599");
        hpg.addColorStop(1, "#ffb0d0");
      } else {
        hpg.addColorStop(0, "#ff5555");
        hpg.addColorStop(1, "#ffaaaa");
      }
      ctx.fillStyle = hpg;
      ctx.fillRect(bx, by, barW * pct, barH);
    },
    drawProjectiles(ctx) {
      for (const pr of P.projectiles) {
        const g = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, pr.radius * 4);
        g.addColorStop(0, pr.color);
        g.addColorStop(0.4, this.hexA(pr.color, 0.55));
        g.addColorStop(1, this.hexA(pr.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, pr.radius * 4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(pr.x, pr.y, pr.radius * 0.6, 0, TAU);
        ctx.fill();
      }
    },
    drawParticles(ctx) {
      for (const p of P.particles) {
        const a = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = this.hexA(p.color, a);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
        ctx.fill();
      }
    },
    drawDamageNumbers(ctx) {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const d of P.dmgNumbers) {
        const a = clamp(d.life, 0, 1);
        const size = 0.55 + (1 - a) * 0.2;
        ctx.font = `700 ${size}px system-ui, sans-serif`;
        ctx.lineWidth = 0.09;
        ctx.strokeStyle = "rgba(0,0,0," + (a * 0.9) + ")";
        const text = d.kind === "hurt" ? "-" + d.value : d.value.toString();
        ctx.strokeText(text, d.x, d.y);
        let color = "#ffffff";
        if (d.kind === "hurt") color = "#ff6060";
        else if (d.kind === "heavy") color = "#ffd88a";
        else if (d.kind === "chain") color = "#fff5a0";
        else if (d.kind === "freeze") color = "#9be6ff";
        else if (d.kind === "burn") color = "#ffb060";
        else if (d.kind === "slash") color = "#eaf6ff";
        ctx.fillStyle = this.hexA(color, a);
        ctx.fillText(text, d.x, d.y);
      }
    },
    drawFacingArc(ctx) {
      // мировой прицел-стрелка впереди игрока
      const p = P.player;
      if (!p) return;
      const a = p.facing;
      const dist_ = 1.6;
      const cx = p.x + Math.cos(a) * dist_;
      const cy = p.y + Math.sin(a) * dist_;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a);
      ctx.strokeStyle = "rgba(200,235,255,0.35)";
      ctx.lineWidth = 0.06;
      ctx.beginPath();
      ctx.moveTo(-0.3, -0.15);
      ctx.lineTo(0.3, 0);
      ctx.lineTo(-0.3, 0.15);
      ctx.stroke();
      ctx.restore();
    },
    drawJoystick(ctx) {
      if (!Joystick.active) return;
      const bx = Joystick.baseX;
      const by = Joystick.baseY;
      const R = Joystick.baseRadius;
      const kr = Joystick.knobRadius;

      // База
      const g = ctx.createRadialGradient(bx, by, R * 0.2, bx, by, R);
      g.addColorStop(0, "rgba(80,140,220,0.18)");
      g.addColorStop(0.7, "rgba(40,80,160,0.10)");
      g.addColorStop(1, "rgba(20,40,90,0.02)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bx, by, R, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(140,200,255,0.4)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Кольцо
      ctx.strokeStyle = "rgba(140,200,255,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(bx, by, R * 0.7, 0, TAU);
      ctx.stroke();

      // Кноб
      const kg = ctx.createRadialGradient(
        Joystick.knobX - kr * 0.3, Joystick.knobY - kr * 0.4, kr * 0.15,
        Joystick.knobX, Joystick.knobY, kr
      );
      kg.addColorStop(0, "rgba(230,245,255,0.95)");
      kg.addColorStop(1, "rgba(90,150,230,0.85)");
      ctx.fillStyle = kg;
      ctx.beginPath();
      ctx.arc(Joystick.knobX, Joystick.knobY, kr, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(200,235,255,0.9)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    },
    hexA(hex, a) {
      // #rrggbb → rgba(r,g,b,a)
      if (typeof hex !== "string" || hex.length < 7 || hex[0] !== "#") {
        return "rgba(255,255,255," + a + ")";
      }
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return "rgba(" + r + "," + g + "," + b + "," + a + ")";
    },
  };

  // =========================================================
  // 14. ОБНОВЛЕНИЕ
  // =========================================================
  function update(dt) {
    if (!P.player) return;
    const p = P.player;

    // Инпут
    const moveMag = Joystick.magnitude;
    if (moveMag > 0) {
      p.vx += Joystick.dx * p.speed * 8 * dt;
      p.vy += Joystick.dy * p.speed * 8 * dt;
      p.facing = Math.atan2(Joystick.dy, Joystick.dx);
    }

    // Ограничение скорости
    const sp = Math.hypot(p.vx, p.vy);
    const maxSp = p.speed;
    if (sp > maxSp) {
      p.vx = (p.vx / sp) * maxSp;
      p.vy = (p.vy / sp) * maxSp;
    }

    // Реген маны
    p.mana = clamp(p.mana + p.manaRegen * dt, 0, p.maxMana);
    p.swingT = Math.max(0, p.swingT - dt);
    p.hitFlash = Math.max(0, p.hitFlash - dt);
    p.invuln = Math.max(0, p.invuln - dt);
    p.castCooldown = Math.max(0, p.castCooldown - dt);

    // Физика
    integrate(p, dt);

    // AI + физика врагов
    for (const e of P.enemies) {
      updateEnemyAI(e, dt);
      integrate(e, dt);
      if (!isFinite(e.hp)) e.hp = 0;
      if (e.hp <= 0) killEnemy(e);
    }

    // Разрешаем столкновения
    resolveCollisions();

    // Проектилы
    updateProjectiles(dt);

    // Элементы
    Elements.step(dt);

    // Мировой пульс
    World.pulse(dt, p);

    // Частицы
    const pk = [];
    for (const pr of P.particles) {
      pr.life -= dt;
      if (pr.life <= 0) continue;
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
      pr.vx *= Math.pow(0.5, dt);
      pr.vy *= Math.pow(0.5, dt);
      pk.push(pr);
    }
    P.particles = pk;

    // Цифры урона
    const dk = [];
    for (const d of P.dmgNumbers) {
      d.life -= dt * 1.4;
      d.y += d.vy * dt;
      d.vy *= 0.94;
      if (d.life > 0) dk.push(d);
    }
    P.dmgNumbers = dk;

    // Спавн врагов
    if (P.enemies.length < 14) {
      State.spawnTimer = (State.spawnTimer || 0) + dt;
      if (State.spawnTimer > 1.6) {
        State.spawnTimer = 0;
        spawnEnemy();
      }
    }

    // Камера: следим за игроком + сдвиг по инерции
    const camTargetX = p.x + p.vx * 0.16;
    const camTargetY = p.y + p.vy * 0.16;
    State.camX = lerp(State.camX, camTargetX, 1 - Math.pow(0.001, dt));
    State.camY = lerp(State.camY, camTargetY, 1 - Math.pow(0.001, dt));

    // Тряска
    State.shake *= Math.pow(0.02, dt);

    // Время
    State.time += dt;
    State.dmgFlashT = Math.max(0, State.dmgFlashT - dt);

    // События на уровне UI
    if (State.dmgFlashT > 0) {
      const el = document.getElementById("dmgFlash");
      if (el) el.classList.add("hit");
    } else {
      const el = document.getElementById("dmgFlash");
      if (el) el.classList.remove("hit");
    }

    // Глитч от коррупции
    const glitchEl = document.getElementById("glitch");
    if (glitchEl) {
      const c = clamp(State.corruption, 0, 1);
      const intensity = c > 0.4 ? (c - 0.4) / 0.6 : 0;
      glitchEl.style.opacity = String(intensity * 0.9);
      glitchEl.classList.toggle("active", intensity > 0.2);
    }
  }

  // =========================================================
  // 15. HUD ОБНОВЛЕНИЕ
  // =========================================================
  const HUD = {
    hp: null, mana: null, lvl: null, rift: null,
    init() {
      this.hp = document.getElementById("hpText");
      this.mana = document.getElementById("manaText");
      this.lvl = document.getElementById("lvlText");
      this.rift = document.getElementById("riftText");
    },
    sync() {
      if (!P.player) return;
      if (this.hp) this.hp.textContent = String(Math.max(0, Math.round(P.player.hp)));
      if (this.mana) this.mana.textContent = String(Math.round(P.player.mana));
      if (this.lvl) this.lvl.textContent = String(State.level);
      if (this.rift) this.rift.textContent = Math.round(State.corruption * 100) + "%";
    },
  };

  // =========================================================
  // 16. ГЛАВНЫЙ ЦИКЛ
  // =========================================================
  const FIXED_DT = 1 / 60;
  const MAX_ACC = 0.25;
  const MAX_STEPS = 5;

  let rafId = null;
  let lastTime = 0;
  let accumulator = 0;
  let running = false;

  function loop(nowMs_) {
    rafId = requestAnimationFrame(loop);
    try {
      let frameTime = (nowMs_ - lastTime) / 1000;
      lastTime = nowMs_;
      if (!isFinite(frameTime) || frameTime < 0) frameTime = 0;
      if (frameTime > MAX_ACC) frameTime = MAX_ACC;
      accumulator += frameTime;

      let steps = 0;
      while (accumulator >= FIXED_DT && steps < MAX_STEPS) {
        update(FIXED_DT);
        accumulator -= FIXED_DT;
        steps++;
      }
      if (steps === MAX_STEPS) accumulator = 0;

      // Рендер
      Renderer.begin();
      Renderer.drawGround(Renderer.ctx);
      Renderer.drawZones(Renderer.ctx);
      Renderer.drawShadows(Renderer.ctx);
      Renderer.drawEntities(Renderer.ctx);
      Renderer.drawProjectiles(Renderer.ctx);
      Renderer.drawParticles(Renderer.ctx);
      Renderer.drawDamageNumbers(Renderer.ctx);
      Renderer.end();
      HUD.sync();
    } catch (err) {
      console.error("[Apex] loop error:", err);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    lastTime = now();
    accumulator = 0;
    rafId = requestAnimationFrame(loop);
  }
  function stopLoop() {
    running = false;
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  // =========================================================
  // 17. ИНИЦИАЛИЗАЦИЯ
  // =========================================================
  function initWeaponsUI() {
    const btnWeapon = document.getElementById("btnWeapon");
    const btnLight = document.getElementById("btnLightning");
    const btnFire = document.getElementById("btnFire");
    const btnWater = document.getElementById("btnWater");

    const updateActive = (weapon) => {
      [btnWeapon, btnLight, btnFire, btnWater].forEach((b) => b && b.classList.remove("equipped"));
      if (weapon === "sword" && btnWeapon) btnWeapon.classList.add("equipped");
      if (weapon === "bow" && btnWeapon) btnWeapon.classList.add("equipped");
      if (weapon === "staff" && btnWeapon) btnWeapon.classList.add("equipped");
    };

    if (btnWeapon) {
      btnWeapon.addEventListener("click", () => {
        if (!P.player) return;
        const order = ["sword", "bow", "staff"];
        const i = order.indexOf(P.player.weapon);
        P.player.weapon = order[(i + 1) % order.length];
        AttackButton.setWeapon(P.player.weapon);
        btnWeapon.textContent = P.player.weapon === "sword" ? "МЕЧ"
          : P.player.weapon === "bow" ? "ЛУК" : "ПОСОХ";
        updateActive(P.player.weapon);
      });
    }
    const castBtn = (el, element) => {
      if (!el) return;
      el.addEventListener("click", () => {
        if (!P.player) return;
        if (P.player.weapon !== "staff") {
          P.player.weapon = "staff";
          AttackButton.setWeapon("staff");
          if (btnWeapon) btnWeapon.textContent = "ПОСОХ";
          updateActive("staff");
        }
        castElementalSpell(element, 0.7);
      });
    };
    castBtn(btnLight, "lightning");
    castBtn(btnFire, "fire");
    castBtn(btnWater, "water");
  }

  function initUI() {
    const btnInv = document.getElementById("btnInv");
    const btnNexus = document.getElementById("btnNexus");
    const invEl = document.getElementById("inv");
    const closeInv = document.getElementById("closeInv");
    const nexusHost = document.getElementById("nexusHost");
    const closeNexus = document.getElementById("closeNexus");
    const invGrid = document.getElementById("invGrid");
    const attackEl = document.getElementById("btnAttack");
    const gameCanvas = document.getElementById("game");

    // Инвентарь
    Inventory.init(invGrid, [
      { id: "sword_1", name: "Клинок Рифтера", icon: "⚔️", type: "weapon", stack: 1 },
      { id: "potion_hp", name: "Зелье жизни", icon: "🧪", type: "consumable", stack: 5 },
      { id: "mana_crystal", name: "Кристалл маны", icon: "💎", type: "consumable", stack: 3 },
      { id: "rune_fire", name: "Руна огня", icon: "🔥", type: "material", stack: 7 },
      { id: "rune_ice", name: "Руна льда", icon: "❄️", type: "material", stack: 4 },
      { id: "core_light", name: "Ядро молнии", icon: "⚡", type: "material", stack: 2 },
    ]);

    if (btnInv && invEl) {
      btnInv.addEventListener("click", () => {
        invEl.classList.toggle("open");
      });
    }
    if (closeInv && invEl) closeInv.addEventListener("click", () => invEl.classList.remove("open"));

    // Nexus Grid
    const nodes = [];
    const nodeCount = 18;
    for (let i = 0; i < nodeCount; i++) {
      const tier = Math.floor(i / 6);
      const idx = i % 6;
      const a = (idx / 6) * TAU + (tier * 0.5);
      const r = 55 + tier * 65;
      nodes.push({
        id: "n" + i,
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        radius: 20,
        name: "УЗЕЛ " + i,
        tier,
        cost: 1 + tier,
        requires: i === 0 ? null : (tier === 0 ? "n0" : "n" + (i - 6 + (idx % 6 === 0 ? 0 : 0))),
        unlocked: i === 0,
      });
    }
    // Упрощаем связи: на первом ряду связи между соседями
    for (let i = 0; i < 6; i++) {
      if (i > 0) nodes[i].requires = "n" + (i - 1);
    }
    for (let i = 6; i < 12; i++) nodes[i].requires = "n" + (i - 6);
    for (let i = 12; i < 18; i++) nodes[i].requires = "n" + (i - 6);

    Nexus.init(nexusHost, nodes);
    Nexus.onUnlock = (n) => {
      console.log("[Nexus] Разблокирован узел:", n.name);
    };

    if (btnNexus && nexusHost) {
      btnNexus.addEventListener("click", () => {
        if (nexusHost.classList.contains("open")) Nexus.close();
        else Nexus.open();
      });
    }
    if (closeNexus) closeNexus.addEventListener("click", () => Nexus.close());

    // Атака
    AttackButton.init(attackEl);

    // Канвас — джойстик (pointer events)
    if (gameCanvas) {
      gameCanvas.addEventListener("pointerdown", safe(function (e) {
        if (Nexus.isOpen()) return;
        const started = Joystick.tryStart(e.clientX, e.clientY, e.pointerId, window.innerWidth);
        if (started) {
          try { gameCanvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          e.preventDefault();
        }
      }), { passive: false });

      gameCanvas.addEventListener("pointermove", safe(function (e) {
        if (Joystick.pointerId === e.pointerId) {
          Joystick.move(e.clientX, e.clientY);
          e.preventDefault();
        }
      }), { passive: false });

      const endJs = safe(function (e) {
        Joystick.end(e.pointerId);
        try { gameCanvas.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      });
      gameCanvas.addEventListener("pointerup", endJs, { passive: false });
      gameCanvas.addEventListener("pointercancel", endJs, { passive: false });
      gameCanvas.addEventListener("lostpointercapture", endJs, { passive: false });

      // Защита от контекстного меню
      gameCanvas.addEventListener("contextmenu", (e) => e.preventDefault());
    }
  }

  function initLifecycle() {
    // Пауза при сворачивании
    document.addEventListener("visibilitychange", safe(function () {
      if (document.hidden) {
        stopLoop();
      } else if (State.running) {
        startLoop();
      }
    }));

    // Глобальные перехватчики ошибок
    window.addEventListener("error", (e) => {
      console.error("[Apex] window error:", e.error || e.message);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error("[Apex] unhandled rejection:", e.reason);
    });
  }

  function boot() {
    try {
      // Canvas + рендер
      const canvas = document.getElementById("game");
      if (!canvas) {
        console.error("[Apex] Нет canvas#game");
        return;
      }
      Renderer.init(canvas);

      // Мир
      World.init();

      // Игрок
      P.player = {
        id: nextId++,
        x: 0, y: 0, vx: 0, vy: 0,
        radius: 0.7, mass: 1.4, friction: 0.82,
        hp: 100, maxHp: 100,
        mana: 80, maxMana: 80, manaRegen: 7,
        facing: -Math.PI / 2,
        weapon: "sword",
        swingT: 0, swingDir: 1,
        hitFlash: 0, invuln: 0, castCooldown: 0,
        speed: 7.5,
      };

      // UI
      HUD.init();
      initUI();
      initWeaponsUI();
      initLifecycle();

      // Первые враги
      for (let i = 0; i < 5; i++) spawnEnemy();

      // События
      bus.on("enemy:killed", () => {
        // лёгкая вспышка
        if (P.player) spawnBurst(P.player.x, P.player.y, "#9be6ff", 4, 0, 2);
      });

      // Автосохранение (заглушка — в реальности отправка на сервер)
      setInterval(() => {
        if (!P.player) return;
        try {
          localStorage.setItem("apex:autosave", JSON.stringify({
            x: P.player.x, y: P.player.y,
            level: State.level,
            kills: State.killCount,
            time: Date.now(),
          }));
        } catch (err) { /* ignore */ }
      }, 15000);

      // Запуск
      State.running = true;
      startLoop();
      console.log("[Apex] Инициализация завершена. Игра запущена.");
    } catch (err) {
      console.error("[Apex] boot error:", err);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }

  // Экспорт в window для отладки (необязательно)
  window.Apex = { State, World, P, Elements, Nexus, Inventory, Renderer, Joystick, AttackButton };
})();
</script>
