<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030a">
<title>APEX — Rifters of Aethelgard</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sa-top:env(safe-area-inset-top,0px);
  --sa-bottom:env(safe-area-inset-bottom,0px);
  --sa-left:env(safe-area-inset-left,0px);
  --sa-right:env(safe-area-inset-right,0px);
  --gold:#ffd897; --gold-deep:#a06b20;
  --neon:#7cd9ff; --blood:#ff4d5e; --magic:#b85aff;
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05030a;
  color:#e8dfd0;font-family:-apple-system,BlinkMacSystemFont,"Cinzel","Segoe UI",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
canvas{display:block;outline:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden}

/* ================= VIGNETTE ================= */
.vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.9) 100%),
  linear-gradient(180deg,rgba(10,6,30,.35) 0%,transparent 25%,transparent 75%,rgba(20,0,30,.55) 100%)}

/* ================= LOADER ================= */
#loader{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#150820 0%,#05030a 70%);
  transition:opacity .8s ease;padding:24px}
#loader.hide{opacity:0;pointer-events:none}
.loader-rune{width:92px;height:92px;margin-bottom:24px;border-radius:50%;
  border:2px solid transparent;border-top-color:#ffd897;border-right-color:rgba(255,200,120,.3);
  border-bottom-color:rgba(180,80,255,.6);border-left-color:rgba(255,200,120,.15);
  box-shadow:0 0 30px rgba(255,180,80,.5),inset 0 0 30px rgba(180,80,255,.35);
  animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:"Cinzel",Georgia,serif;font-size:38px;letter-spacing:.4em;
  color:#ffe7b0;margin:0 0 22px;font-weight:900;
  text-shadow:0 0 20px rgba(255,180,80,.8),0 0 50px rgba(255,120,40,.4)}
.loader-bar{width:min(420px,80vw);height:6px;border-radius:3px;background:rgba(255,255,255,.08);
  overflow:hidden;border:1px solid rgba(180,140,80,.35)}
.loader-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#a06b20,#fff1ce,#ff9c4a);
  box-shadow:0 0 18px #ffd897;transition:width .35s cubic-bezier(.4,0,.2,1)}
.loader-status{margin-top:16px;font-size:11px;letter-spacing:.35em;text-transform:uppercase;
  color:#d8c7a0;opacity:.85;text-align:center;font-family:"Cinzel",Georgia,serif}
.loader-percent{margin-top:8px;font-family:"Cinzel",Georgia,serif;font-size:22px;
  font-weight:700;color:#ffe7b0;text-shadow:0 0 16px rgba(255,180,80,.9);letter-spacing:.12em}
.loader-start{margin-top:28px;padding:16px 48px;font-family:"Cinzel",Georgia,serif;
  font-size:15px;letter-spacing:.35em;text-transform:uppercase;font-weight:700;color:#1a0d04;
  border-radius:4px;background:linear-gradient(180deg,#ffe4a0 0%,#e0a94e 45%,#a06b20 55%,#52330c 100%);
  box-shadow:0 0 0 1px rgba(255,220,150,.9) inset,0 0 0 3px rgba(40,20,8,.9) inset,
  0 0 40px rgba(255,180,80,.7),0 12px 30px rgba(0,0,0,.85);
  opacity:.35;pointer-events:none;transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
.loader-start.ready{opacity:1;pointer-events:auto}
.loader-start.ready:hover{transform:translateY(-2px) scale(1.03)}
.loader-retry{margin-top:20px;padding:10px 22px;background:rgba(80,20,20,.8);
  border:1px solid rgba(255,100,100,.7);color:#ffb0b0;border-radius:6px;
  font-size:11px;letter-spacing:.25em;text-transform:uppercase;display:none}

/* ================= MENU ================= */
#menu{position:absolute;inset:0;z-index:10;display:none}
#logo{position:absolute;top:calc(2% + var(--sa-top));left:50%;transform:translateX(-50%);
  text-align:center;z-index:12;pointer-events:none}
#logo h1{margin:0;font-family:"Cinzel",Georgia,serif;font-size:clamp(36px,6.5vw,82px);
  letter-spacing:.35em;font-weight:900;
  background:linear-gradient(180deg,#fff1ce 0%,#e8c88c 40%,#b8823a 70%,#6b4520 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,190,110,.7))}
#logo .sub{margin-top:2px;font-size:clamp(9px,1.1vw,12px);letter-spacing:.7em;
  color:#d8c7a0;opacity:.85;text-transform:uppercase;font-weight:600}
#logo .sub span{color:#ff9c4a;text-shadow:0 0 8px rgba(255,140,60,.9)}

.race-panel{position:absolute;top:calc(22% + var(--sa-top));left:calc(2.5% + var(--sa-left));
  width:clamp(220px,24vw,320px);padding:18px 16px;z-index:12;
  background:linear-gradient(135deg,rgba(30,20,50,.65),rgba(10,6,20,.85));
  border:1px solid rgba(180,140,80,.55);border-radius:14px;
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 0 40px rgba(120,60,20,.4),0 0 0 1px rgba(255,200,120,.15) inset,0 20px 60px rgba(0,0,0,.8)}
.race-panel h2{margin:0 0 12px;font-family:"Cinzel",Georgia,serif;font-size:13px;
  letter-spacing:.28em;color:#ffd897;text-transform:uppercase;text-align:center}
.race-list{display:flex;flex-direction:column;gap:8px}
.race-card{position:relative;padding:10px 12px;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,rgba(50,35,80,.55),rgba(15,10,25,.75));
  border:1px solid rgba(140,110,70,.45);transition:all .3s cubic-bezier(.2,.9,.3,1.2)}
.race-card:hover{transform:translateX(5px);border-color:rgba(255,200,120,.8)}
.race-card.active{border-color:#ffc879;background:linear-gradient(135deg,rgba(90,60,30,.75),rgba(40,25,60,.9));
  box-shadow:0 0 24px rgba(255,180,80,.55),0 0 0 1px rgba(255,220,160,.5) inset;transform:translateX(8px)}
.rc-name{font-family:"Cinzel",Georgia,serif;font-size:12px;letter-spacing:.14em;
  color:#f0dcb4;margin-bottom:3px;text-transform:uppercase}
.race-card.active .rc-name{color:#ffe7b0}
.rc-desc{font-size:9.5px;line-height:1.35;color:rgba(220,200,180,.7)}
.rc-tag{display:inline-block;padding:2px 7px;margin-top:5px;font-size:8px;
  letter-spacing:.2em;border:1px solid rgba(255,180,80,.5);border-radius:4px;color:#ffbe72;text-transform:uppercase}

.stats-panel{position:absolute;top:calc(22% + var(--sa-top));right:calc(2.5% + var(--sa-right));
  width:clamp(200px,22vw,300px);padding:16px 14px;z-index:12;
  background:linear-gradient(135deg,rgba(25,15,45,.7),rgba(8,4,16,.85));
  border:1px solid rgba(180,140,80,.5);border-radius:14px;
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  box-shadow:0 0 40px rgba(120,60,20,.4),0 20px 60px rgba(0,0,0,.8)}
.stats-panel h3{margin:0 0 10px;font-family:"Cinzel",Georgia,serif;font-size:11.5px;
  letter-spacing:.3em;color:#ffd897;text-align:center;text-transform:uppercase}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px}
.stat-row .lbl{color:rgba(220,200,180,.75);letter-spacing:.12em;text-transform:uppercase;font-size:9px}
.stat-row .val{color:#ffe7b0;font-weight:700;font-size:12.5px}
.stat-bar{height:4px;border-radius:2px;margin-top:3px;background:rgba(0,0,0,.55);overflow:hidden}
.stat-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff8040,#ffd070);
  transition:width .6s cubic-bezier(.3,.9,.3,1)}

.btn-play{position:absolute;bottom:calc(5% + var(--sa-bottom));left:50%;transform:translateX(-50%);
  z-index:20;padding:22px 78px;font-family:"Cinzel",Georgia,serif;
  font-size:clamp(16px,1.8vw,22px);letter-spacing:.4em;text-transform:uppercase;font-weight:900;
  color:#1a0d04;border-radius:6px;
  background:linear-gradient(180deg,#fff0c4 0%,#ffd070 30%,#e0a94e 55%,#8a5a1c 100%);
  box-shadow:0 0 0 1px rgba(255,240,190,1) inset,0 0 0 4px rgba(60,30,10,.95) inset,
  0 0 60px rgba(255,200,120,.85),0 0 140px rgba(255,140,50,.55),0 18px 40px rgba(0,0,0,.9);
  transition:all .3s cubic-bezier(.2,.9,.3,1.4);overflow:visible;white-space:nowrap}
.btn-play::before,.btn-play::after{content:"";position:absolute;left:-18px;right:-18px;height:10px;
  border:1px solid rgba(255,200,120,.7);border-radius:5px;pointer-events:none}
.btn-play::before{top:-11px;background:linear-gradient(90deg,transparent,rgba(255,200,120,.6),transparent)}
.btn-play::after{bottom:-11px;background:linear-gradient(90deg,transparent,rgba(255,200,120,.6),transparent)}
.btn-play:hover{transform:translateX(-50%) translateY(-3px) scale(1.03)}
.btn-play:active{transform:translateX(-50%) scale(.97)}
.btn-play .glow{position:absolute;inset:-40px;border-radius:8px;
  background:radial-gradient(ellipse at center,rgba(255,180,80,.55),transparent 70%);
  pointer-events:none;animation:pulseGlow 2.2s ease-in-out infinite;z-index:-1}
@keyframes pulseGlow{0%,100%{opacity:.55}50%{opacity:1}}

/* ================= GAME UI ================= */
#game{position:absolute;inset:0;z-index:5;display:none}
#game.active{display:block}

#topbar{position:absolute;top:calc(10px + var(--sa-top));left:50%;transform:translateX(-50%);
  display:flex;gap:12px;align-items:center;padding:7px 18px;
  background:linear-gradient(90deg,rgba(20,10,30,.75),rgba(40,20,60,.85),rgba(20,10,30,.75));
  border:1px solid rgba(180,140,80,.5);border-radius:999px;
  font-size:10.5px;letter-spacing:.15em;color:#d8c7a0;text-transform:uppercase;
  z-index:12;white-space:nowrap;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#topbar .val{color:#ffe7b0;font-weight:700;margin-left:5px}
#topbar .sep{color:rgba(180,140,80,.4)}

/* Liquid orbs */
.orbs{position:absolute;top:calc(56px + var(--sa-top));left:calc(16px + var(--sa-left));
  display:flex;gap:12px;z-index:12}
.orb{position:relative;width:82px;height:82px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.4),transparent 45%),
  radial-gradient(circle at 50% 55%,rgba(0,0,0,.55),rgba(0,0,0,.95));
  border:2px solid rgba(255,200,120,.55);
  box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 30px rgba(255,140,40,.5);overflow:hidden}
.orb::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--pct,100%);
  background:linear-gradient(180deg,rgba(255,220,120,.95),rgba(220,80,40,.85));
  transition:height .5s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 0 30px rgba(255,160,80,.9),inset 0 6px 20px rgba(255,220,150,.6)}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 50%);
  pointer-events:none}
.orb.mana::before{background:linear-gradient(180deg,rgba(140,200,255,.95),rgba(50,90,220,.85));
  box-shadow:0 0 30px rgba(120,180,255,.9)}
.orb .orb-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Cinzel",Georgia,serif;font-size:12px;font-weight:700;color:#fff4dd;
  text-shadow:0 0 8px #000,0 0 16px rgba(255,200,120,.9);z-index:2}
.orb.mana{border-color:rgba(140,200,255,.6)}

/* Minimap */
#minimapWrap{position:absolute;top:calc(56px + var(--sa-top));right:calc(16px + var(--sa-right));
  z-index:12;width:124px;height:124px;border-radius:50%;
  background:radial-gradient(circle at center,rgba(10,15,35,.9),rgba(5,8,20,.95));
  border:1px solid rgba(120,200,255,.5);overflow:hidden;
  box-shadow:0 0 25px rgba(60,140,255,.5),inset 0 0 30px rgba(60,140,255,.2)}
#minimap{width:100%;height:100%}

/* VIRTUAL JOYSTICK */
#joystick{position:absolute;width:180px;height:180px;z-index:15;pointer-events:none;
  opacity:0;transition:opacity .18s ease;transform:translate(-50%,-50%)}
#joystick.active{opacity:1}
.joy-base{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at center,rgba(20,40,80,.25),rgba(10,20,40,.5));
  border:2px solid rgba(140,200,255,.5);
  box-shadow:0 0 30px rgba(80,160,255,.5),inset 0 0 40px rgba(60,120,240,.3)}
.joy-base::before{content:"";position:absolute;inset:18px;border-radius:50%;
  border:1px dashed rgba(140,200,255,.35)}
.joy-base::after{content:"";position:absolute;inset:36px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,200,255,.08),transparent 70%)}
.joy-knob{position:absolute;width:70px;height:70px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,rgba(220,240,255,.98),rgba(120,180,255,.85));
  box-shadow:0 0 25px rgba(140,200,255,.9),inset 0 -8px 16px rgba(60,120,240,.5),
  0 4px 12px rgba(0,0,0,.6)}
.joy-knob::after{content:"";position:absolute;inset:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,rgba(180,220,255,.6));
  box-shadow:inset 0 0 12px rgba(60,120,240,.6)}

/* Action buttons panel */
#actionBtns{position:absolute;bottom:calc(24px + var(--sa-bottom));right:calc(24px + var(--sa-right));
  width:230px;height:230px;z-index:12;pointer-events:none}
.action-btn{position:absolute;pointer-events:auto;display:flex;align-items:center;
  justify-content:center;border-radius:50%;user-select:none;
  font-family:"Cinzel",Georgia,serif;font-weight:700;text-transform:uppercase;
  transition:transform .1s ease-out,box-shadow .2s;touch-action:none;
  color:#eaf4ff;text-shadow:0 0 10px rgba(150,220,255,.9)}
.action-btn::before{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(255,200,120,.25);pointer-events:none}
.action-btn:active{transform:scale(.9)}

/* Main attack - big center */
.action-attack{width:140px;height:140px;right:20px;bottom:20px;font-size:15px;letter-spacing:.15em;
  background:radial-gradient(circle at 32% 28%,rgba(255,220,150,.5),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(180,90,30,.85),rgba(40,15,5,.95));
  border:3px solid rgba(255,220,150,.95);
  box-shadow:0 0 40px rgba(255,180,80,.7),inset 0 0 30px rgba(255,200,120,.35),0 8px 20px rgba(0,0,0,.85);
  overflow:hidden}
.action-attack::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,220,150,.9) 0deg,transparent var(--cd,360deg));
  mix-blend-mode:overlay;pointer-events:none;
  transition:background .15s}

/* Ability buttons around */
.action-cast{width:74px;height:74px;right:158px;bottom:78px;font-size:11px;
  background:radial-gradient(circle at 32% 28%,rgba(200,160,255,.55),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(90,40,160,.9),rgba(30,10,60,.95));
  border:2px solid rgba(200,160,255,.85);
  box-shadow:0 0 24px rgba(180,120,255,.6),inset 0 0 20px rgba(180,120,255,.25)}
.action-ult{width:78px;height:78px;right:90px;bottom:158px;font-size:11px;
  background:radial-gradient(circle at 32% 28%,rgba(255,160,220,.55),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(160,40,180,.9),rgba(50,5,50,.95));
  border:2px solid rgba(255,160,220,.85);
  box-shadow:0 0 26px rgba(220,80,255,.7),inset 0 0 24px rgba(255,140,220,.3)}
.action-dash{width:64px;height:64px;right:24px;bottom:172px;font-size:10px;
  background:radial-gradient(circle at 32% 28%,rgba(150,220,255,.5),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(30,80,160,.9),rgba(5,15,40,.95));
  border:2px solid rgba(150,220,255,.85);
  box-shadow:0 0 20px rgba(120,200,255,.6),inset 0 0 18px rgba(120,200,255,.25)}
.action-heal{width:62px;height:62px;right:158px;bottom:8px;font-size:10px;
  background:radial-gradient(circle at 32% 28%,rgba(140,255,180,.5),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(20,120,50,.9),rgba(5,30,10,.95));
  border:2px solid rgba(140,255,180,.85);
  box-shadow:0 0 20px rgba(100,255,150,.6),inset 0 0 18px rgba(100,255,150,.25)}

/* Toasts */
#toasts{position:absolute;bottom:calc(170px + var(--sa-bottom));left:50%;transform:translateX(-50%);
  z-index:12;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:6px 16px;border-radius:4px;
  background:linear-gradient(135deg,rgba(40,20,60,.9),rgba(15,8,25,.95));
  border:1px solid rgba(255,200,120,.7);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:#ffe7b0;
  animation:toastIn .4s cubic-bezier(.2,.9,.3,1.4);white-space:nowrap}
.toast.magic{border-color:rgba(184,90,255,.8);color:#e0c8ff}
.toast.good{border-color:rgba(140,255,180,.8);color:#c8ffd8}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}

#dmgFlash{position:absolute;inset:0;pointer-events:none;z-index:14;
  background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(255,30,60,.7));
  opacity:0;transition:opacity .15s}
#dmgFlash.hit{opacity:1}

#hint{position:absolute;bottom:calc(6px + var(--sa-bottom));left:50%;transform:translateX(-50%);
  font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(220,200,170,.4);z-index:11;pointer-events:none;text-align:center;
  max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#rotate-lock{position:fixed;inset:0;display:none;z-index:9999;align-items:center;
  justify-content:center;background:#05030a;color:#ffd897;font-family:"Cinzel",Georgia,serif;
  letter-spacing:.35em;text-transform:uppercase;text-align:center;padding:40px;font-size:14px}
@media (orientation:portrait){#rotate-lock{display:flex}}
@media (orientation:portrait){#app{display:none !important}}

@media (max-height:420px){
  .orb{width:62px;height:62px}
  #minimapWrap{width:100px;height:100px}
  .action-attack{width:112px;height:112px;font-size:12px}
  .action-cast{width:62px;height:62px;right:128px;bottom:64px;font-size:9px}
  .action-ult{width:66px;height:66px;right:76px;bottom:128px;font-size:9px}
  .action-dash{width:54px;height:54px;right:20px;bottom:140px;font-size:9px}
  .action-heal{width:52px;height:52px;right:128px;bottom:6px;font-size:9px}
  #joystick{width:150px;height:150px}
  .joy-knob{width:58px;height:58px}
}
</style>
</head>
<body>
<div id="rotate-lock">Поверните устройство<br>горизонтально</div>

<div id="app">
  <canvas id="menuCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
  <canvas id="gameCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none"></canvas>
  <div class="vignette" id="vigMenu"></div>
  <div class="vignette" id="vigGame" style="display:none"></div>

  <!-- ==================== MENU ==================== -->
  <div id="menu" style="display:none">
    <div id="logo">
      <h1>APEX</h1>
      <div class="sub">Rifters of <span>Aethelgard</span></div>
    </div>

    <div class="race-panel">
      <h2>Выбор Расы</h2>
      <div class="race-list" id="raceList"></div>
    </div>

    <div class="stats-panel">
      <h3>Характеристики</h3>
      <div class="stat-row"><span class="lbl">Сила</span><span class="val" id="statStr">8</span></div>
      <div class="stat-bar"><i id="barStr"></i></div>
      <div class="stat-row"><span class="lbl">Ловкость</span><span class="val" id="statAgi">9</span></div>
      <div class="stat-bar"><i id="barAgi"></i></div>
      <div class="stat-row"><span class="lbl">Интеллект</span><span class="val" id="statInt">7</span></div>
      <div class="stat-bar"><i id="barInt"></i></div>
      <div class="stat-row"><span class="lbl">Эфир</span><span class="val" id="statEth">5</span></div>
      <div class="stat-bar"><i id="barEth"></i></div>
    </div>

    <button class="btn-play" id="btnPlay">
      <span class="glow"></span>
      <span id="btnPlayLabel">ВОЙТИ В МИР</span>
    </button>
  </div>

  <!-- ==================== GAME ==================== -->
  <div id="game">
    <div id="topbar">
      <span>УР.<span class="val" id="uiLevel">1</span></span>
      <span class="sep">•</span>

<script type="module">
// ============================================================================
// APEX — Photorealistic AA graphics via procedural generation
// ============================================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------------------------------------------------------------------------
// UTIL
// ---------------------------------------------------------------------------
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const TAU = Math.PI*2;
const dist = (ax,az,bx,bz) => Math.hypot(bx-ax,bz-az);
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------------------
// PROCEDURAL TEXTURE FORGE — canvas-based PBR textures
// ---------------------------------------------------------------------------
const TEX = new Map();
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}
function texFromCanvas(c, repeat=1) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

// Bark texture — vertical cracks + organic noise
function barkTexture() {
  if (TEX.has('bark')) return TEX.get('bark');
  const size = 512;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y*size+x)*4;
      const nx = x/size, ny = y/size;
      // Vertical stretching noise
      const n1 = Math.sin(nx*40 + Math.sin(ny*8)*2)*0.5+0.5;
      const n2 = Math.sin(nx*18 + ny*3)*0.5+0.5;
      const n3 = Math.sin(ny*60 + Math.sin(nx*15)*3)*0.5+0.5;
      const crack = Math.pow(Math.abs(Math.sin(nx*22 + Math.sin(ny*5)*4)), 0.7);
      const v = clamp(n1*0.3 + n2*0.3 + n3*0.2 + (1-crack)*0.2, 0, 1);
      const r = Math.floor(70 + v*90);
      const g = Math.floor(48 + v*62);
      const b = Math.floor(30 + v*40);
      img.data[i+0] = r;
      img.data[i+1] = g;
      img.data[i+2] = b;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = texFromCanvas(c, 3);
  TEX.set('bark', t);
  return t;
}

// Leaf sprite — green foliage alpha test
function leafTexture() {
  if (TEX.has('leaf')) return TEX.get('leaf');
  const size = 128;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  // Draw multiple overlapping leaf shapes
  for (let k = 0; k < 14; k++) {
    const cx = 64 + rand(-30, 30);
    const cy = 64 + rand(-30, 30);
    const r = rand(12, 26);
    const ang = rand(0, TAU);
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    const shade = 60 + rand(0, 80);
    grad.addColorStop(0, `rgba(${60+shade*0.4},${100+shade},${40+shade*0.3},1)`);
    grad.addColorStop(0.6, `rgba(${30+shade*0.3},${70+shade*0.8},${25+shade*0.2},1)`);
    grad.addColorStop(1, 'rgba(15,40,15,0)');
    ctx.fillStyle = grad;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.55, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  TEX.set('leaf', t);
  return t;
}

// Ground texture with grass patches
function groundTexture() {
  if (TEX.has('ground')) return TEX.get('ground');
  const size = 512;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y*size+x)*4;
      const nx = x/size*8, ny = y/size*8;
      const n1 = Math.sin(nx*3.7)*Math.cos(ny*2.3)*0.5+0.5;
      const n2 = Math.sin(nx*11.3+ny*7.1)*0.5+0.5;
      const n3 = Math.random()*0.15;
      const v = clamp(n1*0.4 + n2*0.35 + n3, 0, 1);
      // Earthy green-brown gradient
      const r = Math.floor(72 + v*58);
      const g = Math.floor(78 + v*52);
      const b = Math.floor(45 + v*35);
      img.data[i+0] = r;
      img.data[i+1] = g;
      img.data[i+2] = b;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = texFromCanvas(c, 40);
  TEX.set('ground', t);
  return t;
}

// Rock texture
function rockTexture() {
  if (TEX.has('rock')) return TEX.get('rock');
  const size = 256;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y*size+x)*4;
      const nx = x/size*12, ny = y/size*12;
      const n1 = Math.sin(nx*2.1)*Math.cos(ny*1.7);
      const n2 = Math.sin(nx*5.3+ny*3.1)*0.6;
      const n3 = Math.sin(nx*13+ny*9)*0.3;
      const v = (n1+n2+n3)*0.33+0.5;
      const g = Math.floor(70 + v*70);
      const moss = Math.max(0, n1)*0.4;
      img.data[i+0] = Math.floor(g*0.9 + moss*30);
      img.data[i+1] = Math.floor(g + moss*50);
      img.data[i+2] = Math.floor(g*0.85);
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = texFromCanvas(c, 2);
  TEX.set('rock', t);
  return t;
}

// Skin texture — subtle color variation
function skinTexture(baseR, baseG, baseB) {
  const key = `skin_${baseR}_${baseG}_${baseB}`;
  if (TEX.has(key)) return TEX.get(key);
  const size = 256;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y*size+x)*4;
      const nx = x/size*10, ny = y/size*10;
      const n = Math.sin(nx*3)*Math.cos(ny*4)*0.5+0.5;
      const n2 = Math.sin(nx*11+ny*7)*0.5+0.5;
      const v = 1 + (n*0.6 + n2*0.4 - 0.5)*0.15;
      img.data[i+0] = clamp(baseR*v, 0, 255);
      img.data[i+1] = clamp(baseG*v, 0, 255);
      img.data[i+2] = clamp(baseB*v, 0, 255);
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = texFromCanvas(c, 2);
  TEX.set(key, t);
  return t;
}

// Normal map from height function
function normalMapFromFn(size, fn, strength=1.0) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const H = new Float32Array(size*size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      H[y*size+x] = fn(x/size, y/size);
    }
  }
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y*size+x;
      const xl = H[y*size+((x-1+size)%size)];
      const xr = H[y*size+((x+1)%size)];
      const yu = H[((y-1+size)%size)*size+x];
      const yd = H[((y+1)%size)*size+x];
      const dx = (xl-xr)*strength;
      const dy = (yu-yd)*strength;
      const dz = 1;
      const len = Math.hypot(dx, dy, dz);
      img.data[i*4+0] = ((dx/len)*0.5+0.5)*255;
      img.data[i*4+1] = ((dy/len)*0.5+0.5)*255;
      img.data[i*4+2] = ((dz/len)*0.5+0.5)*255;
      img.data[i*4+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ---------------------------------------------------------------------------
// DETAILED HUMANOID BUILDER — full skeleton with anatomy
// ---------------------------------------------------------------------------
class Humanoid {
  static build(race, opts = {}) {
    const g = new THREE.Group();
    g.userData.race = race;

    const skinTex = skinTexture(race.skin[0], race.skin[1], race.skin[2]);
    const skinMat = new THREE.MeshStandardMaterial({
      map: skinTex, roughness: 0.65, metalness: 0.05,
      color: 0xffffff,
    });
    const clothMat = new THREE.MeshStandardMaterial({
      color: race.cloth, roughness: 0.85, metalness: 0.05,
    });
    const capeMat = new THREE.MeshStandardMaterial({
      color: race.cape, roughness: 0.9, metalness: 0.0,
      side: THREE.DoubleSide,
    });
    const metalMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(race.metal[0]/255, race.metal[1]/255, race.metal[2]/255),
      roughness: 0.32, metalness: 0.9,
      normalMap: normalMapFromFn(64, (u,v) => Math.sin(u*30)*Math.cos(v*30)*0.4+0.5, 1.2),
      normalScale: new THREE.Vector2(0.4, 0.4),
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: race.color, roughness: 0.25, metalness: 0.9,
      emissive: new THREE.Color(race.color).multiplyScalar(0.5),
      emissiveIntensity: 1.3,
    });
    const hairMat = new THREE.MeshStandardMaterial({
      color: race.hair, roughness: 0.9, metalness: 0.0,
    });
    const eyeWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.15, metalness: 0.0,
    });
    const irisMat = new THREE.MeshStandardMaterial({
      color: race.accent, emissive: race.accent, emissiveIntensity: 2.0,
      roughness: 0.15, metalness: 0.1,
    });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

    // --- Torso (organic shape) ---
    const torsoShape = new THREE.LatheGeometry(
      (() => {
        const pts = [];
        // Body profile from hips to shoulders
        for (let i = 0; i <= 12; i++) {
          const t = i/12;
          const r = 0.22 + Math.sin(t*Math.PI*0.9)*0.16 - t*t*0.04;
          pts.push(new THREE.Vector2(r, t*0.9));
        }
        return pts;
      })(),
      16
    );
    const torso = new THREE.Mesh(torsoShape, clothMat);
    torso.position.y = 0.7;
    torso.castShadow = true;
    torso.receiveShadow = true;
    g.add(torso);

    // Chest armor
    const chestGeo = new THREE.BoxGeometry(0.52, 0.42, 0.34, 2, 2, 2);
    // Bevel corners
    const cpos = chestGeo.attributes.position;
    for (let i = 0; i < cpos.count; i++) {
      const x = cpos.getX(i), y = cpos.getY(i), z = cpos.getZ(i);
      cpos.setX(i, x * (1 - Math.abs(y)*0.15));
      cpos.setZ(i, z * (1 - Math.abs(y)*0.1));
    }
    chestGeo.computeVertexNormals();
    const chest = new THREE.Mesh(chestGeo, metalMat);
    chest.position.set(0, 1.38, 0.01);
    chest.castShadow = true;
    g.add(chest);

    // Belt
    const beltGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.08, 20);
    const belt = new THREE.Mesh(beltGeo, metalMat);
    belt.position.y = 0.88;
    belt.castShadow = true;
    g.add(belt);

    // Belt buckle
    const buckle = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.09, 0.03),
      accentMat
    );
    buckle.position.set(0, 0.88, 0.28);
    g.add(buckle);

    // --- Shoulder pauldrons (organic curve) ---
    for (const sx of [-1, 1]) {
      const pauldronGeo = new THREE.SphereGeometry(0.17, 14, 10, 0, TAU, 0, Math.PI * 0.65);
      const pauldron = new THREE.Mesh(pauldronGeo, metalMat);
      pauldron.position.set(sx * 0.33, 1.5, 0);
      pauldron.rotation.z = sx * -0.35;
      pauldron.scale.set(1.1, 1.0, 1.2);
      pauldron.castShadow = true;
      g.add(pauldron);
      // Rune inlay
      const rune = new THREE.Mesh(
        new THREE.TorusGeometry(0.08, 0.012, 6, 16),
        accentMat
      );
      rune.position.set(sx * 0.33, 1.55, 0.14);
      rune.rotation.x = Math.PI/2;
      rune.rotation.z = sx * -0.3;
      g.add(rune);
    }

    // --- Head (organic sculpted) ---
    const headGeo = new THREE.SphereGeometry(0.16, 24, 20);
    const hpos = headGeo.attributes.position;
    for (let i = 0; i < hpos.count; i++) {
      const x = hpos.getX(i), y = hpos.getY(i), z = hpos.getZ(i);
      // Elongate slightly and taper jaw
      let nx = x, ny = y, nz = z;
      if (y < 0) {
        nx *= 1 - (-y)*0.3;
        nz *= 1 - (-y)*0.2;
      }
      // Cheekbones
      if (y > -0.02 && y < 0.08 && Math.abs(x) > 0.08) {
        nx *= 1.05;
      }
      // Forehead
      if (y > 0.05 && z > 0) nz *= 1.03;
      hpos.setXYZ(i, nx, ny*1.15, nz*1.05);
    }
    headGeo.computeVertexNormals();
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.set(0, 1.72, 0);
    head.castShadow = true;
    g.add(head);

    // Neck
    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.07, 0.12, 12),

    );
    neck.position.set(0, 1.56, 0);
    g.add(neck);

    // --- Eyes (detailed with sclera, iris, pupil) ---
    for (const sx of [-1, 1]) {

      const sclera = new THREE.Mesh(

      hl.position.set(-0.007, 0.008, 0.029);
      eyeGroup.add(hl);

      eyeGroup.position.set(sx * 0.06, 1.73, 0.145);
      eyeGroup.rotation.y = sx * 0.1;

        new THREE.BoxGeometry(0.05, 0.008, 0.012),

      brow.position.set(sx * 0.065, 1.775, 0.145);
      brow.rotation.z = sx * -0.15;

    noseGeo.scale(0.9, 1.2, 1.5);

    nose.position.set(0, 1.71, 0.16);

    // --- Mouth ---

      new THREE.BoxGeometry(0.055, 0.008, 0.012),
      new THREE.MeshStandardMaterial({ color: 0x5a2a2a, roughness: 0.7 })
    );
    mouth.position.set(0, 1.665, 0.155);
    g.add(mouth);

    // --- Ears ---
    for (const sx of [-1, 1]) {
      let earGeo;
      if (race.id === 'ash_elf') {
        // Elongated pointed ear — multi-segment curve
        const pts = [];
        for (let i = 0; i <= 6; i++) {
          const t = i/6;
          pts.push(new THREE.Vector2(0.012 + t*0.006, t*0.09));
        }
        earGeo = new THREE.LatheGeometry(pts, 6);
      } else {
        earGeo = new THREE.SphereGeometry(0.028, 10, 8);
        earGeo.scale(0.5, 1.1, 0.9);
      }
      const ear = new THREE.Mesh(earGeo, skinMat);
      ear.position.set(sx * 0.155, 1.72, 0);
      if (race.id === 'ash_elf') {
        ear.rotation.z = sx * -0.35;
        ear.rotation.x = -0.15;
      } else {
        ear.rotation.z = sx * 0.2;
      }
      ear.castShadow = true;
      g.add(ear);
    }

    // --- Hair ---
    if (race.hairStyle === 'long') {
      const hairShellGeo = new THREE.SphereGeometry(0.175, 20, 14, 0, TAU, 0, Math.PI*0.65);
      const hairShell = new THREE.Mesh(hairShellGeo, hairMat);
      hairShell.position.y = 1.74;
      hairShell.scale.set(1.02, 1.02, 1.05);
      g.add(hairShell);
      // Hair strands falling
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*TAU;
        const strand = new THREE.Mesh(
          new THREE.BoxGeometry(0.02, rand(0.15, 0.28), 0.03),
          hairMat
        );
        strand.position.set(
          Math.sin(a)*0.14,
          1.65 - rand(0.0, 0.08),
          Math.cos(a)*0.14
        );
        strand.rotation.z = Math.sin(a)*0.3;
        strand.rotation.x = Math.cos(a)*0.3;
        g.add(strand);
      }
    } else if (race.hairStyle === 'mohawk') {
      for (let i = 0; i < 8; i++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.018, 0.10 - i*0.008, 5),
          hairMat
        );
        spike.position.set(0, 1.88 + (i-4)*0.001, -0.07 + i*0.02);
        spike.rotation.x = -0.15;

    // --- Arms (upper + forearm + hand) ---
    const armData = {};
    for (const sx of [-1, 1]) {
      const armGroup = new THREE.Group();
      armGroup.position.set(sx * 0.32, 1.42, 0);

      const upperArm = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.048, 0.20, 6, 10),
        skinMat
      );
      upperArm.position.y = -0.13;
      upperArm.castShadow = true;
      armGroup.add(upperArm);

      const forearm = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.042, 0.20, 6, 10),
        skinMat
      );
      forearm.position.y = -0.36;
      forearm.castShadow = true;
      armGroup.add(forearm);

      // Bracer
      const bracer = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.06, 0.14, 12),
        metalMat
      );
      bracer.position.y = -0.30;
      bracer.castShadow = true;
      armGroup.add(bracer);

      // Hand — palm + 4 fingers + thumb
      const handGroup = new THREE.Group();
      handGroup.position.set(0, -0.52, 0);
      const palm = new THREE.Mesh(
        new THREE.BoxGeometry(0.055, 0.06, 0.028),
        skinMat
      );
      handGroup.add(palm);
      for (let f = 0; f < 4; f++) {
        const finger = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.006, 0.035, 4, 6),
          skinMat
        );
        finger.position.set(-0.02 + f*0.013, -0.048, 0);
        handGroup.add(finger);
      }
      const thumb = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.008, 0.026, 4, 6),
        skinMat
      );
      thumb.position.set(sx * 0.028, -0.015, 0.005);
      thumb.rotation.z = sx * 0.6;
      handGroup.add(thumb);
      armGroup.add(handGroup);

      // Pauldron
      const pauldron2 = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 12, 8, 0, TAU, 0, Math.PI*0.6),
        metalMat
      );
      pauldron2.position.y = 0.02;
      pauldron2.rotation.z = sx * -0.3;
      armGroup.add(pauldron2);

      armGroup.userData = { sx, upperArm, forearm, handGroup };
      g.add(armGroup);
      armData[sx === -1 ? 'left' : 'right'] = armGroup;
    }

    // --- Legs (thigh + shin + foot) ---
    for (const sx of [-1, 1]) {
      const legGroup = new THREE.Group();
      legGroup.position.set(sx * 0.11, 0.72, 0);

      const thigh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.07, 0.24, 6, 10),
        clothMat
      );
      thigh.position.y = -0.15;
      thigh.castShadow = true;
      legGroup.add(thigh);

      const shin = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.058, 0.24, 6, 10),
        clothMat
      );
      shin.position.y = -0.42;
      shin.castShadow = true;
      legGroup.add(shin);

      // Boot — rounded, with sole
      const bootGeo = new THREE.BoxGeometry(0.12, 0.10, 0.18, 2, 2, 2);
      const bp = bootGeo.attributes.position;
      for (let i = 0; i < bp.count; i++) {
        const x = bp.getX(i), z = bp.getZ(i);
        if (z > 0.05) bp.setX(i, x*0.85);
      }
      bootGeo.computeVertexNormals();
      const boot = new THREE.Mesh(bootGeo, metalMat);
      boot.position.set(0, -0.60, 0.03);
      boot.castShadow = true;
      legGroup.add(boot);

      // Sole
      const sole = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.02, 0.18),
        new THREE.MeshStandardMaterial({ color: 0x1a0a05, roughness: 0.95 })
      );
      sole.position.set(0, -0.66, 0.03);
      legGroup.add(sole);

      legGroup.userData = { sx, thigh, shin, boot };
      g.add(legGroup);
    }

    // --- Cloth skirt / tunic flaps ---
    for (let i = 0; i < 8; i++) {
      const a = (i/8)*TAU;
      const flap = new THREE.Mesh(
        new THREE.PlaneGeometry(0.12, 0.24, 2, 4),
        capeMat
      );
      flap.position.set(Math.sin(a)*0.24, 0.72, Math.cos(a)*0.24);
      flap.rotation.y = a;
      flap.userData.basePos = flap.position.clone();
      flap.userData.phase = rand(0, TAU);
      g.add(flap);
    }

    // --- Cape (elf) ---
    if (race.id === 'ash_elf') {
      const capeGeo = new THREE.PlaneGeometry(0.55, 0.85, 6, 8);
      const cape = new THREE.Mesh(capeGeo, capeMat);
      cape.position.set(0, 1.05, -0.20);
      cape.userData.isCape = true;
      g.add(cape);
    }

    // --- Crystal wings (cyber monk) ---
    if (race.id === 'cyber_monk') {
      for (const sx of [-1, 1]) {
        const wingGroup = new THREE.Group();
        wingGroup.position.set(sx * 0.28, 1.55, -0.1);
        for (let i = 0; i < 5; i++) {
          const shard = new THREE.Mesh(
            new THREE.ConeGeometry(0.03, 0.35 + i*0.05, 4),
            new THREE.MeshStandardMaterial({
              color: race.accent, emissive: race.color,
              emissiveIntensity: 2.0, transparent: true, opacity: 0.75,
              roughness: 0.1, metalness: 0.3,
            })
          );
          shard.position.set(0, i*0.08, 0);
          shard.rotation.z = sx * (0.3 + i*0.15);
          shard.userData.isShard = true;
          wingGroup.add(shard);
        }
        wingGroup.userData.isWing = true;
        wingGroup.userData.side = sx;
        g.add(wingGroup);
      }
      // Halo
      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(0.20, 0.015, 8, 32),
        new THREE.MeshBasicMaterial({ color: race.accent, transparent: true, opacity: 0.85 })
      );
      halo.position.y = 2.0;
      halo.rotation.x = Math.PI / 2;
      halo.userData.isHalo = true;
      g.add(halo);
    }

    g.userData.armData = armData;
    g.userData.skinMat = skinMat;
    g.userData.metalMat = metalMat;
    g.userData.clothMat = clothMat;
    g.userData.baseY = 0;
    g.userData.animTime = 0;

    return g;
  }

  // Full-body idle animation
  static animateIdle(g, dt, opts = {}) {
    if (!g || !g.userData) return;
    g.userData.animTime += dt;
    const t = g.userData.animTime;
    const breath = Math.sin(t * 1.6) * 0.012;
    g.scale.y = (opts.baseScale || 1) * (1 + breath);

    g.traverse((o) => {
      if (o.userData.isCape) {
        const geo = o.geometry;
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);
          pos.setZ(i, Math.sin(t*2 + y*4) * 0.04 * (0.5 - y));
        }
        pos.needsUpdate = true;
      }
      if (o.userData.isWing) {
        const s = o.userData.side;
        o.rotation.z = s * (0.2 + Math.sin(t*1.5)*0.08);
      }
      if (o.userData.isShard) {
        o.material.emissiveIntensity = 1.5 + Math.sin(t*3 + o.position.y*5)*0.8;
      }
      if (o.userData.isHalo) {
        o.rotation.z = t * 1.2;
      }
      if (o.userData.basePos && o.rotation.y !== undefined) {
        // cloth flap sway
        o.position.y = o.userData.basePos.y + Math.sin(t*2 + o.userData.phase)*0.01;
      }
    });

    // Arms micro-sway
    if (g.userData.armData) {
      for (const key of ['left', 'right']) {
        const arm = g.userData.armData[key];
        if (arm) {
          arm.rotation.x = Math.sin(t*1.4 + (key === 'left' ? 0 : Math.PI)) * 0.05;
          arm.rotation.z = (key === 'left' ? 1 : -1) * (0.05 + Math.sin(t*1.2)*0.02);
        }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// PROCEDURAL TREE — realistic trunk with branches + clustered leaves
// ---------------------------------------------------------------------------
class TreeBuilder {
  static build(opts = {}) {
    const treeGroup = new THREE.Group();
    const scale = opts.scale || 1;

    const barkTex = barkTexture();
    const barkNormal = normalMapFromFn(128, (u,v) => Math.sin(u*22 + Math.sin(v*8)*3)*0.5+0.5, 1.8);
    const barkMat = new THREE.MeshStandardMaterial({
      map: barkTex, normalMap: barkNormal,
      normalScale: new THREE.Vector2(0.9, 0.9),
      roughness: 0.92, metalness: 0.02,
      color: 0x8a7050,
    });

    // --- Trunk (tapered with slight curvature) ---
    const trunkHeight = rand(2.5, 3.5) * scale;
    const segments = 20;
    const radialSegments = 10;

    const trunkGeo = new THREE.CylinderGeometry(
      0.10*scale, 0.24*scale, trunkHeight,
      radialSegments, segments, false
    );
    // Slight curvature + noise
    const tp = trunkGeo.attributes.position;
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i);
      const t = (y / trunkHeight) + 0.5;
      // Slight bend
      const bendX = Math.sin(t*2)*0.15*scale;
      const bendZ = Math.cos(t*1.7)*0.1*scale;
      // Bark noise
      const noise = Math.sin(t*40 + x*20)*0.006 + Math.cos(t*22 + z*18)*0.005;
      const radial = Math.hypot(x, z);
      if (radial > 0.001) {
        const nr = radial + noise;
        tp.setX(i, (x/radial)*nr + bendX);
        tp.setZ(i, (z/radial)*nr + bendZ);
      }
    }
    trunkGeo.computeVertexNormals();
    const trunk = new THREE.Mesh(trunkGeo, barkMat);
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    treeGroup.add(trunk);

    // --- Branches (recursive) ---
    const branchTips = [];
    const branchCount = randi(5, 8);
    for (let b = 0; b < branchCount; b++) {
      const a = (b / branchCount) * TAU + rand(-0.3, 0.3);
      const startY = trunkHeight * rand(0.35, 0.85);
      const length = rand(0.7, 1.4) * scale;
      const thickness = 0.035 * scale;

      const branchGeo = new THREE.CylinderGeometry(
        thickness * 0.4, thickness, length, 6, 4
      );
      const branch = new THREE.Mesh(branchGeo, barkMat);
      branch.position.set(0, startY, 0);
      branch.castShadow = true;
      // Orient branch
      branch.rotation.z = -Math.PI/3 - rand(0.1, 0.4);
      branch.rotation.y = a;
      // Translate outward
      branch.translateOnAxis(new THREE.Vector3(0, -1, 0), -length/2);
      treeGroup.add(branch);

      // Sub-branch
      const subLength = length * rand(0.5, 0.75);
      const subBranchGeo = new THREE.CylinderGeometry(
        thickness * 0.25, thickness * 0.5, subLength, 6, 3
      );
      const subBranch = new THREE.Mesh(subBranchGeo, barkMat);
      const endPos = new THREE.Vector3(0, startY, 0);
      endPos.x += Math.sin(a) * Math.sin(-branch.rotation.z) * length;
      endPos.y += Math.cos(-branch.rotation.z) * length * 0.5;
      endPos.z += Math.cos(a) * Math.sin(-branch.rotation.z) * length;
      subBranch.position.copy(endPos);
      subBranch.rotation.z = -Math.PI/4;
      subBranch.rotation.y = a + 0.3;
      subBranch.castShadow = true;
      treeGroup.add(subBranch);

      // Collect tip for leaves
      const tipPos = endPos.clone();
      tipPos.x += Math.sin(a + 0.3) * Math.sin(-subBranch.rotation.z) * subLength;
      tipPos.y += Math.cos(-subBranch.rotation.z) * subLength * 0.5;
      tipPos.z += Math.cos(a + 0.3) * Math.sin(-subBranch.rotation.z) * subLength;
      branchTips.push(tipPos);
    }

    // Top tip
    branchTips.push(new THREE.Vector3(0, trunkHeight * 1.05, 0));

    // --- Leaf clusters (InstancedMesh — thousands of quads) ---
    const leafTexture_ = leafTexture();
    const leafMat = new THREE.MeshStandardMaterial({
      map: leafTexture_,
      alphaTest: 0.45,
      transparent: false,
      side: THREE.DoubleSide,
      roughness: 0.85,
      metalness: 0.0,
      color: 0xffffff,
    });

    const leavesPerTree = 800;
    const leafGeo = new THREE.PlaneGeometry(0.18*scale, 0.18*scale);
    const leafInst = new THREE.InstancedMesh(leafGeo, leafMat, leavesPerTree);
    leafInst.castShadow = false;
    leafInst.receiveShadow = false;

    const dummy = new THREE.Object3D();
    const leafData = [];
    for (let i = 0; i < leavesPerTree; i++) {
      // Pick a random tip
      const tip = branchTips[randi(0, branchTips.length-1)];
      // Scatter around it
      const r = rand(0, 0.9) * scale;
      const theta = rand(0, TAU);
      const phi = rand(0, Math.PI);
      const ox = Math.sin(phi)*Math.cos(theta)*r;
      const oy = Math.cos(phi)*r*0.7;
      const oz = Math.sin(phi)*Math.sin(theta)*r;
      dummy.position.set(tip.x + ox, tip.y + oy + rand(0, 0.4)*scale, tip.z + oz);
      dummy.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
      const s = rand(0.7, 1.4);
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      leafInst.setMatrixAt(i, dummy.matrix);
      leafData.push({
        baseX: dummy.position.x, baseY: dummy.position.y, baseZ: dummy.position.z,
        phase: rand(0, TAU),
      });
    }
    leafInst.instanceMatrix.needsUpdate = true;
    treeGroup.add(leafInst);
    treeGroup.userData.leafInst = leafInst;
    treeGroup.userData.leafData = leafData;

    return treeGroup;
  }

  // Animate leaves swaying — update instance matrices periodically
  static animateWind(tree, time) {
    if (!tree.userData || !tree.userData.leafInst) return;
    const inst = tree.userData.leafInst;
    const data = tree.userData.leafData;
    const dummy = new THREE.Object3D();
    // Update every 4th leaf per frame for perf
    const phase = Math.floor(time * 60);
    for (let i = phase % 4; i < data.length; i += 4) {
      const d = data[i];
      const wind = Math.sin(time * 1.5 + d.phase) * 0.03 + Math.sin(time * 3.2 + d.phase*1.7) * 0.015;
      dummy.position.set(d.baseX + wind, d.baseY + Math.abs(wind)*0.3, d.baseZ + wind*0.5);
      dummy.rotation.set(0, d.phase, wind);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  }
}

// ---------------------------------------------------------------------------
// GRASS FIELD — InstancedMesh with wind + player push shader
// ---------------------------------------------------------------------------
class GrassField {
  static build(count, radius) {
    // Grass blade — tapered quad with 4 vertical segments
    const bladeGeo = new THREE.PlaneGeometry(0.08, 0.55, 1, 4);
    bladeGeo.translate(0, 0.275, 0);
    const bp = bladeGeo.attributes.position;
    for (let i = 0; i < bp.count; i++) {
      const y = bp.getY(i);
      const x = bp.getX(i);
      // Taper towards top
      const taper = 1 - y / 0.55 * 0.7;
      bp.setX(i, x * taper);
      // Slight bend
      bp.setZ(i, y * y * 0.15);
    }
    bladeGeo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: 0x6a9a3a,
      roughness: 0.85,
      metalness: 0.0,
      side: THREE.DoubleSide,
    });

    // Inject wind shader
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uPlayerPos = { value: new THREE.Vector3(0, 0, 0) };
      shader.uniforms.uPlayerRadius = { value: 1.2 };
      shader.vertexShader = `
        uniform float uTime;
        uniform vec3 uPlayerPos;
        uniform float uPlayerRadius;
        ${shader.vertexShader}
      `.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        vec4 worldPos = instanceMatrix * vec4(position, 1.0);
        float windPhase = uTime * 1.8 + worldPos.x * 0.4 + worldPos.z * 0.3;
        float windAmp = transformed.y * transformed.y * 0.6;
        transformed.x += sin(windPhase) * windAmp * 0.15;
        transformed.z += cos(windPhase * 0.9) * windAmp * 0.1;
        // Player push
        vec3 toPlayer = worldPos.xyz - uPlayerPos;
        float dToPlayer = length(toPlayer.xz);
        if (dToPlayer < uPlayerRadius) {
          float push = (1.0 - dToPlayer/uPlayerRadius);
          transformed.xz += normalize(toPlayer.xz + vec2(0.001)) * push * transformed.y * 1.2;
        }
        `
      );
      mat.userData.shader = shader;
    };

    const inst = new THREE.InstancedMesh(bladeGeo, mat, count);
    inst.castShadow = false;
    inst.receiveShadow = true;
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const r = rand(2, radius);
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      dummy.position.set(x, 0, z);
      dummy.rotation.y = rand(0, TAU);
      const s = rand(0.7, 1.6);
      dummy.scale.set(s, s * rand(0.9, 1.4), s);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
    return inst;
  }
}

function showToast(text, kind) {
  const wrap = $('toasts');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1800);
}

    const r = rand(0.5, 2.5);
    pos[i*3+0] = Math.cos(a)*r;
    pos[i*3+1] = rand(-0.2, 3.2);
    pos[i*3+2] = Math.sin(a)*r;
    const c = new THREE.Color().setHSL(rand(0.07, 0.13), 0.9, rand(0.6, 0.95));
    col[i*3+0] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const particles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.045, vertexColors: true, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false,
    map: (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32,32,0,32,32,32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,64,64);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })()
  }));
  scene.add(particles);
  App.menuParticles = particles;

  // Character
  rebuildMenuCharacter();

  // Post-processing
  try {
    const composer = new EffectComposer(App.menuRenderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.85, 0.6, 0.85
    );
    composer.addPass(bloom);
    App.menuBloom = bloom;
    const grade = new ShaderPass({
      uniforms: {
        tDiffuse:{value:null},
        uSat:{value:1.15}, uContrast:{value:1.1},
        uVig:{value:0.9},
        uFocus:{value:new THREE.Vector2(0.5, 0.4)},
        uBlur:{value:0.004},
      },
      vertexShader: 'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float uSat,uContrast,uVig,uBlur;
        uniform vec2 uFocus; varying vec2 vUv;
        void main(){
          vec2 d = vUv - uFocus; float dd = length(d);
          float b = smoothstep(0.2, 0.75, dd) * uBlur;
          vec4 c = vec4(0.0);
          const int N = 8;
          for (int i=0;i<N;i++){
            float a = float(i)*6.28318/float(N);
            c += texture2D(tDiffuse, vUv + vec2(cos(a),sin(a))*b);
          }
          c /= float(N);
          float l = dot(c.rgb, vec3(0.299,0.587,0.114));
          c.rgb = mix(vec3(l), c.rgb, uSat);
          c.rgb = (c.rgb - 0.5)*uContrast + 0.5;
          float v = smoothstep(0.9, 0.25, length(vUv-0.5));
          c.rgb *= mix(1.0-uVig, 1.0, v);
          gl_FragColor = c;
        }
      `,
    });
    composer.addPass(grade);
    App.menuComposer = composer;
    App.menuGrade = grade;
  } catch(e) {
    console.warn('Menu post-processing failed:', e);
  }

  App.menuClock = new THREE.Clock();
}

function rebuildMenuCharacter() {
  if (!App.menuScene) return;
  if (App.menuCharacter) {
    App.menuScene.remove(App.menuCharacter);
    App.menuCharacter.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
        else o.material.dispose();
      }
    });
  }
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const ch = Humanoid.build(race);
  ch.position.y = 0;
  ch.userData.baseScale = 1;
  App.menuScene.add(ch);
  App.menuCharacter = ch;
}

function startMenuLoop() {
  if (App.menuRafId !== null) return;
  const loop = () => {
    App.menuRafId = requestAnimationFrame(loop);
    try {
      if (!App.menuClock) return;
      const dt = Math.min(App.menuClock.getDelta(), 0.05);
      const t = App.menuClock.elapsedTime;

      if (App.menuCharacter) {
        Humanoid.animateIdle(App.menuCharacter, dt);
        App.menuCharacter.rotation.y = Math.sin(t*0.3) * 0.35;
      }
      for (const r of App.menuRings) {
        r.mesh.rotation.z += r.speed * dt;
      }
      if (App.menuParticles) {
        const p = App.menuParticles.geometry.attributes.position;
        for (let i = 0; i < p.count; i++) {
          p.setY(i, p.getY(i) + Math.sin(t*0.7 + i*0.3)*dt*0.35);
        }
        p.needsUpdate = true;
      }
      if (App.menuComposer) App.menuComposer.render();
      else if (App.menuRenderer) App.menuRenderer.render(App.menuScene, App.menuCamera);
    } catch(e) { console.error('[MenuLoop]', e); }
  };
  loop();
}
function stopMenuLoop() {
  if (App.menuRafId !== null) { cancelAnimationFrame(App.menuRafId); App.menuRafId = null; }
}
