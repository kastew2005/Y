<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<title>APEX — Rifters of Aethelgard</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sa-top:env(safe-area-inset-top,0px);
  --sa-bottom:env(safe-area-inset-bottom,0px);
  --sa-left:env(safe-area-inset-left,0px);
  --sa-right:env(safe-area-inset-right,0px);
}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05030a;
  color:#e8dfd0;font-family:-apple-system,BlinkMacSystemFont,"Cinzel","Segoe UI",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{display:block;outline:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden}

.vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.9) 100%)}

/* ================ LOADER ================ */
#loader{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#150820 0%,#05030a 70%);
  transition:opacity .6s ease;padding:24px}
#loader.hide{opacity:0;pointer-events:none}
.rune{width:92px;height:92px;margin-bottom:24px;border-radius:50%;
  border:2px solid transparent;border-top-color:#ffd897;border-bottom-color:rgba(180,80,255,.6);
  box-shadow:0 0 30px rgba(255,180,80,.5);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-family:"Cinzel",Georgia,serif;font-size:38px;letter-spacing:.4em;
  color:#ffe7b0;margin:0 0 22px;font-weight:900;text-shadow:0 0 20px rgba(255,180,80,.8)}
.loader-bar{width:min(420px,80vw);height:6px;border-radius:3px;background:rgba(255,255,255,.08);
  overflow:hidden;border:1px solid rgba(180,140,80,.35)}
.loader-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#a06b20,#fff1ce,#ff9c4a);
  box-shadow:0 0 18px #ffd897;transition:width .3s ease}
.loader-status{margin-top:14px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
  color:#d8c7a0;opacity:.85;text-align:center;font-family:"Cinzel",Georgia,serif;min-height:14px}
.loader-percent{margin-top:6px;font-family:"Cinzel",Georgia,serif;font-size:22px;
  font-weight:700;color:#ffe7b0;letter-spacing:.12em}
.loader-start{margin-top:24px;padding:15px 46px;font-family:"Cinzel",Georgia,serif;
  font-size:15px;letter-spacing:.35em;text-transform:uppercase;font-weight:700;color:#1a0d04;
  border-radius:4px;background:linear-gradient(180deg,#ffe4a0 0%,#e0a94e 45%,#a06b20 55%,#52330c 100%);
  box-shadow:0 0 40px rgba(255,180,80,.7),0 12px 30px rgba(0,0,0,.85);
  opacity:.35;pointer-events:none;transition:all .25s ease}
.loader-start.ready{opacity:1;pointer-events:auto}
.loader-start.ready:active{transform:scale(.97)}
.loader-error{margin-top:16px;padding:12px 18px;color:#ffb0b0;font-size:11px;
  background:rgba(80,20,20,.6);border:1px solid rgba(255,100,100,.6);border-radius:8px;
  max-width:80vw;text-align:center;display:none;line-height:1.5;word-break:break-word}

/* ================ MENU ================ */
#menu{position:absolute;inset:0;z-index:10;display:none}
#logo{position:absolute;top:calc(2% + var(--sa-top));left:50%;transform:translateX(-50%);
  text-align:center;z-index:12;pointer-events:none}
#logo h1{margin:0;font-family:"Cinzel",Georgia,serif;font-size:clamp(36px,6.5vw,82px);
  letter-spacing:.35em;font-weight:900;
  background:linear-gradient(180deg,#fff1ce 0%,#e8c88c 40%,#b8823a 70%,#6b4520 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,190,110,.7))}
#logo .sub{margin-top:2px;font-size:clamp(9px,1.1vw,12px);letter-spacing:.7em;
  color:#d8c7a0;opacity:.85;text-transform:uppercase;font-weight:600}
#logo .sub span{color:#ff9c4a;text-shadow:0 0 8px rgba(255,140,60,.9)}

.race-panel{position:absolute;top:calc(22% + var(--sa-top));left:calc(2.5% + var(--sa-left));
  width:clamp(210px,23vw,300px);padding:16px 14px;z-index:12;
  background:linear-gradient(135deg,rgba(30,20,50,.7),rgba(10,6,20,.9));
  border:1px solid rgba(180,140,80,.55);border-radius:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.8)}
.race-panel h2{margin:0 0 10px;font-family:"Cinzel",Georgia,serif;font-size:12px;
  letter-spacing:.28em;color:#ffd897;text-transform:uppercase;text-align:center}
.race-list{display:flex;flex-direction:column;gap:7px}
.race-card{position:relative;padding:9px 11px;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,rgba(50,35,80,.55),rgba(15,10,25,.75));
  border:1px solid rgba(140,110,70,.45);transition:all .25s ease}
.race-card.active{border-color:#ffc879;
  background:linear-gradient(135deg,rgba(90,60,30,.8),rgba(40,25,60,.95));
  box-shadow:0 0 22px rgba(255,180,80,.5);transform:translateX(6px)}
.rc-name{font-family:"Cinzel",Georgia,serif;font-size:11.5px;letter-spacing:.12em;
  color:#f0dcb4;margin-bottom:2px;text-transform:uppercase}
.race-card.active .rc-name{color:#ffe7b0}
.rc-desc{font-size:9px;line-height:1.3;color:rgba(220,200,180,.7)}
.rc-tag{display:inline-block;padding:2px 6px;margin-top:4px;font-size:7.5px;
  letter-spacing:.2em;border:1px solid rgba(255,180,80,.5);border-radius:4px;
  color:#ffbe72;text-transform:uppercase}

.stats-panel{position:absolute;top:calc(22% + var(--sa-top));right:calc(2.5% + var(--sa-right));
  width:clamp(190px,21vw,280px);padding:14px 12px;z-index:12;
  background:linear-gradient(135deg,rgba(25,15,45,.75),rgba(8,4,16,.9));
  border:1px solid rgba(180,140,80,.5);border-radius:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.8)}
.stats-panel h3{margin:0 0 8px;font-family:"Cinzel",Georgia,serif;font-size:11px;
  letter-spacing:.3em;color:#ffd897;text-align:center;text-transform:uppercase}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:10.5px}
.stat-row .lbl{color:rgba(220,200,180,.75);letter-spacing:.1em;text-transform:uppercase;font-size:8.5px}
.stat-row .val{color:#ffe7b0;font-weight:700;font-size:12px}
.stat-bar{height:3px;border-radius:2px;margin-top:2px;background:rgba(0,0,0,.55);overflow:hidden}
.stat-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff8040,#ffd070);
  transition:width .5s ease}

.btn-play{position:absolute;bottom:calc(4% + var(--sa-bottom));left:50%;transform:translateX(-50%);
  z-index:20;padding:20px 72px;font-family:"Cinzel",Georgia,serif;
  font-size:clamp(15px,1.7vw,20px);letter-spacing:.4em;text-transform:uppercase;font-weight:900;
  color:#1a0d04;border-radius:6px;
  background:linear-gradient(180deg,#fff0c4 0%,#ffd070 30%,#e0a94e 55%,#8a5a1c 100%);
  box-shadow:0 0 0 1px rgba(255,240,190,1) inset,0 0 0 4px rgba(60,30,10,.95) inset,
  0 0 60px rgba(255,200,120,.85),0 18px 40px rgba(0,0,0,.9);
  transition:all .3s ease;white-space:nowrap;overflow:visible}
.btn-play:active{transform:translateX(-50%) scale(.97)}

/* ================ GAME ================ */
#game{position:absolute;inset:0;z-index:5;display:none}
#game.active{display:block}

#topbar{position:absolute;top:calc(8px + var(--sa-top));left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;padding:6px 16px;
  background:linear-gradient(90deg,rgba(20,10,30,.8),rgba(40,20,60,.9),rgba(20,10,30,.8));
  border:1px solid rgba(180,140,80,.5);border-radius:999px;
  font-size:10px;letter-spacing:.12em;color:#d8c7a0;text-transform:uppercase;
  z-index:12;white-space:nowrap}
#topbar .val{color:#ffe7b0;font-weight:700;margin-left:4px}
#topbar .sep{color:rgba(180,140,80,.4)}

.orbs{position:absolute;top:calc(50px + var(--sa-top));left:calc(14px + var(--sa-left));
  display:flex;gap:10px;z-index:12}
.orb{position:relative;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.4),transparent 45%),
  radial-gradient(circle at 50% 55%,rgba(0,0,0,.6),rgba(0,0,0,.95));
  border:2px solid rgba(255,200,120,.55);overflow:hidden;
  box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 0 30px rgba(255,140,40,.4)}
.orb::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--pct,100%);
  background:linear-gradient(180deg,rgba(255,220,120,.95),rgba(220,80,40,.85));
  transition:height .5s ease;box-shadow:0 0 30px rgba(255,160,80,.9)}
.orb.mana::before{background:linear-gradient(180deg,rgba(140,200,255,.95),rgba(50,90,220,.85))}
.orb .orb-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Cinzel",Georgia,serif;font-size:11.5px;font-weight:700;color:#fff4dd;
  text-shadow:0 0 8px #000,0 0 16px rgba(255,200,120,.9);z-index:2}

#minimapWrap{position:absolute;top:calc(50px + var(--sa-top));right:calc(14px + var(--sa-right));
  z-index:12;width:114px;height:114px;border-radius:50%;
  background:radial-gradient(circle at center,rgba(10,15,35,.9),rgba(5,8,20,.95));
  border:1px solid rgba(120,200,255,.5);overflow:hidden}
#minimap{width:100%;height:100%}

/* VIRTUAL JOYSTICK */
#joystick{position:absolute;width:170px;height:170px;z-index:15;pointer-events:none;
  opacity:0;transition:opacity .18s ease;transform:translate(-50%,-50%)}
#joystick.active{opacity:1}
.joy-base{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(20,40,80,.3),rgba(10,20,40,.6));
  border:2px solid rgba(140,200,255,.55);
  box-shadow:0 0 30px rgba(80,160,255,.5),inset 0 0 40px rgba(60,120,240,.3)}
.joy-base::before{content:"";position:absolute;inset:16px;border-radius:50%;
  border:1px dashed rgba(140,200,255,.35)}
.joy-knob{position:absolute;width:66px;height:66px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,rgba(220,240,255,.98),rgba(120,180,255,.85));
  box-shadow:0 0 25px rgba(140,200,255,.9),inset 0 -8px 16px rgba(60,120,240,.5)}
.joy-knob::after{content:"";position:absolute;inset:16px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,rgba(180,220,255,.6))}

#actionBtns{position:absolute;bottom:calc(20px + var(--sa-bottom));right:calc(20px + var(--sa-right));
  width:220px;height:220px;z-index:12;pointer-events:none}
.action-btn{position:absolute;pointer-events:auto;display:flex;align-items:center;
  justify-content:center;border-radius:50%;user-select:none;
  font-family:"Cinzel",Georgia,serif;font-weight:700;text-transform:uppercase;
  transition:transform .1s ease-out;touch-action:none;color:#eaf4ff;
  text-shadow:0 0 10px rgba(150,220,255,.9)}
.action-btn:active{transform:scale(.9)}
.action-attack{width:130px;height:130px;right:18px;bottom:18px;font-size:14px;letter-spacing:.15em;
  background:radial-gradient(circle at 32% 28%,rgba(255,220,150,.5),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(180,90,30,.85),rgba(40,15,5,.95));
  border:3px solid rgba(255,220,150,.95);
  box-shadow:0 0 40px rgba(255,180,80,.7),inset 0 0 30px rgba(255,200,120,.35)}
.action-cast{width:70px;height:70px;right:150px;bottom:74px;font-size:20px;
  background:radial-gradient(circle at 32% 28%,rgba(200,160,255,.55),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(90,40,160,.9),rgba(30,10,60,.95));
  border:2px solid rgba(200,160,255,.85);
  box-shadow:0 0 24px rgba(180,120,255,.6)}
.action-ult{width:74px;height:74px;right:86px;bottom:150px;font-size:20px;
  background:radial-gradient(circle at 32% 28%,rgba(255,160,220,.55),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(160,40,180,.9),rgba(50,5,50,.95));
  border:2px solid rgba(255,160,220,.85);
  box-shadow:0 0 26px rgba(220,80,255,.7)}
.action-dash{width:60px;height:60px;right:22px;bottom:162px;font-size:20px;
  background:radial-gradient(circle at 32% 28%,rgba(150,220,255,.5),transparent 45%),
  radial-gradient(circle at 50% 60%,rgba(30,80,160,.9),rgba(5,15,40,.95));
  border:2px solid rgba(150,220,255,.85);
  box-shadow:0 0 20px rgba(120,200,255,.6)}

#toasts{position:absolute;bottom:calc(160px + var(--sa-bottom));left:50%;transform:translateX(-50%);
  z-index:12;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.toast{padding:6px 15px;border-radius:4px;
  background:linear-gradient(135deg,rgba(40,20,60,.9),rgba(15,8,25,.95));
  border:1px solid rgba(255,200,120,.7);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:#ffe7b0;animation:toastIn .4s ease;white-space:nowrap}
.toast.magic{border-color:rgba(184,90,255,.8);color:#e0c8ff}
.toast.good{border-color:rgba(140,255,180,.8);color:#c8ffd8}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

#dmgFlash{position:absolute;inset:0;pointer-events:none;z-index:14;
  background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(255,30,60,.7));
  opacity:0;transition:opacity .15s}
#dmgFlash.hit{opacity:1}

#hint{position:absolute;bottom:calc(4px + var(--sa-bottom));left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(220,200,170,.4);z-index:11;pointer-events:none;text-align:center;
  max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#rotate-lock{position:fixed;inset:0;display:none;z-index:9999;align-items:center;
  justify-content:center;background:#05030a;color:#ffd897;font-family:"Cinzel",Georgia,serif;
  letter-spacing:.35em;text-transform:uppercase;text-align:center;padding:40px;font-size:14px}
@media (orientation:portrait){#rotate-lock{display:flex}}
@media (orientation:portrait){#app{display:none !important}}
</style>
</head>
<body>
<div id="rotate-lock">Поверните устройство<br>горизонтально</div>

<div id="app">
  <canvas id="menuCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
  <canvas id="gameCanvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;display:none"></canvas>
  <div class="vignette"></div>

  <div id="menu" style="display:none">
    <div id="logo">
      <h1>APEX</h1>
      <div class="sub">Rifters of <span>Aethelgard</span></div>

      <h2>Выбор Расы</h2>

      <div class="stat-row"><span class="lbl">Ловкость</span><span class="val" id="statAgi">9</span></div>

      <div class="stat-row"><span class="lbl">Эфир</span><span class="val" id="statEth">5</span></div>

    <div id="joystick">
      <div class="joy-base"></div>

    <div id="actionBtns">
      <button class="action-btn action-attack" id="btnAttack">УДАР</button>
      <button class="action-btn action-cast" id="btnCast">🔥</button>
      <button class="action-btn action-ult" id="btnUlt">💀</button>
      <button class="action-btn action-dash" id="btnDash">⚡</button>

    <div id="toasts"></div>

  <div id="loader">
    <div class="rune"></div>
    <div class="loader-title">APEX</div>
    <div class="loader-bar"><div class="loader-bar-fill" id="loaderFill"></div></div>
    <div class="loader-percent" id="loaderPct">0%</div>
    <div class="loader-status" id="loaderStatus">Подготовка…</div>
    <button class="loader-start" id="loaderStart">ПРОДОЛЖИТЬ</button>
    <div class="loader-error" id="loaderError"></div>
  </div>
</div>

<script>
// ============================================================================
// HTML-LEVEL WATCHDOG (до загрузки модуля)
// ============================================================================
window.__apexReady = false;
window.__apexFailed = false;

// Если модуль не загрузился за 20 сек → показать ошибку
setTimeout(function() {
  if (!window.__apexReady && !window.__apexFailed) {
    window.__apexFailed = true;
    var errEl = document.getElementById('loaderError');
    if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = 'Модуль не загрузился. Проверьте интернет или перезагрузите страницу.';
    }
    var st = document.getElementById('loaderStatus');
    if (st) st.textContent = 'Ошибка загрузки';
  }
}, 20000);

window.addEventListener('error', function(e) {
  console.error('[Global]', e.error || e.message);
  if (!window.__apexReady) {
    window.__apexFailed = true;
    var errEl = document.getElementById('loaderError');
    if (errEl) {
      errEl.style.display = 'block';
      errEl.textContent = 'Ошибка: ' + (e.message || 'неизвестно');
    }
  }
});

window.addEventListener('unhandledrejection', function(e) {
  console.error('[Promise]', e.reason);
});
</script>

<script type="module">
// ============================================================================
// APEX — Bulletproof bootstrap
// ============================================================================
window.__apexBooting = true;

// ---------------------------------------------------------------------------
// UTILS
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const rand = (a,b) => a+Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const TAU = Math.PI*2;
const dist = (ax,az,bx,bz) => Math.hypot(bx-ax,bz-az);

const LOADER = {
  setPct(p) {
    const f = $('loaderFill'); if (f) f.style.width = clamp(p,0,100)+'%';
    const pe = $('loaderPct'); if (pe) pe.textContent = Math.round(clamp(p,0,100))+'%';
  },
  setText(t) { const s = $('loaderStatus'); if (s) s.textContent = t; },
  showError(t) {
    const e = $('loaderError');
    if (e) { e.style.display = 'block'; e.textContent = t; }
  },
  ready() { const b = $('loaderStart'); if (b) b.classList.add('ready'); },
  hide() { const el = $('loader'); if (el) el.classList.add('hide'); }
};

// ---------------------------------------------------------------------------
// RACES
// ---------------------------------------------------------------------------
const RACES = [
  { id:'ash_elf', name:'Пепельный Эльф',
    desc:'Дитя сожжённых лесов. Быстр, точен, повелевает пеплом.',
    tag:'Стрелок • Тень',
    stats:{str:6,agi:14,int:10,eth:8},
    color:0x4a9eff, accent:0x99ddff,
    skin:[210,175,145], cloth:0x2a3a55, metal:[150,160,175],
    hairColor:0xdcc8b0, hairStyle:'long' },
  { id:'iron_orc', name:'Железный Орк',
    desc:'Кузнец войны. Каждый удар — молот, каждое слово — приговор.',

// ---------------------------------------------------------------------------
// DYNAMIC IMPORTS with timeouts and fallbacks
// ---------------------------------------------------------------------------
let THREE = null;
let EffectComposer = null, RenderPass = null, UnrealBloomPass = null, ShaderPass = null;

async function loadThree() {
  LOADER.setPct(5);
  LOADER.setText('Загрузка Three.js…');
  try {
    const t = await Promise.race([
      import('https://unpkg.com/three@0.160.0/build/three.module.js'),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 15000))
    ]);
    THREE = t;
    if (!THREE.WebGLRenderer) throw new Error('Three.js loaded but incomplete');
    console.log('[Boot] Three.js OK, revision:', THREE.REVISION);
  } catch(e) {
    console.error('[Boot] Three.js load failed:', e);
    throw new Error('Не удалось загрузить Three.js. Проверьте интернет.');
  }

  LOADER.setPct(15);
  LOADER.setText('Загрузка постобработки…');

  // Try to load post-processing (optional!)
  try {
    const [ec, rp, ub, sp] = await Promise.race([
      Promise.all([
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js'),
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js'),
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js'),
        import('https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js'),
      ]),
      new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 12000))
    ]);
    EffectComposer = ec.EffectComposer;
    RenderPass = rp.RenderPass;
    UnrealBloomPass = ub.UnrealBloomPass;
    ShaderPass = sp.ShaderPass;
    console.log('[Boot] Post-processing addons OK');
  } catch(e) {
    console.warn('[Boot] Post-processing unavailable — using plain renderer:', e);
    EffectComposer = null;
    RenderPass = null;
    UnrealBloomPass = null;
    ShaderPass = null;
  }
}

// ---------------------------------------------------------------------------
// PROCEDURAL TEXTURES — small (128-192) for mobile
// ---------------------------------------------------------------------------
const TEXCACHE = new Map();

function makeCanvasTexture(w, h, drawFn, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (!ctx) return null;
  drawFn(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (opts.repeat) t.repeat.set(opts.repeat, opts.repeat);
  if (opts.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 2;
  return t;
}

function barkTexture() {
  if (TEXCACHE.has('bark')) return TEXCACHE.get('bark');
  const t = makeCanvasTexture(192, 192, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const nx = x/w, ny = y/h;
        const n1 = Math.sin(nx*32 + Math.sin(ny*6)*2);
        const n2 = Math.sin(nx*14 + ny*3);
        const crack = Math.pow(Math.abs(Math.sin(nx*18 + Math.sin(ny*4)*3)), 0.7);
        const v = clamp((n1*0.3 + n2*0.3)*0.5 + 0.5 + (1-crack)*0.15, 0, 1);
        img.data[i] = 70 + v*85;
        img.data[i+1] = 48 + v*58;
        img.data[i+2] = 30 + v*35;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: 3 });
  TEXCACHE.set('bark', t);
  return t;
}

function groundTexture() {
  if (TEXCACHE.has('ground')) return TEXCACHE.get('ground');
  const t = makeCanvasTexture(192, 192, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const nx = x/w*8, ny = y/h*8;
        const n1 = Math.sin(nx*3.7)*Math.cos(ny*2.3);
        const n2 = Math.sin(nx*11.3+ny*7.1);
        const v = clamp((n1*0.5+n2*0.5)*0.5+0.5, 0, 1);
        img.data[i] = 72 + v*58;
        img.data[i+1] = 78 + v*52;
        img.data[i+2] = 45 + v*35;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: 30 });
  TEXCACHE.set('ground', t);
  return t;
}

function rockTexture() {
  if (TEXCACHE.has('rock')) return TEXCACHE.get('rock');
  const t = makeCanvasTexture(128, 128, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        const nx = x/w*12, ny = y/h*12;
        const n1 = Math.sin(nx*2.1)*Math.cos(ny*1.7);
        const n2 = Math.sin(nx*5.3+ny*3.1)*0.6;
        const n3 = Math.sin(nx*13+ny*9)*0.3;
        const v = (n1+n2+n3)/2*0.5+0.5;
        const g = 70 + v*70;
        const moss = Math.max(0, n1)*0.3;
        img.data[i] = g*0.9 + moss*30;
        img.data[i+1] = g + moss*50;
        img.data[i+2] = g*0.85;
        img.data[i+3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }, { repeat: 2 });
  TEXCACHE.set('rock', t);
  return t;
}

function leafTexture() {
  if (TEXCACHE.has('leaf')) return TEXCACHE.get('leaf');
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 128, 128);
  for (let k = 0; k < 10; k++) {
    const cx = 64 + rand(-28, 28);
    const cy = 64 + rand(-28, 28);
    const r = rand(14, 26);
    const ang = rand(0, TAU);
    const shade = rand(60, 130);
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    grad.addColorStop(0, `rgba(${40+shade*0.4},${90+shade},${30+shade*0.3},1)`);
    grad.addColorStop(0.7, `rgba(${20+shade*0.3},${60+shade*0.8},${18+shade*0.2},1)`);
    grad.addColorStop(1, 'rgba(15,40,15,0)');
    ctx.fillStyle = grad;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.55, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 2;
  TEXCACHE.set('leaf', t);
  return t;
}

function glowTexture() {
  if (TEXCACHE.has('glow')) return TEXCACHE.get('glow');
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,240,200,0.6)');
  g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  TEXCACHE.set('glow', t);
  return t;
}

// DETAILED HUMANOID — organic shapes, no primitives-only
// ---------------------------------------------------------------------------
class Humanoid {
  static build(race) {
    const g = new THREE.Group();
    if (!race) race = RACES[0];

    const skinColor = new THREE.Color(race.skin[0]/255, race.skin[1]/255, race.skin[2]/255);
    const skinMat = new THREE.MeshStandardMaterial({
      color: skinColor, roughness: 0.65, metalness: 0.05,
    });
    const clothMat = new THREE.MeshStandardMaterial({
      color: race.cloth, roughness: 0.85, metalness: 0.05,
    });
    const metalMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(race.metal[0]/255, race.metal[1]/255, race.metal[2]/255),
      roughness: 0.32, metalness: 0.9,
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: race.color, roughness: 0.25, metalness: 0.9,
      emissive: new THREE.Color(race.color).multiplyScalar(0.4),
      emissiveIntensity: 1.2,
    });
    const hairMat = new THREE.MeshStandardMaterial({
      color: race.hairColor, roughness: 0.9,
    });
    const eyeMat = new THREE.MeshStandardMaterial({
      color: race.accent, emissive: race.accent, emissiveIntensity: 2.5,
      roughness: 0.15,
    });

    // === TORSO — lathe shape (organic profile) ===
    const torsoPts = [];
    for (let i = 0; i <= 12; i++) {
      const t = i/12;
      const r = 0.22 + Math.sin(t*Math.PI*0.9)*0.16 - t*t*0.04;
      torsoPts.push(new THREE.Vector2(Math.max(0.05, r), t*0.9));
    }
    const torso = new THREE.Mesh(new THREE.LatheGeometry(torsoPts, 14), clothMat);
    torso.position.y = 0.7;
    torso.castShadow = true;
    g.add(torso);

    // Chest armor (metal)
    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.4, 0.34), metalMat);
    chest.position.set(0, 1.36, 0.01);
    chest.castShadow = true;
    g.add(chest);

    // Belt
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.07, 14), metalMat);
    belt.position.y = 0.86;
    g.add(belt);
    const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.03), accentMat);
    buckle.position.set(0, 0.86, 0.27);
    g.add(buckle);

    // === SHOULDERS — half-spheres ===
    for (const sx of [-1, 1]) {
      const sh = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 12, 8, 0, TAU, 0, Math.PI*0.6),
        metalMat
      );
      sh.position.set(sx*0.31, 1.48, 0);
      sh.rotation.z = sx * -0.3;
      sh.scale.set(1.1, 1, 1.2);
      sh.castShadow = true;
      g.add(sh);
    }

    // === HEAD ===
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), skinMat);
    head.position.set(0, 1.72, 0);
    head.scale.set(1, 1.15, 1.05);
    head.castShadow = true;
    g.add(head);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 0.1, 10), skinMat);
    neck.position.y = 1.58;
    g.add(neck);

    // Eyes (sclera + iris + pupil + highlight)
    const scleraMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.2 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (const sx of [-1, 1]) {
      const eye = new THREE.Group();
      const sclera = new THREE.Mesh(new THREE.SphereGeometry(0.03, 10, 8), scleraMat);
      sclera.scale.set(1, 0.85, 0.7);
      eye.add(sclera);
      const iris = new THREE.Mesh(new THREE.CircleGeometry(0.019, 12), eyeMat);
      iris.position.z = 0.024;
      eye.add(iris);
      const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.008, 8), pupilMat);
      pupil.position.z = 0.026;
      eye.add(pupil);
      const hl = new THREE.Mesh(new THREE.CircleGeometry(0.0035, 6), highlightMat);
      hl.position.set(-0.006, 0.007, 0.027);
      eye.add(hl);
      eye.position.set(sx*0.058, 1.74, 0.142);
      eye.rotation.y = sx * 0.1;
      g.add(eye);
    }

    // Nose
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), skinMat);
    nose.position.set(0, 1.71, 0.155);
    nose.scale.set(0.9, 1.1, 1.4);
    g.add(nose);

    // Mouth
    const mouth = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.008, 0.012),
      new THREE.MeshStandardMaterial({ color: 0x5a2a2a, roughness: 0.7 })
    );
    mouth.position.set(0, 1.665, 0.148);
    g.add(mouth);

    // Ears — pointed for elf, round for others
    for (const sx of [-1, 1]) {
      let ear;
      if (race.id === 'ash_elf') {
        const pts = [];
        for (let i = 0; i <= 5; i++) {
          const t = i/5;
          pts.push(new THREE.Vector2(0.012 + t*0.005, t*0.08));
        }
        ear = new THREE.Mesh(new THREE.LatheGeometry(pts, 6), skinMat);
        ear.rotation.z = sx * -0.4;
        ear.rotation.x = -0.1;
      } else {
        ear = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 6), skinMat);
        ear.scale.set(0.5, 1.1, 0.9);
        ear.rotation.z = sx * 0.2;
      }
      ear.position.set(sx*0.15, 1.72, 0);
      g.add(ear);
    }

    // Hair
    if (race.hairStyle === 'long') {
      const hairShell = new THREE.Mesh(
        new THREE.SphereGeometry(0.175, 16, 12, 0, TAU, 0, Math.PI*0.65),
        hairMat
      );
      hairShell.position.y = 1.74;
      hairShell.scale.set(1.02, 1.02, 1.05);
      g.add(hairShell);
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*TAU;
        const strand = new THREE.Mesh(
          new THREE.BoxGeometry(0.02, rand(0.14, 0.24), 0.03),
          hairMat
        );
        strand.position.set(Math.sin(a)*0.13, 1.62, Math.cos(a)*0.13);
        strand.rotation.z = Math.sin(a)*0.3;
        strand.rotation.x = Math.cos(a)*0.3;
        g.add(strand);
      }
    } else if (race.hairStyle === 'mohawk') {
      for (let i = 0; i < 6; i++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.016, 0.09 - i*0.008, 5),
          hairMat
        );
        spike.position.set(0, 1.87 + (i-3)*0.001, -0.06 + i*0.024);
        spike.rotation.x = -0.15;
        g.add(spike);
      }
    }

    // === ARMS ===
    const armData = {};
    for (const sx of [-1, 1]) {
      const arm = new THREE.Group();
      arm.position.set(sx*0.31, 1.4, 0);
      const upperArm = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.046, 0.19, 4, 8),
        skinMat
      );
      upperArm.position.y = -0.12;
      upperArm.castShadow = true;
      arm.add(upperArm);
      const forearm = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.04, 0.19, 4, 8),
        skinMat
      );
      forearm.position.y = -0.34;
      forearm.castShadow = true;
      arm.add(forearm);
      // Bracer
      const bracer = new THREE.Mesh(
        new THREE.CylinderGeometry(0.052, 0.056, 0.13, 10),
        metalMat
      );
      bracer.position.y = -0.28;
      arm.add(bracer);
      // Hand — palm + 4 fingers
      const hand = new THREE.Group();
      hand.position.y = -0.48;
      const palm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.055, 0.026), skinMat);
      hand.add(palm);
      for (let f = 0; f < 4; f++) {
        const finger = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.0055, 0.032, 3, 5),
          skinMat
        );
        finger.position.set(-0.018 + f*0.012, -0.044, 0);
        hand.add(finger);
      }
      arm.add(hand);
      arm.userData = { sx, upperArm, forearm, hand };
      g.add(arm);
      armData[sx === -1 ? 'left' : 'right'] = arm;
    }

    // === LEGS ===
    for (const sx of [-1, 1]) {
      const leg = new THREE.Group();
      leg.position.set(sx*0.105, 0.72, 0);
      const thigh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.068, 0.22, 4, 8),
        clothMat
      );
      thigh.position.y = -0.14;
      thigh.castShadow = true;
      leg.add(thigh);
      const shin = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.056, 0.22, 4, 8),
        clothMat
      );
      shin.position.y = -0.4;
      shin.castShadow = true;
      leg.add(shin);
      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.1, 0.17), metalMat);
      boot.position.set(0, -0.58, 0.03);
      boot.castShadow = true;
      leg.add(boot);
      g.add(leg);
    }

    // === CAPE (elf) ===
    if (race.id === 'ash_elf') {
      const cape = new THREE.Mesh(
        new THREE.PlaneGeometry(0.5, 0.8, 4, 6),
        new THREE.MeshStandardMaterial({
          color: race.cloth, roughness: 0.9, side: THREE.DoubleSide,
        })
      );
      cape.position.set(0, 1.05, -0.19);
      cape.userData.isCape = true;
      g.add(cape);
    }

    // === CRYSTAL WINGS + HALO (cyber monk) ===
    if (race.id === 'cyber_monk') {
      for (const sx of [-1, 1]) {
        const wing = new THREE.Group();
        wing.position.set(sx*0.26, 1.55, -0.08);
        for (let i = 0; i < 4; i++) {
          const shard = new THREE.Mesh(
            new THREE.ConeGeometry(0.028, 0.3 + i*0.04, 4),
            new THREE.MeshStandardMaterial({
              color: race.accent, emissive: race.color,
              emissiveIntensity: 2.0, transparent: true, opacity: 0.75,
            })
          );
          shard.position.set(0, i*0.07, 0);
          shard.rotation.z = sx * (0.3 + i*0.15);
          shard.userData.isShard = true;
          wing.add(shard);
        }
        wing.userData = { isWing: true, side: sx };
        g.add(wing);
      }
      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(0.19, 0.014, 6, 24),
        new THREE.MeshBasicMaterial({ color: race.accent, transparent: true, opacity: 0.85 })
      );
      halo.position.y = 2.0;
      halo.rotation.x = Math.PI/2;
      halo.userData.isHalo = true;
      g.add(halo);
    }

    g.userData.armData = armData;
    g.userData.skinMat = skinMat;
    g.userData.clothMat = clothMat;
    g.userData.metalMat = metalMat;
    g.userData.animTime = 0;
    g.userData.baseScale = 1;
    return g;
  }

  static animateIdle(g, dt, opts = {}) {
    if (!g || !g.userData) return;
    g.userData.animTime = (g.userData.animTime || 0) + dt;
    const t = g.userData.animTime;
    const breath = Math.sin(t * 1.8) * 0.012;
    const bs = opts.baseScale || g.userData.baseScale || 1;
    g.scale.y = bs * (1 + breath);

    g.traverse((o) => {
      if (o.userData.isCape) {
        const pos = o.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);
          pos.setZ(i, Math.sin(t*2 + y*3) * 0.03);
        }
        pos.needsUpdate = true;
      }
      if (o.userData.isWing) {
        o.rotation.z = o.userData.side * (0.2 + Math.sin(t*1.5)*0.08);
      }
      if (o.userData.isShard) {
        o.material.emissiveIntensity = 1.5 + Math.sin(t*3 + o.position.y*5)*0.6;
      }
      if (o.userData.isHalo) o.rotation.z = t * 1.2;
    });

    if (g.userData.armData) {
      for (const key of ['left', 'right']) {
        const arm = g.userData.armData[key];
        if (arm) {
          arm.rotation.x = Math.sin(t*1.4 + (key === 'left' ? 0 : Math.PI)) * 0.05;
          arm.rotation.z = (key === 'left' ? 1 : -1) * 0.05;
        }
      }
    }
  }
}

// ---------------------------------------------------------------------------
// PROCEDURAL TREE — trunk + branches + instanced leaves
// ---------------------------------------------------------------------------
class TreeBuilder {
  static build(opts = {}) {
    const g = new THREE.Group();
    const scale = opts.scale || 1;

    const barkTex = barkTexture();
    const barkMat = new THREE.MeshStandardMaterial({
      map: barkTex, roughness: 0.92, metalness: 0.02,
      color: 0x8a7050,
    });

    // Trunk
    const trunkH = rand(2.5, 3.5) * scale;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1*scale, 0.24*scale, trunkH, 8, 8),
      barkMat
    );
    const tp = trunk.geometry.attributes.position;
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i), y = tp.getY(i), z = tp.getZ(i);
      const t = (y / trunkH) + 0.5;
      const bendX = Math.sin(t*2)*0.1*scale;
      const bendZ = Math.cos(t*1.7)*0.08*scale;
      const radial = Math.hypot(x, z);
      if (radial > 0.001) {
        const noise = Math.sin(t*30 + x*15)*0.008 + Math.cos(t*18 + z*12)*0.006;
        const nr = radial + noise;
        tp.setX(i, (x/radial)*nr + bendX);
        tp.setZ(i, (z/radial)*nr + bendZ);
      }
    }
    trunk.geometry.computeVertexNormals();
    trunk.position.y = trunkH/2;
    trunk.castShadow = true;
    trunk.receiveShadow = true;
    g.add(trunk);

    // Branches
    const tips = [];
    const branchCount = randi(4, 7);
    for (let b = 0; b < branchCount; b++) {
      const a = (b/branchCount)*TAU + rand(-0.3, 0.3);
      const startY = trunkH * rand(0.4, 0.85);
      const length = rand(0.7, 1.3) * scale;
      const branch = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02*scale, 0.05*scale, length, 5, 2),
        barkMat
      );
      branch.position.set(0, startY, 0);
      branch.rotation.z = -Math.PI/3;
      branch.rotation.y = a;
      branch.translateOnAxis(new THREE.Vector3(0, -1, 0), -length/2);
      branch.castShadow = true;
      g.add(branch);

      // Tip world position approx
      const tip = new THREE.Vector3(
        Math.sin(a) * Math.sin(Math.PI/3) * length + Math.cos(a) * 0.2,
        startY + Math.cos(Math.PI/3) * length * 0.5,
        Math.cos(a) * Math.sin(Math.PI/3) * length
      );
      tips.push(tip);
    }
    tips.push(new THREE.Vector3(0, trunkH * 1.05, 0));

    // Leaves — instanced
    const leafTex = leafTexture();
    const leafMat = new THREE.MeshStandardMaterial({
      map: leafTex, alphaTest: 0.4, side: THREE.DoubleSide,
      roughness: 0.85, color: 0xffffff,
    });
    const leafCount = 350;
    const leafGeo = new THREE.PlaneGeometry(0.18*scale, 0.18*scale);
    const leaves = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
    leaves.castShadow = false;

    const dummy = new THREE.Object3D();
    for (let i = 0; i < leafCount; i++) {
      const tip = tips[randi(0, tips.length-1)];
      const r = rand(0, 0.8) * scale;
      const theta = rand(0, TAU);
      const phi = rand(0, Math.PI);
      dummy.position.set(
        tip.x + Math.sin(phi)*Math.cos(theta)*r,
        tip.y + Math.cos(phi)*r*0.7,
        tip.z + Math.sin(phi)*Math.sin(theta)*r
      );
      dummy.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
      const s = rand(0.7, 1.3);
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      leaves.setMatrixAt(i, dummy.matrix);
    }
    leaves.instanceMatrix.needsUpdate = true;
    g.add(leaves);

    return g;
  }
}

// ---------------------------------------------------------------------------
// GRASS FIELD
// ---------------------------------------------------------------------------
function buildGrassField(count, radius) {
  const bladeGeo = new THREE.PlaneGeometry(0.08, 0.5, 1, 3);
  bladeGeo.translate(0, 0.25, 0);
  const bp = bladeGeo.attributes.position;
  for (let i = 0; i < bp.count; i++) {
    const y = bp.getY(i);
    const x = bp.getX(i);
    const taper = 1 - (y/0.5) * 0.65;
    bp.setX(i, x * taper);
    bp.setZ(i, y*y*0.12);
  }
  bladeGeo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x6a9a3a, roughness: 0.85, side: THREE.DoubleSide,
  });

  // Wind via onBeforeCompile
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uPlayerPos = { value: new THREE.Vector3(0, 0, 0) };
    shader.vertexShader = 'uniform float uTime;\nuniform vec3 uPlayerPos;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vec4 wp = instanceMatrix * vec4(position, 1.0);
       float wind = uTime * 1.8 + wp.x * 0.4 + wp.z * 0.3;
       float amp = transformed.y * transformed.y * 0.5;
       transformed.x += sin(wind) * amp * 0.15;
       transformed.z += cos(wind * 0.9) * amp * 0.1;
       vec3 toP = wp.xyz - uPlayerPos;
       float dP = length(toP.xz);
       if (dP < 1.5) {
         transformed.xz += normalize(toP.xz + vec2(0.001)) * (1.0 - dP/1.5) * transformed.y * 1.2;
       }`
    );
    mat.userData.shader = shader;
  };

  const inst = new THREE.InstancedMesh(bladeGeo, mat, count);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU);
    const r = rand(2, radius);
    dummy.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
    dummy.rotation.y = rand(0, TAU);
    const s = rand(0.7, 1.5);
    dummy.scale.set(s, s * rand(0.9, 1.3), s);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

  const wrap = $('toasts');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');

  rim.position.set(-3, 2.5, -2);

  const fill = new THREE.PointLight(0xffa060, 10, 8);
  fill.position.set(-2, 1.5, 2);
  scene.add(fill);

  // Pedestal
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(1.0, 1.15, 0.22, 24),
    new THREE.MeshStandardMaterial({ color: 0x2a1e38, roughness: 0.5, metalness: 0.6 })
  );
  ped.position.y = -0.11;
  ped.receiveShadow = true;
  scene.add(ped);

  // Runic rings
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xffc879, emissive: 0xff9c4a, emissiveIntensity: 1.6,
    roughness: 0.3, metalness: 0.9,
  });
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.03, 0.018, 6, 48), ringMat);
  ring1.rotation.x = Math.PI/2;
  ring1.position.y = 0.01;
  scene.add(ring1);
  App.menuRings.push({ mesh: ring1, speed: 0.5 });
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.13, 0.013, 6, 48), ringMat.clone());
  ring2.rotation.x = Math.PI/2;
  ring2.position.y = 0.02;
  scene.add(ring2);
  App.menuRings.push({ mesh: ring2, speed: -0.35 });

  // Light pool
  const pool = new THREE.Mesh(
    new THREE.CircleGeometry(2.0, 32),
    new THREE.MeshBasicMaterial({
      color: 0xff9c4a, transparent: true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  pool.rotation.x = -Math.PI/2;
  pool.position.y = -0.22;
  scene.add(pool);

  // Portal ring in background
  const portal = new THREE.Mesh(
    new THREE.RingGeometry(2.0, 5.0, 40),
    new THREE.MeshBasicMaterial({
      color: 0x8050ff, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
    })
  );
  portal.position.set(0, 1.8, -5);
  scene.add(portal);

  // Particles
  const partCount = 180;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(partCount*3);
  const col = new Float32Array(partCount*3);
  for (let i = 0; i < partCount; i++) {
    const a = rand(0, TAU);
    const r = rand(0.5, 2.3);
    pos[i*3+0] = Math.cos(a)*r;
    pos[i*3+1] = rand(-0.1, 3.0);
    pos[i*3+2] = Math.sin(a)*r;
    const c = new THREE.Color().setHSL(rand(0.07, 0.13), 0.9, rand(0.6, 0.95));
    col[i*3+0] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const particles = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.045, vertexColors: true, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false, map: glowTexture(),
  }));
  scene.add(particles);
  App.menuParticles = particles;

  // Character
  rebuildMenuCharacter();

  // OPTIONAL post-processing
  if (EffectComposer && RenderPass && UnrealBloomPass) {
    try {
      const composer = new EffectComposer(App.menuRenderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(
        new THREE.Vector2(w, h), 0.75, 0.6, 0.82
      ));
      // Test render before committing
      composer.render();
      App.menuComposer = composer;
      console.log('[Menu] Composer OK');
    } catch(e) {
      console.warn('[Menu] Composer failed, using plain renderer:', e);
      App.menuComposer = null;
    }
  }

  // Immediate test render with plain renderer (verify scene is not black)
  try {
    App.menuRenderer.render(scene, camera);
    console.log('[Menu] Test render OK, canvas size:', w, 'x', h);
  } catch(e) {
    console.error('[Menu] Test render failed:', e);
  }

  App.menuClock = new THREE.Clock();
}

function rebuildMenuCharacter() {
  if (!App.menuScene) return;
  if (App.menuCharacter) {
    App.menuScene.remove(App.menuCharacter);
    App.menuCharacter.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
  }
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const ch = Humanoid.build(race);
  ch.position.y = 0;
  App.menuScene.add(ch);
  App.menuCharacter = ch;
  console.log('[Menu] Character built:', race.name);
}

function startMenuLoop() {
  if (App.menuRafId !== null) return;
  const loop = () => {
    App.menuRafId = requestAnimationFrame(loop);
    try {
      if (!App.menuClock || !App.menuScene || !App.menuCamera) return;
      const dt = Math.min(App.menuClock.getDelta(), 0.05);
      const t = App.menuClock.elapsedTime;

      if (App.menuCharacter) {
        Humanoid.animateIdle(App.menuCharacter, dt);
        App.menuCharacter.rotation.y = Math.sin(t*0.3) * 0.35;
      }
      for (const r of App.menuRings) {
        r.mesh.rotation.z += r.speed * dt;
      }
      if (App.menuParticles) {
        const p = App.menuParticles.geometry.attributes.position;
        for (let i = 0; i < p.count; i++) {
          p.setY(i, p.getY(i) + Math.sin(t*0.7 + i*0.3)*dt*0.35);
        }
        p.needsUpdate = true;
      }

      // Try composer, fall back to plain render on any failure
      let rendered = false;
      if (App.menuComposer) {
        try {
          App.menuComposer.render();
          rendered = true;
        } catch(e) {
          console.warn('[Menu] Composer render failed, disabling:', e);
          App.menuComposer = null;
        }
      }
      if (!rendered) {
        App.menuRenderer.render(App.menuScene, App.menuCamera);
      }
    } catch(e) {
      console.error('[MenuLoop]', e);
    }
  };
  loop();
}

function stopMenuLoop() {
  if (App.menuRafId !== null) {
    cancelAnimationFrame(App.menuRafId);
    App.menuRafId = null;
  }
}

  App.gameScene = scene;

  const camera = new THREE.PerspectiveCamera(58, w/h, 0.1, 300);
  camera.position.set(0, 4.5, 7);
  App.gameCamera = camera;

  // Lights
  const key = new THREE.DirectionalLight(0xffe0b8, 2.6);
  key.position.set(15, 25, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -20;
  key.shadow.camera.right = 20;
  key.shadow.camera.top = 20;
  key.shadow.camera.bottom = -20;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 80;
  key.shadow.bias = -0.0006;
  scene.add(key);
  scene.add(key.target);
  App.gameKeyLight = key;

  scene.add(new THREE.HemisphereLight(0xa8c8ff, 0x3a2a1a, 0.6));
  scene.add(new THREE.AmbientLight(0x405080, 0.4));

  // Ground
  const groundTex = groundTexture();
  const groundGeo = new THREE.PlaneGeometry(200, 200, 60, 60);
  const gp = groundGeo.attributes.position;
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), y = gp.getY(i);
    const d = Math.hypot(x, y);
    const t = clamp((d - 6) / 24, 0, 1);
    const h = (Math.sin(x*0.12)*Math.cos(y*0.13)*1.4 + Math.sin(x*0.4+y*0.3)*0.5) * t * t * (3 - 2*t);
    gp.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({
    map: groundTex,
    roughness: 0.92, metalness: 0.05,
    color: 0x9a9070,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Trees
  App.trees = [];
  for (let i = 0; i < 30; i++) {
    const a = rand(0, TAU);
    const r = rand(10, 55);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 6) continue;
    const tree = TreeBuilder.build({ scale: rand(0.9, 1.5) });
    tree.position.set(x, 0, z);
    tree.rotation.y = rand(0, TAU);
    scene.add(tree);
    App.trees.push(tree);
  }

  // Grass
  try {
    App.grass = buildGrassField(1500, 50);
    scene.add(App.grass);
  } catch(e) {
    console.warn('[Game] Grass failed:', e);
    App.grass = null;
  }

  // Rocks — deformed
  const rockTex = rockTexture();
  const rockMat = new THREE.MeshStandardMaterial({
    map: rockTex, roughness: 0.92, metalness: 0.08, color: 0x8a8070,
  });
  for (let i = 0; i < 20; i++) {
    const a = rand(0, TAU);
    const r = rand(6, 50);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 2) continue;
    const geo = new THREE.IcosahedronGeometry(rand(0.4, 1.2), 1);
    const rp = geo.attributes.position;
    for (let j = 0; j < rp.count; j++) {
      const vx = rp.getX(j), vy = rp.getY(j), vz = rp.getZ(j);
      const n = Math.sin(vx*4)*Math.cos(vy*3.5)*0.2 + Math.sin(vz*5)*0.15;
      rp.setXYZ(j, vx*(1+n), vy*(1+n*0.6), vz*(1+n));
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, rockMat);
    mesh.position.set(x, rand(0.05, 0.35), z);
    mesh.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
  }

  // City
  buildCity(scene);
  // NPCs
  buildNPCs(scene);
  // Player
  buildPlayer(scene);
  // Enemies
  for (let i = 0; i < 4; i++) spawnEnemy(scene);
  // Rain
  buildRain(scene);

  // Post-processing (optional)
  if (EffectComposer && RenderPass && UnrealBloomPass) {
    try {
      const composer = new EffectComposer(App.gameRenderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), 0.7, 0.6, 0.85));
      composer.render();
      App.gameComposer = composer;
      console.log('[Game] Composer OK');
    } catch(e) {
      console.warn('[Game] Composer failed:', e);
      App.gameComposer = null;
    }
  }

  // Test render
  try {
    App.gameRenderer.render(scene, camera);
    console.log('[Game] Test render OK');
  } catch(e) {
    console.error('[Game] Test render failed:', e);
  }

  App.gameClock = new THREE.Clock();
  const mm = $('minimap');
  App.minimapCtx = mm ? mm.getContext('2d') : null;
}

function buildCity(scene) {

    new THREE.CircleGeometry(App.cityRadius, 32),

  // Wall
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a5040, roughness: 0.9 });

    if (i > 0 && i < 3) continue;
    const a = (i/20)*TAU;
    const wx = c.x + Math.cos(a)*App.cityRadius;
    const wz = c.z + Math.sin(a)*App.cityRadius;
    const wall = new THREE.Group();
    const block = new THREE.Mesh(new THREE.BoxGeometry(2.3, rand(3, 4), 1.0), wallMat);
    block.position.y = 1.7;
    block.castShadow = true;
    block.receiveShadow = true;
    wall.add(block);
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.3, 1.3), wallMat);

    wall.add(top);
    wall.position.set(wx, 0, wz);
    wall.rotation.y = -a;
    city.add(wall);

  const obelisk = new THREE.Mesh(
