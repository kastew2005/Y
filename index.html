});

/* ============================================================================
   15. ВЗАИМОДЕЙСТВИЕ / РЕСУРСЫ
   ========================================================================== */
const raycaster = new THREE.Raycaster();
raycaster.far = 5.0;
const screenCenter = new THREE.Vector2(0, 0);

let currentTarget = null;

function findTarget() {
  raycaster.setFromCamera(screenCenter, camera);
  const list = [];
  for (const h of harvestables) {
    if (h.destroyed) continue;
    list.push(h.object);
  }
  for (const w of wolves) {
    if (!w.dead) list.push(w.body, w.head);
  }
  if (campfire) list.push(campfire.group);

  const hits = raycaster.intersectObjects(list, false);
  if (hits.length === 0) return null;

  const hit = hits[0];
  // Найти владельца
  for (const h of harvestables) {
    if (h.object === hit.object) return { kind: h.type, ref: h, point: hit.point };
  }
  for (const w of wolves) {
    if (w.body === hit.object || w.head === hit.object) return { kind: 'wolf', ref: w, point: hit.point };
  }
  if (campfire && hit.object.parent === campfire.group) return { kind: 'fire', ref: campfire, point: hit.point };
  return null;
}

function getHitPointAhead(dist = 1.3) {
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  return new THREE.Vector3().copy(camera.position).addScaledVector(dir, dist);
}

/* --- Удар --- */
function performAttack() {
  // Запуск анимации замаха
  handState.swingActive = true;
  handState.swingT = 0;

  const target = findTarget();

  setTimeout(() => {
    if (!target) {
      // Промах — просто пыль/свист
      return;
    }
    const p = target.point;
    if (target.kind === 'tree') {
      target.ref.hp--;
      spawnWoodChips(p.x, p.y, p.z, 18);
      if (target.ref.hp <= 0) {
        // Срублено
        scene.remove(target.ref.root);
        target.ref.destroyed = true;
        inventory.wood += 6;
        addToast('+6 ДРЕВЕСИНЫ', 'good');
        updateInvUI();
        // Оставляем пень
      } else {
        inventory.wood += 1;
        updateInvUI();
      }
    } else if (target.kind === 'rock') {
      target.ref.hp--;
      spawnStoneChips(p.x, p.y, p.z, 18);
      if (target.ref.hp <= 0) {
        scene.remove(target.ref.object);
        target.ref.destroyed = true;
        inventory.stone += 4;
        addToast('+4 КАМНЯ', 'good');
      } else {
        inventory.stone += 1;
      }
      updateInvUI();
    } else if (target.kind === 'wolf') {
      target.ref.takeDamage(34);
    }
  }, 140);
}

/* --- Взаимодействие --- */
function performUse() {
  const target = findTarget();
  handState.usePulse = 1;
  if (!target) {
    addToast('НЕЧЕГО ИСПОЛЬЗОВАТЬ', 'warn');
    return;
  }
  if (target.kind === 'tree') {
    inventory.wood += 1;
    spawnWoodChips(target.point.x, target.point.y, target.point.z, 6);
    updateInvUI();
  } else if (target.kind === 'rock') {
    inventory.stone += 1;
    spawnStoneChips(target.point.x, target.point.y, target.point.z, 6);
    updateInvUI();
  } else if (target.kind === 'fire') {
    player.warmth = Math.min(100, player.warmth + 32);
    addToast('ТЕПЛО У КОСТРА', 'good');
  } else if (target.kind === 'wolf') {
    if (target.ref.dead) {
      inventory.meat += 2;
      addToast('+2 МЯСА', 'good');
      updateInvUI();
      scene.remove(target.ref.root);
      const idx = wolves.indexOf(target.ref);
      if (idx >= 0) wolves.splice(idx, 1);
    }
  }
}

/* --- Употребить мясо --- */
function performEat() {
  if (inventory.meat <= 0) { addToast('НЕТ ЕДЫ', 'warn'); return; }
  inventory.meat--;
  player.food = Math.min(100, player.food + 34);
  player.health = Math.min(100, player.health + 6);
  updateInvUI();
  addToast('ВЫ СЪЕЛИ МЯСО', 'good');
  // Анимация
  handState.usePulse = 1.6;
}

/* --- Построить костёр --- */
function tryPlaceCampfire() {
  if (inventory.wood < 5 || inventory.stone < 3) {
    addToast('НУЖНО 5 ДРЕВЕСИНЫ И 3 КАМНЯ', 'warn');
    return;
  }
  inventory.wood -= 5;
  inventory.stone -= 3;
  updateInvUI();
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  dir.y = 0; dir.normalize();
  const px = player.pos.x + dir.x * 2.0;
  const pz = player.pos.z + dir.z * 2.0;
  placeCampfire(px, pz);
  addToast('КОСТЁР РАЗОЖЖЁН', 'good');
}

/* ============================================================================
   16. ВЫЖИВАНИЕ
   ========================================================================== */
let dayLight = 1;
let gameTime = 6 * 60; // в игровых минутах

function updateSurvival(dt) {
  if (!player.alive) return;

  // Голод / жажда
  player.food  = Math.max(0, player.food  - dt * 0.42);
  player.water = Math.max(0, player.water - dt * 0.58);

  // Температура: холодно ночью, тепло у костра
  let warmthDelta = -dt * (0.22 + (1 - dayLight) * 1.35);
  if (campfire) {
    const d = Math.hypot(player.pos.x - campfire.group.position.x, player.pos.z - campfire.group.position.z);
    if (d < 6) warmthDelta += dt * (1.9 - d * 0.22);
  }
  player.warmth = clamp(player.warmth + warmthDelta, 0, 100);

  // Урон от истощения
  let dmg = 0;
  if (player.food  <= 0) dmg += dt * 1.6;
  if (player.water <= 0) dmg += dt * 2.2;
  if (player.warmth <= 8) dmg += dt * 2.6;
  if (dmg > 0) {
    player.health -= dmg;
    if (Math.random() < dt * 3) flashHit();
  }

  // Регенерация при сытости
  if (player.food > 55 && player.water > 55 && player.health < 100) {
    player.health = Math.min(100, player.health + dt * 0.85);
  }

  // Стамина
  const sprinting = keys['ShiftLeft'] || keys['ShiftRight'];
  if (sprinting && (Math.abs(moveInput.x) > 0.1 || Math.abs(moveInput.y) > 0.1 || keys['KeyW'])) {
    player.stamina = Math.max(0, player.stamina - dt * 16);
  } else {
    player.stamina = Math.min(100, player.stamina + dt * 11);
  }

  // UI
  $('#f-hp').style.transform    = `scaleX(${player.health / 100})`;
  $('#f-food').style.transform  = `scaleX(${player.food / 100})`;
  $('#f-water').style.transform = `scaleX(${player.water / 100})`;
  $('#f-temp').style.transform  = `scaleX(${player.warmth / 100})`;
  $('#f-stam').style.transform  = `scaleX(${player.stamina / 100})`;

  // Эффекты
  const frostAmt = clamp((28 - player.warmth) / 28, 0, 1);
  $('#frost').style.opacity = frostAmt * 0.9;
  const bloodAmt = clamp((55 - player.health) / 55, 0, 1);
  $('#blood').style.opacity = player.alive ? bloodAmt * 0.72 : 0;

  if (player.health <= 0 && player.alive) {
    player.alive = false;
    $('#death').classList.add('on');
  }
}

let hitFlashTimer = 0;
function flashHit() {
  $('#hitflash').style.opacity = '0.55';
  hitFlashTimer = 0.25;
}

/* ============================================================================
   17. ДВИЖЕНИЕ ИГРОКА
   ========================================================================== */
function updatePlayer(dt) {
  // Направление ввода
  let ix = moveInput.x;
  let iy = moveInput.y;
  if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;

  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  const sprinting = (keys['ShiftLeft'] || keys['ShiftRight']) && player.stamina > 5;
  const speed = sprinting ? player.sprintSpeed : player.speed;

  // Мировое направление
  const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
  const wx = ix * cosY - iy * sinY;
  const wz = ix * sinY + iy * cosY;

  // Вертикаль
  if (jumpRequested && player.onGround) {
    player.vel.y = 5.4;
    player.onGround = false;
  }
  jumpRequested = false;

  player.vel.y -= 16.5 * dt;

  // Горизонтальное сглаживание
  const targetVX = wx * speed;
  const targetVZ = wz * speed;
  const accel = player.onGround ? 14 : 4.5;
  player.vel.x = lerp(player.vel.x, targetVX, Math.min(1, dt * accel));
  player.vel.z = lerp(player.vel.z, targetVZ, Math.min(1, dt * accel));

  // Перемещение
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  player.pos.y += player.vel.y * dt;

  // Ограничение мира
  const R = 112;
  const rad = Math.hypot(player.pos.x, player.pos.z);
  if (rad > R) {
    player.pos.x = player.pos.x / rad * R;
    player.pos.z = player.pos.z / rad * R;
  }

  // Коллизия с землёй
  const gh = terrainHeight(player.pos.x, player.pos.z);
  const groundY = Math.max(gh, WATER_LEVEL - 0.25);
  if (player.pos.y <= groundY) {
    player.pos.y = groundY;
    player.vel.y = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Ходьба
  const hSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (player.onGround && hSpeed > 0.3) {
    player.walkPhase += dt * hSpeed * 2.35;
    player.bobAmount = lerp(player.bobAmount, clamp(hSpeed / player.sprintSpeed, 0, 1), dt * 6);
  } else {
    player.bobAmount = lerp(player.bobAmount, 0, dt * 6);
  }

  // Камера
  const bobY = Math.sin(player.walkPhase * 2) * 0.042 * player.bobAmount;
  const bobX = Math.cos(player.walkPhase) * 0.030 * player.bobAmount;
  const breathe = Math.sin(performance.now() * 0.0012) * 0.006;

  camera.position.set(
    player.pos.x + bobX * Math.cos(player.yaw),
    player.pos.y + player.height + bobY + breathe,
    player.pos.z - bobX * Math.sin(player.yaw)
  );

  const roll = Math.cos(player.walkPhase) * 0.012 * player.bobAmount;
  const pitchBob = Math.sin(player.walkPhase * 2) * 0.008 * player.bobAmount;

  camera.rotation.set(0, 0, 0);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch + pitchBob;
  camera.rotation.z = roll;

  // Солнце следует за игроком (для теней)
  sun.target.position.copy(player.pos);
  sun.position.copy(player.pos).add(new THREE.Vector3(
    Math.cos(gameTime * 0.001) * 60,
    70,
    Math.sin(gameTime * 0.001) * 60
  ));
}

/* ============================================================================
   18. АНИМАЦИЯ РУК
   ========================================================================== */
function updateHands(dt, t) {
  // Инерция (sway)
  handState.targetSwayX = lerp(handState.targetSwayX, 0, dt * 3.5);
  handState.targetSwayY = lerp(handState.targetSwayY, 0, dt * 3.5);
  handState.swayX = lerp(handState.swayX, handState.targetSwayX, dt * 8);
  handState.swayY = lerp(handState.swayY, handState.targetSwayY, dt * 8);

  // Покачивание при ходьбе
  const bobX = Math.cos(player.walkPhase) * 0.030 * player.bobAmount;
  const bobY = Math.sin(player.walkPhase * 2) * 0.026 * player.bobAmount;
  const idleY = Math.sin(t * 1.35) * 0.005;
  const idleX = Math.cos(t * 1.05) * 0.004;

  // Анимация замаха
  let swingRotX = 0, swingRotZ = 0, swingPosY = 0, swingPosZ = 0;
  if (handState.swingActive) {
    handState.swingT += dt / 0.42;
    const p = handState.swingT;
    if (p >= 1) {
      handState.swingActive = false;
      handState.swingT = 0;
    } else {
      // Замах назад → резкий удар вниз
      const wind = clamp(p / 0.32, 0, 1);
      const strike = clamp((p - 0.32) / 0.34, 0, 1);
      const recover = clamp((p - 0.66) / 0.34, 0, 1);

      const windE = Math.sin(wind * Math.PI * 0.5);
      const strikeE = strike * strike * (3 - 2 * strike);
      const recoverE = 1 - Math.cos(recover * Math.PI * 0.5);

      swingRotX = -1.15 * windE + 2.15 * strikeE - 1.0 * recoverE;
      swingRotZ = 0.42 * windE - 0.72 * strikeE + 0.30 * recoverE;
      swingPosY = -0.055 * windE + 0.045 * strikeE - 0.02 * recoverE;
      swingPosZ = 0.09 * windE - 0.16 * strikeE + 0.05 * recoverE;
    }
  }

  // Пульс от использования
  if (handState.usePulse > 0) handState.usePulse = Math.max(0, handState.usePulse - dt * 3.2);
  const useP = handState.usePulse;

  // Правая рука (с топором)
  rightHandGroup.position.set(
    RIGHT_BASE.x + bobX + handState.swayX + idleX - useP * 0.035,
    RIGHT_BASE.y + bobY + handState.swayY + idleY - useP * 0.02 + swingPosY,
    RIGHT_BASE.z + swingPosZ
  );
  rightHandGroup.rotation.set(
    RIGHT_ROT.x + handState.swayY * 4 + swingRotX - useP * 0.35,
    RIGHT_ROT.y + handState.swayX * 3,
    RIGHT_ROT.z + handState.swayX * 3 + swingRotZ
  );

  // Левая рука
  const meatVisible = inventory.meat > 0;
  meatInHand.visible = meatVisible;
  leftHandGroup.position.set(
    LEFT_BASE.x + bobX * 0.85 + handState.swayX * 0.9 + idleX * 1.2,
    LEFT_BASE.y + bobY * 0.85 + handState.swayY * 0.9 + idleY * 1.2 - useP * 0.09,
    LEFT_BASE.z + useP * 0.05
  );
  leftHandGroup.rotation.set(
    LEFT_ROT.x + handState.swayY * 4 - useP * 0.9,
    LEFT_ROT.y + handState.swayX * 3,
    LEFT_ROT.z + handState.swayX * 3 + useP * 0.4
  );

  // Скрываем левую руку с мясом — она "уходит" при поедании
  if (useP > 0.3) {
    leftHandGroup.position.y -= (useP - 0.3) * 0.5;
  }
}

/* ============================================================================
   19. ДЕНЬ/НОЧЬ И АТМОСФЕРА
   ========================================================================== */
const DAY_LENGTH = 240; // секунд на полный цикл

function updateSky(dt) {
  gameTime += dt * (1440 / DAY_LENGTH); // игровые минуты
  if (gameTime >= 1440) gameTime -= 1440;

  const tNorm = gameTime / 1440;              // 0..1
  const sunAngle = (tNorm - 0.25) * Math.PI * 2; // 6:00 = восход

  const sunY = Math.sin(sunAngle);
  const sunX = Math.cos(sunAngle);

  sun.position.copy(player.pos).add(new THREE.Vector3(sunX * 70, Math.max(sunY, -0.2) * 90, sunX * 22 + 30));
  sun.target.position.copy(player.pos);

  // Дневной свет 0..1
  dayLight = clamp((sunY + 0.12) / 0.45, 0, 1);
  dayLight = dayLight * dayLight * (3 - 2 * dayLight);

  // Солнце
  sun.intensity = 0.06 + dayLight * 2.7;
  const warm = 1 - dayLight;
  sun.color.setRGB(1.0, 0.86 + dayLight * 0.10, 0.62 + dayLight * 0.32);

  // Глобальный свет
  hemi.intensity = 0.13 + dayLight * 0.82;
  hemi.color.setHex(dayLight > 0.4 ? 0x9fb8d0 : 0x2a3550);
  hemi.groundColor.setHex(dayLight > 0.4 ? 0x2c2a22 : 0x0a0c10);

  ambient.intensity = 0.10 + dayLight * 0.36;
  ambient.color.setHex(dayLight > 0.4 ? 0x404a55 : 0x1a2233);

  // Небо
  const night = 1 - dayLight;
  skyUniforms.uNight.value = night;
  skyUniforms.uTime.value += dt;
  skyUniforms.uSunDir.value.set(sunX, sunY, sunX * 0.3 + 0.3).normalize();

  skyUniforms.uTop.value.setRGB(
    lerp(0.02, 0.18, dayLight),
    lerp(0.03, 0.30, dayLight),
    lerp(0.08, 0.47, dayLight)
  );
  skyUniforms.uMid.value.setRGB(
    lerp(0.06, 0.62, dayLight),
    lerp(0.08, 0.71, dayLight),
    lerp(0.14, 0.78, dayLight)
  );
  // Низ неба — тёплый на рассвете/закате
  const horizonWarm = Math.exp(-Math.pow(sunY * 3.2, 2));
  skyUniforms.uBot.value.setRGB(
    lerp(0.07, 0.79, dayLight) + horizonWarm * 0.20 * dayLight,
    lerp(0.09, 0.70, dayLight) + horizonWarm * 0.05 * dayLight,
    lerp(0.16, 0.62, dayLight) - horizonWarm * 0.18 * dayLight
  );

  // Туман
  const fogColor = new THREE.Color().setRGB(
    lerp(0.04, 0.52, dayLight) + horizonWarm * 0.14,
    lerp(0.05, 0.60, dayLight) + horizonWarm * 0.03,
    lerp(0.10, 0.68, dayLight) - horizonWarm * 0.10
  );
  scene.fog.color.copy(fogColor);
  scene.fog.density = lerp(0.030, 0.014, dayLight);

  // Экспозиция
  renderer.toneMappingExposure = lerp(0.72, 1.08, dayLight);

  // Ветер
  for (const u of windUniforms) u.value += dt;

  // Часы
  const hh = String(Math.floor(gameTime / 60)).padStart(2, '0');
  const mm = String(Math.floor(gameTime % 60)).padStart(2, '0');
  $('#clock-t').textContent = `${hh}:${mm}`;
}

function updateInvUI() {

let hintTimer = 0;
function updateHint(dt) {
  const target = findTarget();
  currentTarget = target;
  const hint = $('#hint');
  const cross = $('#cross');

  if (target && player.alive) {
    let txt = '';
    if (target.kind === 'tree')  txt = 'ДЕРЕВО — E СОБРАТЬ · ЛКМ РУБИТЬ';
    if (target.kind === 'rock')  txt = 'КАМЕНЬ — E СОБРАТЬ · ЛКМ БИТЬ';
    if (target.kind === 'fire')  txt = 'КОСТЁР — E СОГРЕТЬСЯ';
    if (target.kind === 'wolf')  txt = target.ref.dead ? 'ТУША — E ОБЫСКАТЬ' : 'ВОЛК — ЛКМ АТАКОВАТЬ';
    hint.textContent = txt;
    hint.classList.add('on');
    cross.classList.add('hot');
  } else {
    hint.classList.remove('on');
    cross.classList.remove('hot');
  }
}

/* --- Кнопки обработка --- */
function processActions() {
  if (attackRequested) { attackRequested = false; if (player.alive) performAttack(); }
  if (useRequested)    { useRequested = false;    if (player.alive) performUse(); }
  if (eatRequested)    { eatRequested = false;    if (player.alive) performEat(); }
}

/* ============================================================================
   21. СПАВН МИРА
   ========================================================================== */
function spawnWorld() {
  // Деревья
  let placed = 0, tries = 0;
  while (placed < (IS_TOUCH ? 34 : 46) && tries < 900) {
    tries++;
    const a = Math.random() * Math.PI * 2;
    const r = 8 + Math.sqrt(Math.random()) * 82;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const y = terrainHeight(x, z);
    if (y < WATER_LEVEL + 0.9 || y > 17) continue;
    const n = terrainNormal(x, z);
    if (n.y < 0.82) continue;
    buildTree(x, z);
    placed++;
  }

  // Камни
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 6 + Math.sqrt(Math.random()) * 78;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const y = terrainHeight(x, z);
    if (y < WATER_LEVEL + 0.4) continue;
    buildRock(x, z, rnd(0.35, 1.25));
  }

  // Волки
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 34 + Math.random() * 26;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const w = new Wolf(x, z);
    wolves.push(w);
  }

  // Стартовый костёр
  placeCampfire(3.2, -2.6);

  // Небольшой стартовый запас
  inventory.wood = 5;
  inventory.stone = 3;
  updateInvUI();
}

/* --- Листва: сборка InstancedMesh после генерации деревьев --- */
function buildLeafInstancedMesh() {
  const leafGeo = new THREE.PlaneGeometry(1, 1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({
    map: LEAF_TEX, transparent: true, alphaTest: 0.42,
    side: THREE.DoubleSide, roughness: 0.86, metalness: 0.0,
    color: 0xffffff,
  });
  applyWind(mat, 0.10, 1.55);

  const mesh = new THREE.InstancedMesh(leafGeo, mat, leafInstanceData.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  for (let i = 0; i < leafInstanceData.length; i++) {
    mesh.setMatrixAt(i, leafInstanceData[i]);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

/* ============================================================================
   22. ИНИЦИАЛИЗАЦИЯ
   ========================================================================== */
const loaderBar = $('#bar i');
const loaderTxt = $('#ltxt');

function setProgress(p, txt) {
  loaderBar.style.width = (p * 100).toFixed(0) + '%';
  if (txt) loaderTxt.textContent = txt;
}

async function boot() {
  await new Promise(r => setTimeout(r, 60));

  setProgress(0.08, 'ФОРМИРОВАНИЕ ЛАНДШАФТА...');
  buildTerrain();
  await new Promise(r => setTimeout(r, 40));

  setProgress(0.26, 'НАПОЛНЕНИЕ ВОДОЁМОВ...');
  buildWater();
  await new Promise(r => setTimeout(r, 40));

  setProgress(0.40, 'ВЫРАЩИВАНИЕ ЛЕСА...');
  spawnWorld();
  await new Promise(r => setTimeout(r, 40));

  setProgress(0.66, 'РАСПУСКАНИЕ ЛИСТВЫ...');
  buildLeafInstancedMesh();
  await new Promise(r => setTimeout(r, 40));

  setProgress(0.80, 'ПОСЕВ ТРАВ...');
  buildGrass();
  await new Promise(r => setTimeout(r, 40));

  setProgress(0.92, 'ПРОБУЖДЕНИЕ ХИЩНИКОВ...');
  // Ставим игрока на землю
  player.pos.set(0, terrainHeight(0, 0), 0);
  camera.position.set(0, player.pos.y + player.height, 0);
  await new Promise(r => setTimeout(r, 60));

  setProgress(1.0, 'ГОТОВО');
  await new Promise(r => setTimeout(r, 320));

  $('#loader').classList.add('gone');
  addToast('ВЫ ОЧНУЛИСЬ В ЛЕСУ', '');
  setTimeout(() => addToast('НАЙДИТЕ ДРЕВЕСИНУ И КАМЕНЬ', ''), 1900);
  setTimeout(() => addToast('ПОСТРОЙТЕ КОСТЁР ДО НОЧИ (Q)', 'warn'), 3800);

  animate();
}

/* ============================================================================
   23. ГЛАВНЫЙ ЦИКЛ
   ========================================================================== */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  processActions();

  updateSky(dt);
  if (player.alive) updatePlayer(dt);
  updateHands(dt, elapsed);
  updateWater(elapsed);
  updateSurvival(dt);
  updateHint(dt);
  updateParticles(dt);

  if (campfire) campfire.update(dt, elapsed);

  for (const w of wolves) w.update(dt, player.pos, elapsed);

  // Вспышка попадания
  if (hitFlashTimer > 0) {
    hitFlashTimer -= dt;
    $('#hitflash').style.opacity = String(Math.max(0, hitFlashTimer * 2.2));
  }

  composer.render();
}

/* --- Атака волка по игроку --- */
function onWolfAttack(wolf) {
  if (!player.alive) return;
  const d = Math.hypot(player.pos.x - wolf.root.position.x, player.pos.z - wolf.root.position.z);
  if (d > 2.6) return;
  player.health -= 9;
  player.warmth -= 3;
  flashHit();
  addToast('ВОЛК УКУСИЛ ВАС!', 'warn');
  handState.targetSwayX = rnd(-0.09, 0.09);
  handState.targetSwayY = rnd(-0.09, 0.09);
}
function onWolfKilled(wolf) {
  addToast('ВОЛК ПОВЕРЖЕН', 'good');
}

/* --- Возрождение --- */
$('#respawn').addEventListener('click', () => {
  $('#death').classList.remove('on');
  player.health = 100;
  player.food = 70;
  player.water = 70;
  player.warmth = 80;
  player.stamina = 100;
  player.alive = true;
  player.pos.set(0, terrainHeight(0, 0), 0);
  player.vel.set(0, 0, 0);
  inventory.wood = 0; inventory.stone = 0; inventory.meat = 0;
  updateInvUI();
  addToast('НОВАЯ ПОПЫТКА', '');
});

/* ============================================================================
   24. PWA MANIFEST
   ========================================================================== */
(function setupPWA() {
  try {
    // Иконка
    const ic = document.createElement('canvas');
    ic.width = ic.height = 512;
    const g = ic.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#12181c');
    grad.addColorStop(1, '#05070a');
    g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = '#c8a45c'; g.lineWidth = 14;
    g.beginPath();
    g.moveTo(256, 90);
    g.lineTo(400, 256);
    g.lineTo(256, 422);
    g.lineTo(112, 256);
    g.closePath();
    g.stroke();
    g.fillStyle = '#c8a45c';
    g.font = 'bold 110px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('W', 256, 262);
    const iconUrl = ic.toDataURL('image/png');

    const manifest = {
      name: 'WILDERNESS — Hardcore Survival',
      short_name: 'WILDERNESS',
      description: 'Процедурная 3D-игра на выживание',
      start_url: '.',
      display: 'fullscreen',
      orientation: 'any',
      background_color: '#05070a',
      theme_color: '#0b0d0c',
      icons: [
        { src: iconUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  } catch (e) { /* ignore */ }
})();

/* ============================================================================
   25. СТАРТ
   ========================================================================== */
boot();

// Обработка потери контекста
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  addToast('ПОТЕРЯ ГРАФИЧЕСКОГО КОНТЕКСТА', 'warn');
});
</script>
