// GAME SCENE
// ---------------------------------------------------------------------------
function buildGameScene() {
  const canvas = $('gameCanvas');
  App.gameRenderer = new THREE.WebGLRenderer({
    canvas, antialias:true, alpha:false, powerPreference:'high-performance'
  });
  App.gameRenderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  App.gameRenderer.setSize(innerWidth, innerHeight, false);
  App.gameRenderer.outputColorSpace = THREE.SRGBColorSpace;
  App.gameRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  App.gameRenderer.toneMappingExposure = 1.1;
  App.gameRenderer.shadowMap.enabled = true;
  App.gameRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  App.gameScene = scene;
  App.gameFog = new THREE.FogExp2(0x8aa8c8, 0.018);
  scene.fog = App.gameFog;

  const camera = new THREE.PerspectiveCamera(58, innerWidth/Math.max(innerHeight,1), 0.1, 400);
  camera.position.set(0, 4.5, 7);
  App.gameCamera = camera;

  // Sky
  try {
    const sky = new Sky();
    sky.scale.setScalar(6000);
    scene.add(sky);
    App.gameSky = sky;
    const u = sky.material.uniforms;
    u['turbidity'].value = 8;
    u['rayleigh'].value = 2.4;
    u['mieCoefficient'].value = 0.006;
    u['mieDirectionalG'].value = 0.78;
    u['sunPosition'].value.set(0, 0.4, -1).normalize();
  } catch(e) { console.warn('Sky failed', e); }

  // Directional sun with shadow
  const key = new THREE.DirectionalLight(0xffe0b8, 2.8);
  key.position.set(15, 25, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -20;
  key.shadow.camera.right = 20;
  key.shadow.camera.top = 20;
  key.shadow.camera.bottom = -20;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 80;
  key.shadow.bias = -0.0006;
  scene.add(key);
  scene.add(key.target);
  App.gameKeyLight = key;

  scene.add(new THREE.HemisphereLight(0xa8c8ff, 0x3a2a1a, 0.6));
  scene.add(new THREE.AmbientLight(0x405080, 0.35));

  // --- Terrain with eroded normal map ---
  const groundTex = groundTexture();
  const groundNorm = normalMapFromFn(256, (u,v) => {
    return Math.sin(u*30+Math.sin(v*20)*3)*0.3 + Math.sin(v*40)*0.3 + Math.random()*0.1 + 0.5;
  }, 1.8);
  groundNorm.repeat.set(40, 40);
  groundTex.repeat.set(40, 40);

  const groundGeo = new THREE.PlaneGeometry(200, 200, 120, 120);
  const gp = groundGeo.attributes.position;
  for (let i = 0; i < gp.count; i++) {
    const x = gp.getX(i), y = gp.getY(i);
    const d = Math.hypot(x, y);
    const h = (Math.sin(x*0.12)*Math.cos(y*0.13)*1.6 + Math.sin(x*0.4+y*0.3)*0.6) * smoothstep(6, 30, d);
    gp.setZ(i, h);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({
    map: groundTex, normalMap: groundNorm,
    normalScale: new THREE.Vector2(1.2, 1.2),
    roughness: 0.92, metalness: 0.05,
    color: 0x9a9070,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
  App.ground = ground;

  // --- Trees (realistic) ---
  App.trees = [];
  const treeGroup = new THREE.Group();
  for (let i = 0; i < 45; i++) {
    const a = rand(0, TAU);
    const r = rand(10, 60);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 6) continue;
    const tree = TreeBuilder.build({ scale: rand(0.9, 1.6) });
    tree.position.set(x, 0, z);
    tree.rotation.y = rand(0, TAU);
    treeGroup.add(tree);
    App.trees.push(tree);
  }
  scene.add(treeGroup);

  // --- Grass field ---
  try {
    const grass = GrassField.build(3000, 55);
    scene.add(grass);
    App.grass = grass;
  } catch(e) {
    console.warn('Grass failed', e);
  }

  // --- Rocks (deformed icosahedrons with moss) ---
  const rockTex = rockTexture();
  const rockNormal = normalMapFromFn(128, (u,v) => Math.sin(u*15)*Math.cos(v*18)*0.5+0.5, 1.5);
  const rockMat = new THREE.MeshStandardMaterial({
    map: rockTex, normalMap: rockNormal,
    normalScale: new THREE.Vector2(1.0, 1.0),
    roughness: 0.92, metalness: 0.08,
    color: 0x8a8070,
  });
  for (let i = 0; i < 30; i++) {
    const a = rand(0, TAU);
    const r = rand(6, 55);
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 2) continue;
    const geo = new THREE.IcosahedronGeometry(rand(0.4, 1.3), 2);
    const rp = geo.attributes.position;
    for (let j = 0; j < rp.count; j++) {
      const vx = rp.getX(j), vy = rp.getY(j), vz = rp.getZ(j);
      const n = Math.sin(vx*4)*Math.cos(vy*3.5)*0.25 + Math.sin(vz*5)*0.15;
      rp.setXYZ(j, vx*(1+n), vy*(1+n*0.6), vz*(1+n));
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, rockMat);
    mesh.position.set(x, rand(0.05, 0.4), z);
    mesh.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    mesh.scale.y = rand(0.7, 1.2);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    App.rocks.push(mesh);
  }

  // --- City ---
  buildCity(scene);

  // --- Player ---
  buildPlayer(scene);

  // --- Enemies ---
  for (let i = 0; i < 5; i++) spawnEnemy(scene);

  // --- Rain ---
  buildRain(scene);

  // --- Post-processing ---
  try {
    const composer = new EffectComposer(App.gameRenderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.85, 0.65, 0.82
    );
    composer.addPass(bloom);
    App.gameBloom = bloom;
    const grade = new ShaderPass({
      uniforms: {
        tDiffuse:{value:null},
        uSat:{value:1.12}, uContrast:{value:1.14},
        uVig:{value:0.75},
        uTime:{value:0},
        uWetness:{value:0},
        uFocus:{value:new THREE.Vector2(0.5, 0.5)},
        uBlur:{value:0.0035},
      },
      vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:`
        uniform sampler2D tDiffuse;
        uniform float uSat,uContrast,uVig,uTime,uWetness,uBlur;
        uniform vec2 uFocus; varying vec2 vUv;
        void main(){
          vec2 d = vUv - uFocus; float dd = length(d);
          float b = smoothstep(0.25, 0.85, dd) * uBlur;
          vec4 c = vec4(0.0);
          const int N = 6;
          for (int i=0;i<N;i++){
            float a = float(i)*6.28318/float(N);
            c += texture2D(tDiffuse, vUv + vec2(cos(a),sin(a))*b);
          }
          c /= float(N);
          float l = dot(c.rgb, vec3(0.299,0.587,0.114));
          c.rgb = mix(vec3(l), c.rgb, uSat);
          c.rgb = (c.rgb - 0.5)*uContrast + 0.5;
          // Wetness desaturation
          c.rgb = mix(c.rgb, c.rgb * vec3(0.85, 0.9, 1.0), uWetness*0.5);
          float v = smoothstep(0.95, 0.35, length(vUv-0.5));
          c.rgb *= mix(1.0-uVig, 1.0, v);
          gl_FragColor = c;
        }
      `,
    });
    composer.addPass(grade);
    App.gameComposer = composer;
    App.gameGrade = grade;
  } catch(e) {
    console.warn('Game post-processing failed:', e);
  }

  App.gameClock = new THREE.Clock();
  const mm = $('minimap');
  App.minimapCtx = mm ? mm.getContext('2d') : null;
}

function smoothstep(a, b, x) {
  const t = clamp((x-a)/(b-a), 0, 1);
  return t*t*(3-2*t);
}

// ---------------------------------------------------------------------------
// CITY (safe zone)
// ---------------------------------------------------------------------------
function buildCity(scene) {
  const city = new THREE.Group();
  const c = App.cityCenter;

  // Stone plaza
  const plazaTex = groundTexture();
  plazaTex.repeat.set(8, 8);
  const plazaMat = new THREE.MeshStandardMaterial({
    color: 0x9a8a70, map: plazaTex,
    normalMap: normalMapFromFn(256, (u,v) => Math.sin(u*30)*Math.cos(v*30)*0.5+0.5, 1.2),
    roughness: 0.85, metalness: 0.1,
  });
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(App.cityRadius, 40), plazaMat);
  plaza.rotation.x = -Math.PI/2;
  plaza.position.set(c.x, 0.05, c.z);
  plaza.receiveShadow = true;
  city.add(plaza);

  // Wall
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x5a5040, roughness: 0.9,
    normalMap: normalMapFromFn(128, (u,v) => Math.sin(u*20)*Math.cos(v*20)*0.5+0.5, 1.4),
  });
  for (let i = 0; i < 22; i++) {
    if (i > 0 && i < 3) continue;
    const a = (i/22)*TAU;
    const wx = c.x + Math.cos(a)*App.cityRadius;
    const wz = c.z + Math.sin(a)*App.cityRadius;
    const wallGroup = new THREE.Group();
    const block = new THREE.Mesh(new THREE.BoxGeometry(2.4, rand(3, 4.2), 1.1), wallMat);
    block.position.y = 1.8;
    block.castShadow = true;
    block.receiveShadow = true;
    wallGroup.add(block);
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.35, 1.4), wallMat);
    top.position.y = 3.85;
    top.castShadow = true;
    wallGroup.add(top);
    wallGroup.position.set(wx, 0, wz);
    wallGroup.rotation.y = -a;
    city.add(wallGroup);
  }

  // Central obelisk (dark monolith)
  const obeliskMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a3a, metalness: 0.85, roughness: 0.25,
    emissive: 0x3a5aff, emissiveIntensity: 0.5,
  });
  const obelisk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.6, 5.5, 6), obeliskMat);
  obelisk.position.set(c.x, 2.75, c.z);
  obelisk.castShadow = true;
  city.add(obelisk);
  // Floating rune
  const rune = new THREE.Mesh(
    new THREE.TorusGeometry(0.75, 0.05, 8, 32),
    new THREE.MeshBasicMaterial({ color: 0x7cd9ff, transparent: true, opacity: 0.9 })
  );
  rune.position.set(c.x, 5.2, c.z);
  rune.rotation.x = Math.PI/2;
  rune.userData.isHalo = true;
  city.add(rune);

  // Two fountains
  for (let f = 0; f < 2; f++) {
    const fx = c.x + (f === 0 ? -7 : 7);
    const fz = c.z + (f === 0 ? -5 : 5);
    const fg = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(1.1, 1.3, 0.4, 20),
      new THREE.MeshStandardMaterial({ color: 0x8a7a60, roughness: 0.8 })
    );
    base.position.y = 0.2;
    base.castShadow = true;
    fg.add(base);
    // Water bowl (glossy)
    const water = new THREE.Mesh(
      new THREE.CylinderGeometry(0.95, 0.95, 0.15, 20),
      new THREE.MeshStandardMaterial({
        color: 0x2a5a90, roughness: 0.08, metalness: 0.9,
        transparent: true, opacity: 0.9,
      })
    );
    water.position.y = 0.5;
    fg.add(water);
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.15, 1.4, 10),
      new THREE.MeshStandardMaterial({ color: 0x6a5a40, roughness: 0.85 })
    );
    pillar.position.y = 1.2;
    pillar.castShadow = true;
    fg.add(pillar);
    fg.position.set(fx, 0, fz);
    city.add(fg);
  }

  // Merchant stalls
  App.stallPositions = [];
  const stallDefs = [
    { x:-3, z:-6, rot:0, type:'potion', color:0x4a9e4a, icon:'🧪' },
    { x:3,  z:-6, rot:0, type:'weapon', color:0xff6030, icon:'⚔️' },
    { x:-3, z:6,  rot:Math.PI, type:'armor', color:0x4a5aa0, icon:'🛡️' },
    { x:3,  z:6,  rot:Math.PI, type:'runes', color:0xa04ad0, icon:'🔮' },
  ];
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2f1a, roughness: 0.85 });
  for (const sp of stallDefs) {
    const sx = c.x + sp.x, sz = c.z + sp.z;
    const stall = new THREE.Group();
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.75, 1.1), woodMat);
    counter.position.y = 0.4;
    counter.castShadow = true;
    counter.receiveShadow = true;
    stall.add(counter);
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.14, 1.7),
      new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.9 })
    );
    canopy.position.y = 2.2;
    canopy.castShadow = true;
    stall.add(canopy);
    for (const px of [-1.1, 1.1]) for (const pz of [-0.55, 0.55]) {
      const p = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 2.2, 6),
        woodMat
      );
      p.position.set(px, 1.1, pz);
      stall.add(p);
    }
    // Banner
    const banner = new THREE.Mesh(
      new THREE.PlaneGeometry(0.55, 1.4, 2, 4),
      new THREE.MeshStandardMaterial({ color: sp.color, side: THREE.DoubleSide, roughness: 0.85 })
    );
    banner.position.y = 1.5;
    banner.userData.isBanner = true;
    banner.userData.phase = rand(0, TAU);
    stall.add(banner);
    // Goods on counter
    for (let k = 0; k < 3; k++) {
      const item = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 10, 8),
        new THREE.MeshStandardMaterial({
          color: sp.color, emissive: sp.color,
          emissiveIntensity: 0.6, roughness: 0.4,
        })
      );
      item.position.set((k-1)*0.45, 0.85, 0);
      stall.add(item);
    }
    stall.position.set(sx, 0, sz);
    stall.rotation.y = sp.rot;
    city.add(stall);
    App.stallPositions.push({ x:sx, z:sz, type:sp.type, icon:sp.icon });
  }

  // NPCs (character models standing at stalls)
  const npcTypes = [
    { name:'Аптекарь Линэль', emoji:'🧝‍♀️', text:'Зелья хранят жизнь.', id:'potion' },
    { name:'Кузнец Борн', emoji:'🧔', text:'Сталь не лжёт.', id:'weapon' },
    { name:'Бронник Мирра', emoji:'🛡️', text:'Броня — вторая кожа.', id:'armor' },
    { name:'Рунослов Тейн', emoji:'🧙', text:'Руны помнят древнее.', id:'runes' },
  ];
  App.npcs = [];
  for (let i = 0; i < App.stallPositions.length; i++) {
    const sp = App.stallPositions[i];
    const t = npcTypes.find(x => x.id === sp.type);
    const npc = Humanoid.build(RACES[i % 3]);
    npc.scale.setScalar(0.95);
    npc.userData.baseScale = 0.95;
    npc.position.set(sp.x, 0, sp.z + 1.5);
    npc.rotation.y = Math.PI;
    npc.userData.isNPC = true;
    npc.userData.dialog = { ...t, emoji: sp.icon };
    scene.add(npc);
    App.npcs.push(npc);
  }

  scene.add(city);
  App.cityGroup = city;
}

function buildPlayer(scene) {
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const g = Humanoid.build(race);
  g.position.set(0, 0, 0);
  g.userData.baseScale = 1.0;
  g.userData.vel = { x:0, z:0 };
  g.userData.hitFlash = 0;
  g.userData.attackCd = 0;
  scene.add(g);
  App.player = g;
}

function spawnEnemy(scene) {
  const a = rand(0, TAU);
  const r = rand(20, 45);
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 5) return;

  // Mutant enemy — dark variant of a race
  const baseRace = Math.random() < 0.5 ? RACES[1] : RACES[0];
  const mutantRace = {
    ...baseRace,
    id: 'mutant',
    color: 0xff2020,
    accent: 0xff4040,
    skin: [90, 40, 40],
    cloth: 0x2a0a0a,
    metal: [70, 30, 30],
    hair: 0x1a0505,
    hairStyle: 'mohawk',
  };
  const e = Humanoid.build(mutantRace);
  e.position.set(x, 0, z);
  e.userData.baseScale = 1.1;
  e.scale.setScalar(1.1);
  e.userData.isEnemy = true;
  e.userData.hp = 60;
  e.userData.maxHp = 60;
  e.userData.speed = rand(1.8, 3.0);
  e.userData.damage = 8;
  e.userData.attackCd = 0;
  e.userData.hitFlash = 0;
  e.userData.vel = { x:0, z:0 };
  e.userData.phase = rand(0, TAU);
  // Red glowing eyes override
  e.traverse((o) => {
    if (o.material && o.material.emissive && o.material.emissive.r > 0.5 && o.material.emissive.b < 0.5) {
      o.material = o.material.clone();
      o.material.emissive = new THREE.Color(0xff2020);
      o.material.color = new THREE.Color(0xff4040);
    }
  });
  // Spikes on back
  for (let i = 0; i < 4; i++) {
    const spike = new THREE.Mesh(
      new THREE.ConeGeometry(0.03, 0.15 - i*0.02, 5),
      new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.7, metalness: 0.4 })
    );
    spike.position.set(0, 1.5 - i*0.1, -0.2);
    spike.rotation.x = -0.5;
    e.add(spike);
  }
  scene.add(e);
  App.enemies.push(e);
}

function buildRain(scene) {
  const count = 800;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vel = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3+0] = rand(-40, 40);
    pos[i*3+1] = rand(0, 40);
    pos[i*3+2] = rand(-40, 40);
    vel[i] = rand(20, 32);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.15, color: 0xaaccff,
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const rain = new THREE.Points(geo, mat);
  rain.userData.vel = vel;
  scene.add(rain);
  App.rain = rain;
}

// ---------------------------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------------------------
function startGameLoop() {
  if (App.gameRafId !== null) return;
  const loop = () => {
    App.gameRafId = requestAnimationFrame(loop);
    try {
      if (!App.gameClock) return;
      const dt = Math.min(App.gameClock.getDelta(), 0.05);
      App.time += dt;

      updateDayNight(dt);
      updateWeather(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateNPCs(dt);
      updateParticles(dt);
      updateCamera(dt);
      updateTrees(dt);
      updateGrass(dt);
      updateBanners(dt);
      updateCds(dt);

      // Sun follows player
      if (App.player && App.gameKeyLight) {
        App.gameKeyLight.target.position.copy(App.player.position);
        App.gameKeyLight.position.set(
          App.player.position.x + 15,
          25,
          App.player.position.z + 10
        );
      }
      if (App.gameSky) {
        const u = App.gameSky.material.uniforms;
        u['sunPosition'].value.set(
          App.player.position.x + 15, 25, App.player.position.z + 10
        ).normalize();
      }

      updateHUD(dt);
      updateMinimap();

      if (App.gameGrade) {
        App.gameGrade.uniforms.uTime.value = App.time;
        App.gameGrade.uniforms.uWetness.value = App.weather.wetness;
      }

      if (App.gameComposer) App.gameComposer.render();
      else if (App.gameRenderer) App.gameRenderer.render(App.gameScene, App.gameCamera);
    } catch(e) { console.error('[GameLoop]', e); }
  };
  loop();
}
function stopGameLoop() {
  if (App.gameRafId !== null) { cancelAnimationFrame(App.gameRafId); App.gameRafId = null; }
}

function updateDayNight(dt) {
  App.dayTime = (App.dayTime + dt/240) % 1;
  const elev = Math.sin((App.dayTime - 0.25) * TAU) * 90;
  const dayFactor = clamp(elev/60 + 0.2, 0, 1);
  if (App.gameKeyLight) {
    App.gameKeyLight.intensity = 0.3 + dayFactor * 3.2;
    App.gameKeyLight.color.setHSL(lerp(0.07, 0.13, dayFactor), 0.75, lerp(0.45, 0.75, dayFactor));
  }
  App.gameRenderer.toneMappingExposure = lerp(0.55, 1.15, dayFactor);
  if (App.gameFog) {
    const c = new THREE.Color();
    c.setHSL(lerp(0.62, 0.08, dayFactor), 0.55, lerp(0.1, 0.65, dayFactor));
    App.gameFog.color.copy(c);
    App.gameRenderer.setClearColor(c);
  }
}

function updateWeather(dt) {
  if (Math.random() < dt/45) {
    App.weather.targetRain = Math.random() < 0.4 ? 1 : 0;
  }
  App.weather.rain = lerp(App.weather.rain, App.weather.targetRain, 1-Math.pow(0.001, dt));
  // Wetness follows rain with delay
  App.weather.wetness = lerp(App.weather.wetness, App.weather.rain * 0.9,
    1 - Math.pow(App.weather.rain > 0.5 ? 0.15 : 0.005, dt));

  if (App.rain) {
    App.rain.material.opacity = App.weather.rain * 0.75;
    const p = App.rain.geometry.attributes.position;
    const vel = App.rain.userData.vel;
    const cam = App.gameCamera;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - vel[i]*dt;
      if (y < 0) {
        y = rand(25, 40);
        p.setX(i, cam.position.x + rand(-25, 25));
        p.setZ(i, cam.position.z + rand(-25, 25));
      }
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }
  // Wetness affects ground roughness + player materials
  const w = App.weather.wetness;
  if (App.ground && App.ground.material) {
    App.ground.material.roughness = lerp(0.92, 0.45, w);
    App.ground.material.metalness = lerp(0.05, 0.35, w);
  }
  if (App.player && App.player.userData) {
    const skinM = App.player.userData.skinMat;
    const clothM = App.player.userData.clothMat;
    const metalM = App.player.userData.metalMat;
    if (skinM) skinM.roughness = lerp(0.65, 0.25, w);
    if (clothM) clothM.roughness = lerp(0.85, 0.35, w);
    if (metalM) metalM.roughness = lerp(0.32, 0.12, w);
  }
}

function isInCity() {
  const p = App.player;
  if (!p) return false;
  return dist(p.position.x, p.position.z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius - 2;
}

function updatePlayer(dt) {
  const p = App.player;
  if (!p) return;
  p.userData.hitFlash = Math.max(0, p.userData.hitFlash - dt);

  const speed = 5.5;
  const tx = App.playerInput.moveX * speed;
  const tz = App.playerInput.moveY * speed;
  p.userData.vel.x = lerp(p.userData.vel.x, tx, 1 - Math.pow(0.001, dt));
  p.userData.vel.z = lerp(p.userData.vel.z, tz, 1 - Math.pow(0.001, dt));
  p.position.x += p.userData.vel.x * dt;
  p.position.z += p.userData.vel.z * dt;

  const mag = Math.hypot(App.playerInput.moveX, App.playerInput.moveY);
  if (mag > 0.1) {
    const tf = Math.atan2(App.playerInput.moveX, App.playerInput.moveY);
    let diff = tf - p.rotation.y;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    p.rotation.y += diff * (1 - Math.pow(0.0001, dt));
  }
  p.position.x = clamp(p.position.x, -95, 95);
  p.position.z = clamp(p.position.z, -95, 95);

  // Walk bob (only legs animation? simple vertical bob)
  const ms = Math.hypot(p.userData.vel.x, p.userData.vel.z);
  p.position.y = Math.sin(App.time*12) * 0.02 * (ms / Math.max(speed, 0.001));
}

function updateEnemies(dt) {
  const p = App.player;
  if (!p) return;
  for (let i = App.enemies.length-1; i >= 0; i--) {
    const e = App.enemies[i];
    if (!e || e.userData.hp <= 0) continue;
    e.userData.attackCd = Math.max(0, e.userData.attackCd - dt);
    e.userData.hitFlash = Math.max(0, e.userData.hitFlash - dt);
    e.userData.phase += dt;

    // Flee if in city
    if (isInCity()) {
      const away = Math.atan2(e.position.x - App.cityCenter.x, e.position.z - App.cityCenter.z);
      e.userData.vel.x = lerp(e.userData.vel.x, Math.sin(away)*3, 1 - Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, Math.cos(away)*3, 1 - Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      Humanoid.animateIdle(e, dt, { baseScale: 1.1 });
      continue;
    }

    const dx = p.position.x - e.position.x;
    const dz = p.position.z - e.position.z;
    const d = Math.hypot(dx, dz);
    if (d > 1.2 && d < 14) {
      const nx = dx/d, nz = dz/d;
      e.userData.vel.x = lerp(e.userData.vel.x, nx*e.userData.speed, 1-Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, nz*e.userData.speed, 1-Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      const tf = Math.atan2(nx, nz);
      let diff = tf - e.rotation.y;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      e.rotation.y += diff * (1-Math.pow(0.001, dt));
    } else if (d <= 1.5 && e.userData.attackCd <= 0) {
      e.userData.attackCd = 1.3;
      App.hud.hp = Math.max(0, App.hud.hp - e.userData.damage);
      p.userData.hitFlash = 0.25;
      const fl = $('dmgFlash');
      if (fl) { fl.classList.add('hit'); setTimeout(()=>fl.classList.remove('hit'), 130); }
      if (App.hud.hp <= 0) respawnPlayer();
    }
    Humanoid.animateIdle(e, dt, { baseScale: 1.1 });
  }
}

function respawnPlayer() {
  const p = App.player;
  if (!p) return;
  p.position.set(App.cityCenter.x, 0, App.cityCenter.z + 5);
  App.hud.hp = App.hud.maxHp;
  App.hud.mana = App.hud.maxMana;
  showToast('ВОЗРОЖДЕНИЕ У ОБЕЛИСКА');
}

function updateNPCs(dt) {
  for (const npc of App.npcs) {
    Humanoid.animateIdle(npc, dt, { baseScale: 0.95 });
  }
}

function updateTrees(dt) {
  // Update wind for a subset of trees each frame
  const idx = Math.floor(App.time * 30) % App.trees.length;
  for (let i = 0; i < 3; i++) {
    const tree = App.trees[(idx + i) % App.trees.length];
    if (tree) TreeBuilder.animateWind(tree, App.time);
  }
}

function updateGrass(dt) {
  if (!App.grass || !App.player) return;
  const mat = App.grass.material;
  if (mat && mat.userData && mat.userData.shader) {
    mat.userData.shader.uniforms.uTime.value = App.time;
    mat.userData.shader.uniforms.uPlayerPos.value.copy(App.player.position);
    mat.userData.shader.uniforms.uPlayerRadius.value = 1.5;
  }
}

function updateBanners(dt) {
  if (!App.cityGroup) return;
  App.cityGroup.traverse((o) => {
    if (o.userData.isBanner) {
      const geo = o.geometry;
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        pos.setZ(i, Math.sin(App.time*2 + (o.userData.phase||0) + y*3) * 0.08 * y);
      }
      pos.needsUpdate = true;
    }
    if (o.userData.isHalo) o.rotation.z = App.time * 0.8;
  });
}

function updateCds(dt) {
  for (const k of Object.keys(App.attackCd)) {
    App.attackCd[k] = Math.max(0, App.attackCd[k] - dt);
  }
  // Update attack button conic gradient
  const btn = $('btnAttack');
  if (btn) {
    const cd = Math.max(App.attackCd.light, App.attackCd.heavy);
    if (cd > 0) {
      const maxCd = 0.5;
      const pct = clamp(cd / maxCd, 0, 1);
      btn.style.setProperty('--cd', (pct * 360) + 'deg');
    } else {
      btn.style.setProperty('--cd', '360deg');
    }
  }
}

function updateCamera(dt) {
  const p = App.player;
  if (!p || !App.gameCamera) return;
  const cam = App.gameCamera;

  // Dynamic camera mode
  App.cameraModeTimer -= dt;
  const enemiesNear = App.enemies.some(e => dist(e.position.x, e.position.z, p.position.x, p.position.z) < 8);
  let targetMode = 'idle';
  if (enemiesNear && !isInCity()) targetMode = 'combat';
  else if (isInCity()) targetMode = 'city';
  if (targetMode !== App.cameraMode && App.cameraModeTimer <= 0) {
    App.cameraMode = targetMode;
    App.cameraModeTimer = 1.5;
  }

  let camDist = 7, camHeight = 4.5, camLookY = 1.0;
  if (App.cameraMode === 'combat') { camDist = 5.5; camHeight = 3.8; camLookY = 1.2; }
  else if (App.cameraMode === 'city') { camDist = 9; camHeight = 5.5; camLookY = 1.4; }

  const targetX = p.position.x;
  const targetZ = p.position.z + camDist;
  cam.position.x = lerp(cam.position.x, targetX, 1 - Math.pow(0.0008, dt));
  cam.position.z = lerp(cam.position.z, targetZ, 1 - Math.pow(0.0008, dt));
  cam.position.y = lerp(cam.position.y, camHeight, 1 - Math.pow(0.002, dt));
  cam.lookAt(p.position.x, camLookY, p.position.z);

  if (p.userData.hitFlash > 0) {
    const s = p.userData.hitFlash * 20;
    cam.position.x += rand(-s, s) * 0.02;
    cam.position.y += rand(-s, s) * 0.02;
  }
}

function updateHUD(dt) {
  const hpLbl = $('orbHpLbl'), manaLbl = $('orbManaLbl');
  const orbHp = $('orbHp'), orbMana = $('orbMana');
  const uiLevel = $('uiLevel'), uiTime = $('uiTime');
  const uiZone = $('uiZone'), uiGold = $('uiGold');

  if (hpLbl) hpLbl.textContent = String(Math.round(App.hud.hp));
  if (manaLbl) manaLbl.textContent = String(Math.round(App.hud.mana));
  if (orbHp) orbHp.style.setProperty('--pct', (App.hud.hp/App.hud.maxHp*100)+'%');
  if (orbMana) orbMana.style.setProperty('--pct', (App.hud.mana/App.hud.maxMana*100)+'%');
  if (uiLevel) uiLevel.textContent = String(App.hud.level);
  if (uiGold) uiGold.textContent = String(Math.floor(App.hud.gold));
  if (uiTime) {
    const h = Math.floor(App.dayTime*24);
    const m = Math.floor((App.dayTime*24-h)*60);
    uiTime.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  if (uiZone) {
    const city = isInCity();
    uiZone.textContent = city ? 'Тихий Причал' : 'Лес Шепчущих';
    uiZone.style.color = city ? '#7cffb0' : '#ff9c6a';
  }
  App.hud.mana = clamp(App.hud.mana + 6*dt, 0, App.hud.maxMana);
  if (isInCity()) App.hud.hp = clamp(App.hud.hp + 6*dt, 0, App.hud.maxHp);
}

function updateMinimap() {
  const ctx = App.minimapCtx;
  const canvas = $('minimap');
  if (!ctx || !canvas || !App.player) return;
  const W = canvas.width, H = canvas.height;
  const p = App.player;
  const range = 60;
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
  bg.addColorStop(0, 'rgba(20,30,60,.85)');
  bg.addColorStop(1, 'rgba(5,8,20,.95)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);
  // City
  const cxs = W/2 + ((App.cityCenter.x - p.position.x)/range)*(W/2);
  const cys = H/2 + ((App.cityCenter.z - p.position.z)/range)*(H/2);
  const cR = (App.cityRadius/range)*(W/2);
  ctx.fillStyle = 'rgba(124,217,255,.15)';
  ctx.strokeStyle = 'rgba(124,217,255,.6)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cxs, cys, cR, 0, TAU); ctx.fill(); ctx.stroke();
  // NPCs
  for (const n of App.npcs) {
    const nx = W/2 + ((n.position.x - p.position.x)/range)*(W/2);
    const ny = H/2 + ((n.position.z - p.position.z)/range)*(H/2);
    ctx.fillStyle = '#ffe7b0';
    ctx.beginPath(); ctx.arc(nx, ny, 5, 0, TAU); ctx.fill();
  }
  // Enemies
  for (const e of App.enemies) {
    const ex = W/2 + ((e.position.x - p.position.x)/range)*(W/2);
    const ey = H/2 + ((e.position.z - p.position.z)/range)*(H/2);
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, TAU); ctx.fill();
  }
  // Player arrow
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(p.rotation.y);
  ctx.fillStyle = '#7cd9ff';
  ctx.beginPath();
  ctx.moveTo(0, -12); ctx.lineTo(7, 8); ctx.lineTo(0, 5); ctx.lineTo(-7, 8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// COMBAT
// ---------------------------------------------------------------------------
function playerAttack(type) {
  const p = App.player;
  if (!p) return;
  const cdKey = type === 'heavy' ? 'heavy' : 'light';
  if (App.attackCd[cdKey] > 0) return;
  App.attackCd[cdKey] = type === 'heavy' ? 0.65 : 0.35;

  // Right arm swing animation
  const armData = p.userData.armData;
  if (armData && armData.right) {
    const arm = armData.right;
    const origX = arm.rotation.x;
    arm.rotation.x = -1.2;
    setTimeout(() => { if (arm) arm.rotation.x = origX; }, 180);
  }

  const range = type === 'heavy' ? 3.2 : 2.2;
  const facing = p.rotation.y;
  for (const e of App.enemies) {
    if (!e || e.userData.hp <= 0) continue;
    const dx = e.position.x - p.position.x;
    const dz = e.position.z - p.position.z;
    const d = Math.hypot(dx, dz);
    if (d > range) continue;
    const ang = Math.atan2(dx, dz);
    let diff = ang - facing;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    if (Math.abs(diff) > 1.4) continue;
    const dmg = type === 'heavy' ? 42 : 22;
    e.userData.hp -= dmg;
    e.userData.hitFlash = 0.25;
    e.userData.vel.x += (dx/d) * 6;
    e.userData.vel.z += (dz/d) * 6;
    spawnHitParticles(e.position, type === 'heavy');
    showDamageNumber(e.position, dmg, type === 'heavy' ? 'heavy' : 'slash');
    if (e.userData.hp <= 0) killEnemy(e);
  }
}

function killEnemy(e) {
  const i = App.enemies.indexOf(e);
  if (i >= 0) App.enemies.splice(i, 1);
  if (App.gameScene) App.gameScene.remove(e);
  e.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
      else o.material.dispose();
    }
  });
  App.hud.xp += 25;
  App.hud.gold += randi(3, 12);
  if (App.hud.xp >= 100) {
    App.hud.xp -= 100;
    App.hud.level++;
    App.hud.maxHp += 15; App.hud.hp = App.hud.maxHp;
    App.hud.maxMana += 10; App.hud.mana = App.hud.maxMana;
    showToast('УРОВЕНЬ ' + App.hud.level, 'magic');
  }
  setTimeout(() => {
    if (App.gameRafId !== null && App.gameScene) spawnEnemy(App.gameScene);
  }, 3000);
}

function playerCast() {
  if (App.attackCd.cast > 0 || App.hud.mana < 15) return;
  App.hud.mana -= 15;
  App.attackCd.cast = 0.8;
  const p = App.player;
  if (!p || !App.gameScene) return;
  const facing = p.rotation.y;
  const cx = p.position.x + Math.sin(facing) * 3;
  const cz = p.position.z + Math.cos(facing) * 3;

  // Fireball
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xff8030, transparent: true, opacity: 0.95 })
  );
  sphere.position.set(cx, 1.2, cz);
  App.gameScene.add(sphere);
  const light = new THREE.PointLight(0xff8030, 8, 5);
  light.position.copy(sphere.position);
  App.gameScene.add(light);
  const startTime = App.time;
  const tick = () => {
    if (!sphere.parent) return;
    const t = (App.time - startTime) / 0.55;
    if (t >= 1) {
      App.gameScene.remove(sphere);
      App.gameScene.remove(light);
      sphere.geometry.dispose();
      sphere.material.dispose();
      return;
    }
    sphere.scale.setScalar(1 + t*2);
    requestAnimationFrame(tick);
  };
  tick();

  for (const e of App.enemies) {
    if (dist(cx, cz, e.position.x, e.position.z) < 3) {
      e.userData.hp -= 55;
      e.userData.hitFlash = 0.3;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, 55, 'cast');
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnMagicParticles(cx, cz, 0xff8030);
}

function playerUlt() {
  if (App.attackCd.ult > 0 || App.hud.mana < 40) return;
  App.hud.mana -= 40;
  App.attackCd.ult = 4;
  const p = App.player;
  if (!p) return;
  for (const e of Array.from(App.enemies)) {
    const d = dist(p.position.x, p.position.z, e.position.x, e.position.z);
    if (d < 8) {
      e.userData.hp -= 120;
      e.userData.hitFlash = 0.4;
      const dx = e.position.x - p.position.x;
      const dz = e.position.z - p.position.z;
      const dd = Math.hypot(dx, dz) || 1;
      e.userData.vel.x += (dx/dd) * 20;
      e.userData.vel.z += (dz/dd) * 20;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, 120, 'ult');
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnUltBurst(p.position);
  showToast('РАЗЛОМ ОТКРЫТ', 'magic');
}

function playerDash() {
  if (App.attackCd.dash > 0) return;
  App.attackCd.dash = 1.5;
  const p = App.player;
  if (!p) return;
  const facing = p.rotation.y;
  const dir = new THREE.Vector3(Math.sin(facing), 0, Math.cos(facing));
  p.position.x += dir.x * 4;
  p.position.z += dir.z * 4;
  spawnMagicParticles(p.position.x, p.position.z, 0x7cd9ff);
}

function playerHeal() {
  if (App.attackCd.heal > 0 || App.hud.mana < 25) return;
  App.hud.mana -= 25;
  App.attackCd.heal = 3;
  App.hud.hp = Math.min(App.hud.maxHp, App.hud.hp + 40);
  showToast('+40 HP', 'good');
  const p = App.player;
  if (p) spawnMagicParticles(p.position.x, p.position.z, 0x7cffb0);
}

function spawnHitParticles(pos, big) {
  if (!App.gameScene) return;
  const n = big ? 22 : 12;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(2, 6);
    const geo = new THREE.SphereGeometry(rand(0.04, 0.1), 5, 4);
    const mat = new THREE.MeshBasicMaterial({
      color: Math.random() < 0.5 ? 0xffc879 : 0xff6060,
      transparent: true, opacity: 0.95,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(pos.x, rand(0.5, 1.2), pos.z);
    pt.userData.vx = Math.cos(a) * s;
    pt.userData.vz = Math.sin(a) * s;
    pt.userData.vy = rand(1, 4);
    pt.userData.life = rand(0.4, 0.9);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function spawnMagicParticles(cx, cz, color) {
  if (!App.gameScene) return;
  for (let i = 0; i < 25; i++) {
    const a = rand(0, TAU);
    const r = rand(0.2, 0.6);
    const geo = new THREE.SphereGeometry(rand(0.05, 0.14), 6, 5);
    const mat = new THREE.MeshBasicMaterial({
      color: color || 0xb85aff, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(cx + Math.cos(a)*r, rand(0.5, 1.5), cz + Math.sin(a)*r);
    pt.userData.vx = Math.cos(a)*rand(3, 8);
    pt.userData.vz = Math.sin(a)*rand(3, 8);
    pt.userData.vy = rand(2, 6);
    pt.userData.life = rand(0.5, 1.2);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function spawnUltBurst(pos) {
  if (!App.gameScene) return;
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU);
    const elev = rand(-0.5, 1);
    const s = rand(6, 18);
    const geo = new THREE.SphereGeometry(rand(0.06, 0.18), 6, 5);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(rand(0.75, 0.95), 0.9, 0.65),
      transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(pos.x, rand(0.5, 1.5), pos.z);
    pt.userData.vx = Math.cos(a) * s;
    pt.userData.vz = Math.sin(a) * s;
    pt.userData.vy = elev * s;
    pt.userData.life = rand(0.8, 1.6);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function updateParticles(dt) {
  if (!App.gameScene) return;
  const keep = [];
  for (const pt of App.particles) {
    pt.userData.life -= dt;
    if (pt.userData.life <= 0) {
      App.gameScene.remove(pt);
      if (pt.geometry) pt.geometry.dispose();
      if (pt.material) pt.material.dispose();
      continue;
    }
    pt.position.x += pt.userData.vx * dt;
    pt.position.z += pt.userData.vz * dt;
    pt.position.y += pt.userData.vy * dt;
    pt.userData.vy -= 9.8 * dt * 0.5;
    pt.userData.vx *= Math.pow(0.1, dt);
    pt.userData.vz *= Math.pow(0.1, dt);
    const t = pt.userData.life / pt.userData.maxLife;
    pt.material.opacity = t;
    pt.scale.setScalar(0.4 + t*0.6);
    keep.push(pt);
  }
  App.particles = keep;
}
function showDamageNumber(pos, dmg, kind) {
  if (!App.gameScene) return;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 42px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  let color = '#ffffff';
  if (kind === 'heavy') color = '#ffd88a';
  else if (kind === 'cast') color = '#ffb060';
  else if (kind === 'ult') color = '#ff80d0';
  ctx.strokeText('-' + Math.round(dmg), 64, 32);
  ctx.fillStyle = color;
  ctx.fillText('-' + Math.round(dmg), 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.position.set(pos.x, pos.y + 1.6, pos.z);
  sprite.scale.set(1.5, 0.75, 1);
  sprite.userData.vy = 2.2;
  sprite.userData.life = 1.0;
  sprite.userData.maxLife = 1.0;
  sprite.userData.isFloat = true;
  sprite.userData.vx = 0;
  sprite.userData.vz = 0;
  App.gameScene.add(sprite);
  App.particles.push(sprite);
}

// ---------------------------------------------------------------------------
// INPUT — Virtual Joystick + buttons
// ---------------------------------------------------------------------------
function initInput() {
  const joystick = $('joystick');
  const knob = $('joyKnob');
  const canvas = $('gameCanvas');

  const joyState = { active: false, pointerId: null, cx: 0, cy: 0, maxR: 60 };
  const joyMove = (dx, dy) => {
    const d = Math.hypot(dx, dy);
    let nx = dx, ny = dy;
    if (d > joyState.maxR) {
      nx = (dx/d) * joyState.maxR;
      ny = (dy/d) * joyState.maxR;
    }
    if (knob) knob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    const mag = Math.hypot(nx, ny) / joyState.maxR;
    if (mag < 0.15) {
      App.playerInput.moveX = 0; App.playerInput.moveY = 0;
    } else {
      App.playerInput.moveX = nx / joyState.maxR;
      App.playerInput.moveY = ny / joyState.maxR;
    }
  };

  const onDown = (e) => {
    if (joyState.active) return;
    if (e.clientX > window.innerWidth * 0.55) return;
    joyState.active = true;
    joyState.pointerId = e.pointerId;
    joyState.cx = e.clientX;
    joyState.cy = e.clientY;
    if (joystick) {
      joystick.style.left = e.clientX + 'px';
      joystick.style.top = e.clientY + 'px';
      joystick.classList.add('active');
    }
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!joyState.active || joyState.pointerId !== e.pointerId) return;
    joyMove(e.clientX - joyState.cx, e.clientY - joyState.cy);
    e.preventDefault();
  };
  const onUp = (e) => {
    if (joyState.pointerId !== e.pointerId) return;
    joyState.active = false;
    joyState.pointerId = null;
    App.playerInput.moveX = 0; App.playerInput.moveY = 0;
    if (joystick) joystick.classList.remove('active');
    if (knob) knob.style.transform = 'translate(-50%, -50%)';
    try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
  };
  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp, { passive: false });
  canvas.addEventListener('pointercancel', onUp, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Action buttons
  const btnAttack = $('btnAttack');
  const btnCast = $('btnCast');
  const btnUlt = $('btnUlt');
  const btnDash = $('btnDash');
  const btnHeal = $('btnHeal');

  if (btnAttack) {
    let holdTimer = null;
    btnAttack.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      playerAttack('light');
      holdTimer = setTimeout(() => playerAttack('heavy'), 220);
    }, { passive: false });
    const clear = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    btnAttack.addEventListener('pointerup', clear);
    btnAttack.addEventListener('pointercancel', clear);
    btnAttack.addEventListener('pointerleave', clear);
  }
  if (btnCast) btnCast.addEventListener('pointerdown', (e) => { e.preventDefault(); playerCast(); }, { passive: false });
  if (btnUlt) btnUlt.addEventListener('pointerdown', (e) => { e.preventDefault(); playerUlt(); }, { passive: false });
  if (btnDash) btnDash.addEventListener('pointerdown', (e) => { e.preventDefault(); playerDash(); }, { passive: false });
  if (btnHeal) btnHeal.addEventListener('pointerdown', (e) => { e.preventDefault(); playerHeal(); }, { passive: false });

  // Keyboard (desktop)
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') App.playerInput.moveY = -1;
    if (k === 's' || k === 'arrowdown') App.playerInput.moveY = 1;
    if (k === 'a' || k === 'arrowleft') App.playerInput.moveX = -1;
    if (k === 'd' || k === 'arrowright') App.playerInput.moveX = 1;
    if (k === ' ') { e.preventDefault(); playerAttack('light'); }
    if (k === 'e') playerCast();
    if (k === 'q') playerUlt();
    if (k === 'shift') playerDash();
    if (k === 'f') playerHeal();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') App.playerInput.moveY = 0;
    if (k === 's' || k === 'arrowdown') App.playerInput.moveY = 0;
    if (k === 'a' || k === 'arrowleft') App.playerInput.moveX = 0;
    if (k === 'd' || k === 'arrowright') App.playerInput.moveX = 0;
  });
}

// ---------------------------------------------------------------------------
// RACE SELECTION UI
// ---------------------------------------------------------------------------
function buildRaceUI() {
  const list = $('raceList');
  if (!list) return;
  list.innerHTML = '';
  for (const race of RACES) {
    const card = document.createElement('div');
    card.className = 'race-card';
    card.dataset.raceId = race.id;
    card.innerHTML = `
      <div class="rc-name">${race.name}</div>
      <div class="rc-desc">${race.desc}</div>
      <div class="rc-tag">${race.tag}</div>
    `;
    card.addEventListener('click', () => selectRace(race.id));
    list.appendChild(card);
  }
  selectRace(App.currentRace);
}

function selectRace(raceId) {
  App.currentRace = raceId;
  const race = RACES.find(r => r.id === raceId);
  if (!race) return;
  document.querySelectorAll('.race-card').forEach((el) => {
    el.classList.toggle('active', el.dataset.raceId === raceId);
  });
  const setStat = (id, barId, val) => {
    const el = $(id), bar = $(barId);
    if (el) el.textContent = String(val);
    if (bar) bar.style.width = (val / 15 * 100) + '%';
  };
  setStat('statStr','barStr', race.stats.str);
  setStat('statAgi','barAgi', race.stats.agi);
  setStat('statInt','barInt', race.stats.int);
  setStat('statEth','barEth', race.stats.eth);
  rebuildMenuCharacter();
}

// ---------------------------------------------------------------------------
// RESIZE
// ---------------------------------------------------------------------------
function handleResize() {
  const w = innerWidth, h = innerHeight;
  if (App.menuRenderer && App.menuCamera) {
    App.menuRenderer.setSize(w, h, false);
    App.menuCamera.aspect = w/Math.max(h,1);
    App.menuCamera.updateProjectionMatrix();
    if (App.menuComposer) App.menuComposer.setSize(w, h);
  }
  if (App.gameRenderer && App.gameCamera) {
    App.gameRenderer.setSize(w, h, false);
    App.gameCamera.aspect = w/Math.max(h,1);
    App.gameCamera.updateProjectionMatrix();
    if (App.gameComposer) App.gameComposer.setSize(w, h);
  }
}
window.addEventListener('resize', handleResize, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(handleResize, 150), { passive: true });

// ---------------------------------------------------------------------------
// TRANSITION: MENU → GAME
// ---------------------------------------------------------------------------
async function enterGame() {
  const btnPlay = $('btnPlay');
  const label = $('btnPlayLabel');
  if (btnPlay) btnPlay.classList.add('loading');
  if (label) label.textContent = 'СОЗДАНИЕ РАЗЛОМА…';

  stopMenuLoop();
  const menuEl = $('menu'); if (menuEl) menuEl.style.display = 'none';
  const menuCanvas = $('menuCanvas'); if (menuCanvas) menuCanvas.style.display = 'none';
  const vigMenu = $('vigMenu'); if (vigMenu) vigMenu.style.display = 'none';

  const gameEl = $('game'); if (gameEl) gameEl.classList.add('active');
  const gameCanvas = $('gameCanvas'); if (gameCanvas) gameCanvas.style.display = 'block';
  const vigGame = $('vigGame'); if (vigGame) vigGame.style.display = 'block';

  // Rebuild player with chosen race
  if (App.gameScene && App.player) {
    App.gameScene.remove(App.player);
    App.player.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
        else o.material.dispose();
      }
    });
    buildPlayer(App.gameScene);
  }

  handleResize();
  if (App.gameClock) App.gameClock.getDelta();
  startGameLoop();
  setTimeout(() => showToast('ДОБРО ПОЖАЛОВАТЬ В AETHELGARD', 'magic'), 500);
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
async function boot() {
  const setLoader = (pct, text) => {
    const f = $('loaderBarFill'); if (f) f.style.width = pct + '%';
    const pe = $('loaderPercent'); if (pe) pe.textContent = pct + '%';
    const st = $('loaderStatus'); if (st) st.textContent = text;
  };

  try {
    setLoader(5, 'Проверка WebGL…');
    await new Promise(r => setTimeout(r, 100));
    const test = document.createElement('canvas');
    if (!test.getContext('webgl2') && !test.getContext('webgl')) {
      throw new Error('WebGL не поддерживается');
    }

    setLoader(15, 'Инициализация Three.js…');
    await new Promise(r => setTimeout(r, 80));

    setLoader(35, 'Генерация меню…');
    buildMenuScene();
    await new Promise(r => setTimeout(r, 80));

    setLoader(65, 'Генерация мира…');
    buildGameScene();
    await new Promise(r => setTimeout(r, 80));

    setLoader(85, 'Разогрев шейдеров…');
    if (App.menuRenderer && App.menuScene && App.menuCamera) {
      App.menuRenderer.compile(App.menuScene, App.menuCamera);
    }
    if (App.gameRenderer && App.gameScene && App.gameCamera) {
      App.gameRenderer.compile(App.gameScene, App.gameCamera);
    }
    await new Promise(r => setTimeout(r, 150));

    setLoader(100, 'Готово!');

    buildRaceUI();
    initInput();

    const startBtn = $('loaderStart');
    if (startBtn) {
      startBtn.classList.add('ready');
      startBtn.addEventListener('click', () => {
        const l = $('loader'); if (l) l.classList.add('hide');
        setTimeout(() => {
          const m = $('menu'); if (m) m.style.display = 'block';
          handleResize();
          if (App.menuClock) App.menuClock.getDelta();
          startMenuLoop();
        }, 400);
      });
    }

    const btnPlay = $('btnPlay');
    if (btnPlay) btnPlay.addEventListener('click', () => enterGame().catch(e => console.error(e)));

    console.log('[Apex] Boot complete');
  } catch(e) {
    console.error('[Apex] Boot failed:', e);
    const st = $('loaderStatus'); if (st) st.textContent = 'Ошибка: ' + (e.message || 'неизвестно');
    const rt = $('loaderRetry'); if (rt) rt.style.display = 'inline-block';
  }
}

// Visibility: pause when hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopMenuLoop();
    stopGameLoop();
  } else {
    const gameEl = $('game');
    if (gameEl && gameEl.classList.contains('active')) {
      if (App.gameClock) App.gameClock.getDelta();
      startGameLoop();
    } else {
      const menuEl = $('menu');
      if (menuEl && menuEl.style.display !== 'none') {
        if (App.menuClock) App.menuClock.getDelta();
        startMenuLoop();
      }
    }
  }
}, { passive: true });

// GLOBAL ERROR HANDLERS
window.addEventListener('error', (e) => console.error('[Apex] global:', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => console.error('[Apex] promise:', e.reason));

boot();
</script>
