  const stallDefs = [
    { x:-3, z:-5.5, rot:0, type:'potion', color:0x4a9e4a },
    { x:3,  z:-5.5, rot:0, type:'weapon', color:0xff6030 },
    { x:-3, z:5.5,  rot:Math.PI, type:'armor', color:0x4a5aa0 },
    { x:3,  z:5.5,  rot:Math.PI, type:'runes', color:0xa04ad0 },
  ];
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2f1a, roughness: 0.85 });
  for (const sp of stallDefs) {
    const sx = c.x + sp.x, sz = c.z + sp.z;
    const stall = new THREE.Group();
    const counter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 1.0), woodMat);
    counter.position.y = 0.35;
    counter.castShadow = true;
    counter.receiveShadow = true;
    stall.add(counter);
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.12, 1.6),
      new THREE.MeshStandardMaterial({ color: sp.color, roughness: 0.9 })
    );
    canopy.position.y = 2.0;
    stall.add(canopy);
    for (const px of [-1, 1]) for (const pz of [-0.5, 0.5]) {
      const p = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.045, 2.0, 6),
        woodMat
      );
      p.position.set(px, 1.0, pz);
      stall.add(p);
    }
    // Goods
    for (let k = 0; k < 3; k++) {
      const item = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 6),
        new THREE.MeshStandardMaterial({
          color: sp.color, emissive: sp.color, emissiveIntensity: 0.5,
        })
      );
      item.position.set((k-1)*0.4, 0.8, 0);
      stall.add(item);
    }
    stall.position.set(sx, 0, sz);
    stall.rotation.y = sp.rot;
    city.add(stall);
    App.stallPositions.push({ x: sx, z: sz, type: sp.type });
  }

  scene.add(city);
}

function buildNPCs(scene) {
  const types = [
    { id:'potion', name:'Аптекарь Линэль', emoji:'🧝‍♀️', text:'Зелья хранят жизнь.' },
    { id:'weapon', name:'Кузнец Борн', emoji:'🧔', text:'Сталь не лжёт.' },
    { id:'armor', name:'Бронник Мирра', emoji:'🛡️', text:'Броня — вторая кожа.' },
    { id:'runes', name:'Рунослов Тейн', emoji:'🧙', text:'Руны помнят древнее.' },
  ];
  App.npcs = [];
  if (!App.stallPositions) return;
  for (let i = 0; i < App.stallPositions.length; i++) {
    const sp = App.stallPositions[i];
    const t = types.find(x => x.id === sp.type) || types[0];
    const npc = Humanoid.build(RACES[i % RACES.length]);
    npc.scale.setScalar(0.95);
    npc.userData.baseScale = 0.95;
    npc.position.set(sp.x, 0, sp.z + 1.4);
    npc.rotation.y = Math.PI;
    npc.userData.isNPC = true;
    npc.userData.dialog = { ...t };
    scene.add(npc);
    App.npcs.push(npc);
  }
}

function buildPlayer(scene) {
  const race = RACES.find(r => r.id === App.currentRace) || RACES[0];
  const g = Humanoid.build(race);
  g.position.set(0, 0, 0);
  g.userData.baseScale = 1.0;
  g.userData.vel = { x: 0, z: 0 };
  g.userData.hitFlash = 0;
  scene.add(g);
  App.player = g;
  console.log('[Game] Player built:', race.name);
}

function spawnEnemy(scene) {
  const a = rand(0, TAU);
  const r = rand(20, 40);
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  if (dist(x, z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius + 5) return;

  const baseRace = RACES[1];
  const mutantRace = {
    ...baseRace,
    id: 'mutant',
    color: 0xff2020,
    accent: 0xff4040,
    skin: [90, 40, 40],
    cloth: 0x2a0a0a,
    metal: [70, 30, 30],
    hairColor: 0x1a0505,
    hairStyle: 'mohawk',
  };
  const e = Humanoid.build(mutantRace);
  e.position.set(x, 0, z);
  e.userData.baseScale = 1.05;
  e.scale.setScalar(1.05);
  e.userData.isEnemy = true;
  e.userData.hp = 55;
  e.userData.maxHp = 55;
  e.userData.speed = rand(1.8, 2.8);
  e.userData.damage = 8;
  e.userData.attackCd = 0;
  e.userData.hitFlash = 0;
  e.userData.vel = { x: 0, z: 0 };
  e.userData.phase = rand(0, TAU);
  // Spikes
  for (let i = 0; i < 3; i++) {
    const spike = new THREE.Mesh(
      new THREE.ConeGeometry(0.028, 0.12 - i*0.02, 5),
      new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.7, metalness: 0.4 })
    );
    spike.position.set(0, 1.45 - i*0.09, -0.19);
    spike.rotation.x = -0.5;
    e.add(spike);
  }
  scene.add(e);
  App.enemies.push(e);
}

function buildRain(scene) {
  const count = 500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vel = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3+0] = rand(-30, 30);
    pos[i*3+1] = rand(0, 35);
    pos[i*3+2] = rand(-30, 30);
    vel[i] = rand(20, 30);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const rain = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.14, color: 0xaaccff,
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  rain.userData.vel = vel;
  scene.add(rain);
  App.rain = rain;
}

// ---------------------------------------------------------------------------
// GAME LOOP
// ---------------------------------------------------------------------------
function startGameLoop() {
  if (App.gameRafId !== null) return;
  const loop = () => {
    App.gameRafId = requestAnimationFrame(loop);
    try {
      if (!App.gameClock || !App.gameScene || !App.gameCamera) return;
      const dt = Math.min(App.gameClock.getDelta(), 0.05);
      App.time += dt;

      updateDayNight(dt);
      updateWeather(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateNPCs(dt);
      updateParticles(dt);
      updateCamera(dt);
      updateGrass(dt);
      updateCd(dt);

      if (App.player && App.gameKeyLight) {
        App.gameKeyLight.target.position.copy(App.player.position);
        App.gameKeyLight.position.set(
          App.player.position.x + 15, 25, App.player.position.z + 10
        );
      }

      updateHUD(dt);
      updateMinimap();

      let rendered = false;
      if (App.gameComposer) {
        try { App.gameComposer.render(); rendered = true; }
        catch(e) {
          console.warn('[Game] Composer render failed:', e);
          App.gameComposer = null;
        }
      }
      if (!rendered) {
        App.gameRenderer.render(App.gameScene, App.gameCamera);
      }
    } catch(e) { console.error('[GameLoop]', e); }
  };
  loop();
}
function stopGameLoop() {
  if (App.gameRafId !== null) {
    cancelAnimationFrame(App.gameRafId);
    App.gameRafId = null;
  }
}

function updateDayNight(dt) {
  App.dayTime = (App.dayTime + dt/240) % 1;
  const elev = Math.sin((App.dayTime - 0.25) * TAU) * 90;
  const f = clamp(elev/60 + 0.2, 0, 1);
  if (App.gameKeyLight) {
    App.gameKeyLight.intensity = 0.3 + f * 3.0;
    App.gameKeyLight.color.setHSL(lerp(0.07, 0.13, f), 0.75, lerp(0.45, 0.75, f));
  }
  App.gameRenderer.toneMappingExposure = lerp(0.6, 1.1, f);
  if (App.gameFog) {
    const c = new THREE.Color();
    c.setHSL(lerp(0.62, 0.08, f), 0.5, lerp(0.15, 0.6, f));
    App.gameFog.color.copy(c);
    App.gameScene.background.copy(c);
  }
}

function updateWeather(dt) {
  if (Math.random() < dt/50) {
    App.weather.targetRain = Math.random() < 0.35 ? 1 : 0;
  }
  App.weather.rain = lerp(App.weather.rain, App.weather.targetRain, 1-Math.pow(0.005, dt));
  if (App.rain) {
    App.rain.material.opacity = App.weather.rain * 0.7;
    const p = App.rain.geometry.attributes.position;
    const vel = App.rain.userData.vel;
    const cam = App.gameCamera;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i) - vel[i]*dt;
      if (y < 0) {
        y = rand(25, 35);
        p.setX(i, cam.position.x + rand(-20, 20));
        p.setZ(i, cam.position.z + rand(-20, 20));
      }
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }
}

function isInCity() {
  const p = App.player;
  if (!p) return false;
  return dist(p.position.x, p.position.z, App.cityCenter.x, App.cityCenter.z) < App.cityRadius - 2;
}

function updatePlayer(dt) {
  const p = App.player;
  if (!p) return;
  p.userData.hitFlash = Math.max(0, p.userData.hitFlash - dt);
  const speed = 5.5;
  const tx = App.playerInput.moveX * speed;
  const tz = App.playerInput.moveY * speed;
  p.userData.vel.x = lerp(p.userData.vel.x, tx, 1 - Math.pow(0.001, dt));
  p.userData.vel.z = lerp(p.userData.vel.z, tz, 1 - Math.pow(0.001, dt));
  p.position.x += p.userData.vel.x * dt;
  p.position.z += p.userData.vel.z * dt;

  const mag = Math.hypot(App.playerInput.moveX, App.playerInput.moveY);
  if (mag > 0.1) {
    const tf = Math.atan2(App.playerInput.moveX, App.playerInput.moveY);
    let diff = tf - p.rotation.y;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    p.rotation.y += diff * (1 - Math.pow(0.0001, dt));
  }
  p.position.x = clamp(p.position.x, -90, 90);
  p.position.z = clamp(p.position.z, -90, 90);
  Humanoid.animateIdle(p, dt, { baseScale: 1.0 });
}

function updateEnemies(dt) {
  const p = App.player;
  if (!p) return;
  for (let i = App.enemies.length-1; i >= 0; i--) {
    const e = App.enemies[i];
    if (!e || e.userData.hp <= 0) continue;
    e.userData.attackCd = Math.max(0, e.userData.attackCd - dt);
    e.userData.hitFlash = Math.max(0, e.userData.hitFlash - dt);

    if (isInCity()) {
      const away = Math.atan2(e.position.x - App.cityCenter.x, e.position.z - App.cityCenter.z);
      e.userData.vel.x = lerp(e.userData.vel.x, Math.sin(away)*3, 1-Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, Math.cos(away)*3, 1-Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      Humanoid.animateIdle(e, dt, { baseScale: 1.05 });
      continue;
    }

    const dx = p.position.x - e.position.x;
    const dz = p.position.z - e.position.z;
    const d = Math.hypot(dx, dz);
    if (d > 1.2 && d < 13) {
      const nx = dx/d, nz = dz/d;
      e.userData.vel.x = lerp(e.userData.vel.x, nx*e.userData.speed, 1-Math.pow(0.01, dt));
      e.userData.vel.z = lerp(e.userData.vel.z, nz*e.userData.speed, 1-Math.pow(0.01, dt));
      e.position.x += e.userData.vel.x * dt;
      e.position.z += e.userData.vel.z * dt;
      const tf = Math.atan2(nx, nz);
      let diff = tf - e.rotation.y;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      e.rotation.y += diff * (1-Math.pow(0.001, dt));
    } else if (d <= 1.5 && e.userData.attackCd <= 0) {
      e.userData.attackCd = 1.3;
      App.hud.hp = Math.max(0, App.hud.hp - e.userData.damage);
      p.userData.hitFlash = 0.25;
      const fl = $('dmgFlash');
      if (fl) { fl.classList.add('hit'); setTimeout(()=>fl.classList.remove('hit'), 130); }
      if (App.hud.hp <= 0) respawnPlayer();
    }
    Humanoid.animateIdle(e, dt, { baseScale: 1.05 });
  }
}

function respawnPlayer() {
  const p = App.player;
  if (!p) return;
  p.position.set(App.cityCenter.x, 0, App.cityCenter.z + 5);
  App.hud.hp = App.hud.maxHp;
  App.hud.mana = App.hud.maxMana;
  showToast('ВОЗРОЖДЕНИЕ У ОБЕЛИСКА');
}

function updateNPCs(dt) {
  for (const npc of App.npcs) {
    Humanoid.animateIdle(npc, dt, { baseScale: 0.95 });
  }
}

function updateParticles(dt) {
  if (!App.gameScene) return;
  const keep = [];
  for (const pt of App.particles) {
    pt.userData.life -= dt;
    if (pt.userData.life <= 0) {
      App.gameScene.remove(pt);
      if (pt.geometry) pt.geometry.dispose();
      if (pt.material) pt.material.dispose();
      continue;
    }
    pt.position.x += pt.userData.vx * dt;
    pt.position.z += pt.userData.vz * dt;
    pt.position.y += pt.userData.vy * dt;
    pt.userData.vy -= 9.8 * dt * 0.5;
    pt.userData.vx *= Math.pow(0.1, dt);
    pt.userData.vz *= Math.pow(0.1, dt);
    const t = pt.userData.life / pt.userData.maxLife;
    pt.material.opacity = t;
    pt.scale.setScalar(0.4 + t*0.6);
    keep.push(pt);
  }
  App.particles = keep;
}

function updateGrass(dt) {
  if (!App.grass || !App.player) return;
  const m = App.grass.material;
  if (m && m.userData && m.userData.shader) {
    m.userData.shader.uniforms.uTime.value = App.time;
    m.userData.shader.uniforms.uPlayerPos.value.copy(App.player.position);
  }
}

function updateCamera(dt) {
  const p = App.player;
  if (!p || !App.gameCamera) return;
  const cam = App.gameCamera;

  const enemiesNear = App.enemies.some(e => dist(e.position.x, e.position.z, p.position.x, p.position.z) < 8);
  let targetMode = 'idle';
  if (enemiesNear && !isInCity()) targetMode = 'combat';
  else if (isInCity()) targetMode = 'city';
  if (targetMode !== App.cameraMode) App.cameraMode = targetMode;

  let camDist = 7, camHeight = 4.5, camLookY = 1.0;
  if (App.cameraMode === 'combat') { camDist = 5.5; camHeight = 3.8; camLookY = 1.2; }
  else if (App.cameraMode === 'city') { camDist = 8.5; camHeight = 5.0; camLookY = 1.3; }

  cam.position.x = lerp(cam.position.x, p.position.x, 1 - Math.pow(0.0008, dt));
  cam.position.z = lerp(cam.position.z, p.position.z + camDist, 1 - Math.pow(0.0008, dt));
  cam.position.y = lerp(cam.position.y, camHeight, 1 - Math.pow(0.002, dt));
  cam.lookAt(p.position.x, camLookY, p.position.z);

  if (p.userData.hitFlash > 0) {
    const s = p.userData.hitFlash * 15;
    cam.position.x += rand(-s, s) * 0.02;
    cam.position.y += rand(-s, s) * 0.02;
  }
}

function updateHUD(dt) {
  const hpLbl = $('orbHpLbl'), manaLbl = $('orbManaLbl');
  const uiLevel = $('uiLevel'), uiTime = $('uiTime');
  const uiZone = $('uiZone'), uiGold = $('uiGold');
  if (hpLbl) hpLbl.textContent = String(Math.round(App.hud.hp));
  if (manaLbl) manaLbl.textContent = String(Math.round(App.hud.mana));
  if (uiLevel) uiLevel.textContent = String(App.hud.level);
  if (uiGold) uiGold.textContent = String(Math.floor(App.hud.gold));
  if (uiTime) {
    const h = Math.floor(App.dayTime*24);
    const m = Math.floor((App.dayTime*24-h)*60);
    uiTime.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  if (uiZone) {
    uiZone.textContent = isInCity() ? 'Тихий Причал' : 'Лес Шепчущих';
  }
  App.hud.mana = clamp(App.hud.mana + 5*dt, 0, App.hud.maxMana);
  if (isInCity()) App.hud.hp = clamp(App.hud.hp + 6*dt, 0, App.hud.maxHp);
}

function updateMinimap() {
  const ctx = App.minimapCtx;
  const canvas = $('minimap');
  if (!ctx || !canvas || !App.player) return;
  const W = canvas.width, H = canvas.height;
  const p = App.player;
  const range = 55;
  ctx.clearRect(0,0,W,H);
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
  bg.addColorStop(0, 'rgba(20,30,60,.85)');
  bg.addColorStop(1, 'rgba(5,8,20,.95)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  const cxs = W/2 + ((App.cityCenter.x - p.position.x)/range)*(W/2);
  const cys = H/2 + ((App.cityCenter.z - p.position.z)/range)*(H/2);
  const cR = (App.cityRadius/range)*(W/2);
  ctx.fillStyle = 'rgba(124,217,255,.15)';
  ctx.strokeStyle = 'rgba(124,217,255,.6)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cxs, cys, cR, 0, TAU); ctx.fill(); ctx.stroke();

  for (const n of App.npcs) {
    const nx = W/2 + ((n.position.x - p.position.x)/range)*(W/2);
    const ny = H/2 + ((n.position.z - p.position.z)/range)*(H/2);
    ctx.fillStyle = '#ffe7b0';
    ctx.beginPath(); ctx.arc(nx, ny, 4, 0, TAU); ctx.fill();
  }
  for (const e of App.enemies) {
    const ex = W/2 + ((e.position.x - p.position.x)/range)*(W/2);
    const ey = H/2 + ((e.position.z - p.position.z)/range)*(H/2);
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, TAU); ctx.fill();
  }
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(p.rotation.y);
  ctx.fillStyle = '#7cd9ff';
  ctx.beginPath();
  ctx.moveTo(0, -10); ctx.lineTo(6, 7); ctx.lineTo(0, 4); ctx.lineTo(-6, 7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function updateCd(dt) {
  for (const k of Object.keys(App.attackCd)) {
    App.attackCd[k] = Math.max(0, App.attackCd[k] - dt);
  }
}

// ---------------------------------------------------------------------------
// COMBAT
// ---------------------------------------------------------------------------
function playerAttack(type) {
  const p = App.player;
  if (!p) return;
  const cdKey = type === 'heavy' ? 'heavy' : 'light';
  if (App.attackCd[cdKey] > 0) return;
  App.attackCd[cdKey] = type === 'heavy' ? 0.65 : 0.35;

  const ad = p.userData.armData;
  if (ad && ad.right) {
    const orig = ad.right.rotation.x;
    ad.right.rotation.x = -1.2;
    setTimeout(() => { if (ad.right) ad.right.rotation.x = orig; }, 180);
  }

  const range = type === 'heavy' ? 3.0 : 2.2;
  const facing = p.rotation.y;
  for (const e of App.enemies) {
    if (!e || e.userData.hp <= 0) continue;
    const dx = e.position.x - p.position.x;
    const dz = e.position.z - p.position.z;
    const d = Math.hypot(dx, dz);
    if (d > range) continue;
    const ang = Math.atan2(dx, dz);
    let diff = ang - facing;
    while (diff > Math.PI) diff -= TAU;
    while (diff < -Math.PI) diff += TAU;
    if (Math.abs(diff) > 1.4) continue;
    const dmg = type === 'heavy' ? 40 : 20;
    e.userData.hp -= dmg;
    e.userData.hitFlash = 0.25;
    e.userData.vel.x += (dx/d) * 5;
    e.userData.vel.z += (dz/d) * 5;
    spawnHitParticles(e.position, type === 'heavy');
    showDamageNumber(e.position, dmg, type === 'heavy' ? 'heavy' : 'slash');
    if (e.userData.hp <= 0) killEnemy(e);
  }
}

function killEnemy(e) {
  const i = App.enemies.indexOf(e);
  if (i >= 0) App.enemies.splice(i, 1);
  if (App.gameScene) App.gameScene.remove(e);
  e.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  App.hud.xp += 25;
  App.hud.gold += randi(3, 12);
  if (App.hud.xp >= 100) {
    App.hud.xp -= 100;
    App.hud.level++;
    App.hud.maxHp += 15; App.hud.hp = App.hud.maxHp;
    App.hud.maxMana += 10; App.hud.mana = App.hud.maxMana;
    showToast('УРОВЕНЬ ' + App.hud.level, 'magic');
  }
  setTimeout(() => {
    if (App.gameRafId !== null && App.gameScene) spawnEnemy(App.gameScene);
  }, 3000);
}

function playerCast() {
  if (App.attackCd.cast > 0 || App.hud.mana < 15) return;
  App.hud.mana -= 15;
  App.attackCd.cast = 0.8;
  const p = App.player;
  if (!p || !App.gameScene) return;
  const facing = p.rotation.y;
  const cx = p.position.x + Math.sin(facing) * 3;
  const cz = p.position.z + Math.cos(facing) * 3;

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0xff8030, transparent: true, opacity: 0.95 })
  );
  sphere.position.set(cx, 1.2, cz);
  App.gameScene.add(sphere);
  const startTime = App.time;
  const tick = () => {
    if (!sphere.parent) return;
    const t = (App.time - startTime) / 0.5;
    if (t >= 1) {
      App.gameScene.remove(sphere);
      sphere.geometry.dispose();
      sphere.material.dispose();
      return;
    }
    sphere.scale.setScalar(1 + t*2);
    requestAnimationFrame(tick);
  };
  tick();

  for (const e of App.enemies) {
    if (dist(cx, cz, e.position.x, e.position.z) < 3) {
      e.userData.hp -= 50;
      e.userData.hitFlash = 0.3;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, 50, 'cast');
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnMagicParticles(cx, cz, 0xff8030);
}

function playerUlt() {
  if (App.attackCd.ult > 0 || App.hud.mana < 40) return;
  App.hud.mana -= 40;
  App.attackCd.ult = 4;
  const p = App.player;
  if (!p) return;
  for (const e of Array.from(App.enemies)) {
    if (dist(p.position.x, p.position.z, e.position.x, e.position.z) < 8) {
      e.userData.hp -= 110;
      e.userData.hitFlash = 0.4;
      spawnHitParticles(e.position, true);
      showDamageNumber(e.position, 110, 'ult');
      if (e.userData.hp <= 0) killEnemy(e);
    }
  }
  spawnMagicParticles(p.position.x, p.position.z, 0xb85aff);
  showToast('РАЗЛОМ ОТКРЫТ', 'magic');
}

function playerDash() {
  if (App.attackCd.dash > 0) return;
  App.attackCd.dash = 1.5;
  const p = App.player;
  if (!p) return;
  const facing = p.rotation.y;
  p.position.x += Math.sin(facing) * 4;
  p.position.z += Math.cos(facing) * 4;
  spawnMagicParticles(p.position.x, p.position.z, 0x7cd9ff);
}

function spawnHitParticles(pos, big) {
  if (!App.gameScene) return;
  const n = big ? 16 : 8;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const s = rand(2, 5);
    const geo = new THREE.SphereGeometry(rand(0.04, 0.1), 5, 4);
    const mat = new THREE.MeshBasicMaterial({
      color: Math.random() < 0.5 ? 0xffc879 : 0xff6060,
      transparent: true, opacity: 0.95,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(pos.x, rand(0.5, 1.2), pos.z);
    pt.userData.vx = Math.cos(a) * s;
    pt.userData.vz = Math.sin(a) * s;
    pt.userData.vy = rand(1, 4);
    pt.userData.life = rand(0.4, 0.9);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function spawnMagicParticles(cx, cz, color) {
  if (!App.gameScene) return;
  for (let i = 0; i < 20; i++) {
    const a = rand(0, TAU);
    const r = rand(0.2, 0.6);
    const geo = new THREE.SphereGeometry(rand(0.05, 0.14), 6, 5);
    const mat = new THREE.MeshBasicMaterial({
      color: color || 0xb85aff, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending,
    });
    const pt = new THREE.Mesh(geo, mat);
    pt.position.set(cx + Math.cos(a)*r, rand(0.5, 1.5), cz + Math.sin(a)*r);
    pt.userData.vx = Math.cos(a)*rand(3, 8);
    pt.userData.vz = Math.sin(a)*rand(3, 8);
    pt.userData.vy = rand(2, 6);
    pt.userData.life = rand(0.5, 1.2);
    pt.userData.maxLife = pt.userData.life;
    App.gameScene.add(pt);
    App.particles.push(pt);
  }
}
function showDamageNumber(pos, dmg, kind) {
  if (!App.gameScene) return;
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  if (!ctx) return;
  ctx.font = 'bold 42px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.9)';
  let color = '#ffffff';
  if (kind === 'heavy') color = '#ffd88a';
  else if (kind === 'cast') color = '#ffb060';
  else if (kind === 'ult') color = '#ff80d0';
  ctx.strokeText('-' + Math.round(dmg), 64, 32);
  ctx.fillStyle = color;
  ctx.fillText('-' + Math.round(dmg), 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.position.set(pos.x, pos.y + 1.6, pos.z);
  sprite.scale.set(1.5, 0.75, 1);
  sprite.userData.vy = 2.2;
  sprite.userData.life = 1.0;
  sprite.userData.maxLife = 1.0;
  sprite.userData.vx = 0;
  sprite.userData.vz = 0;
  App.gameScene.add(sprite);
  App.particles.push(sprite);
}

// ---------------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------------
function initInput() {
  const joystick = $('joystick');
  const knob = $('joyKnob');
  const canvas = $('gameCanvas');
  if (!canvas) return;

  const joy = { active: false, pointerId: null, cx: 0, cy: 0, maxR: 60 };

  const joyMove = (dx, dy) => {
    const d = Math.hypot(dx, dy);
    let nx = dx, ny = dy;
    if (d > joy.maxR) { nx = (dx/d)*joy.maxR; ny = (dy/d)*joy.maxR; }
    if (knob) knob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    const mag = Math.hypot(nx, ny) / joy.maxR;
    if (mag < 0.15) {
      App.playerInput.moveX = 0; App.playerInput.moveY = 0;
    } else {
      App.playerInput.moveX = nx / joy.maxR;
      App.playerInput.moveY = ny / joy.maxR;
    }
  };

  canvas.addEventListener('pointerdown', (e) => {
    if (joy.active) return;
    if (e.clientX > window.innerWidth * 0.55) return;
    joy.active = true;
    joy.pointerId = e.pointerId;
    joy.cx = e.clientX;
    joy.cy = e.clientY;
    if (joystick) {
      joystick.style.left = e.clientX + 'px';
      joystick.style.top = e.clientY + 'px';
      joystick.classList.add('active');
    }
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (!joy.active || joy.pointerId !== e.pointerId) return;
    joyMove(e.clientX - joy.cx, e.clientY - joy.cy);
    e.preventDefault();
  }, { passive: false });

  const endJoy = (e) => {
    if (joy.pointerId !== e.pointerId) return;
    joy.active = false;
    joy.pointerId = null;
    App.playerInput.moveX = 0; App.playerInput.moveY = 0;
    if (joystick) joystick.classList.remove('active');
    if (knob) knob.style.transform = 'translate(-50%, -50%)';
    try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
  };
  canvas.addEventListener('pointerup', endJoy);
  canvas.addEventListener('pointercancel', endJoy);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  const btnAttack = $('btnAttack');
  const btnCast = $('btnCast');
  const btnUlt = $('btnUlt');
  const btnDash = $('btnDash');

  if (btnAttack) {
    let holdTimer = null;
    btnAttack.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      playerAttack('light');
      holdTimer = setTimeout(() => playerAttack('heavy'), 220);
    }, { passive: false });
    const clear = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    btnAttack.addEventListener('pointerup', clear);
    btnAttack.addEventListener('pointercancel', clear);
    btnAttack.addEventListener('pointerleave', clear);
  }
  if (btnCast) btnCast.addEventListener('pointerdown', (e) => { e.preventDefault(); playerCast(); }, { passive: false });
  if (btnUlt) btnUlt.addEventListener('pointerdown', (e) => { e.preventDefault(); playerUlt(); }, { passive: false });
  if (btnDash) btnDash.addEventListener('pointerdown', (e) => { e.preventDefault(); playerDash(); }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') App.playerInput.moveY = -1;
    if (k === 's' || k === 'arrowdown') App.playerInput.moveY = 1;
    if (k === 'a' || k === 'arrowleft') App.playerInput.moveX = -1;
    if (k === 'd' || k === 'arrowright') App.playerInput.moveX = 1;
    if (k === ' ') { e.preventDefault(); playerAttack('light'); }
    if (k === 'e') playerCast();
    if (k === 'q') playerUlt();
    if (k === 'shift') playerDash();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') App.playerInput.moveY = 0;
    if (k === 's' || k === 'arrowdown') App.playerInput.moveY = 0;
    if (k === 'a' || k === 'arrowleft') App.playerInput.moveX = 0;
    if (k === 'd' || k === 'arrowright') App.playerInput.moveX = 0;
  });
}

// ---------------------------------------------------------------------------
// RACE UI
// ---------------------------------------------------------------------------
function buildRaceUI() {
  const list = $('raceList');
  if (!list) return;
  list.innerHTML = '';
  for (const race of RACES) {
    const card = document.createElement('div');
    card.className = 'race-card';
    card.dataset.raceId = race.id;
    card.innerHTML = `
      <div class="rc-name">${race.name}</div>
      <div class="rc-desc">${race.desc}</div>
      <div class="rc-tag">${race.tag}</div>
    `;
    card.addEventListener('click', () => selectRace(race.id));
    list.appendChild(card);
  }
  selectRace(App.currentRace);
}

function selectRace(raceId) {
  App.currentRace = raceId;
  const race = RACES.find(r => r.id === raceId);
  if (!race) return;
  document.querySelectorAll('.race-card').forEach((el) => {
    el.classList.toggle('active', el.dataset.raceId === raceId);
  });
  const setStat = (id, barId, val) => {
    const el = $(id), bar = $(barId);
    if (el) el.textContent = String(val);
    if (bar) bar.style.width = (val / 15 * 100) + '%';
  };
  setStat('statStr','barStr', race.stats.str);
  setStat('statAgi','barAgi', race.stats.agi);
  setStat('statInt','barInt', race.stats.int);
  setStat('statEth','barEth', race.stats.eth);
  rebuildMenuCharacter();
}

// ---------------------------------------------------------------------------
// RESIZE
// ---------------------------------------------------------------------------
function handleResize() {
  const w = Math.max(window.innerWidth, 320);
  const h = Math.max(window.innerHeight, 240);
  if (App.menuRenderer && App.menuCamera) {
    App.menuRenderer.setSize(w, h, false);
    App.menuCamera.aspect = w/h;
    App.menuCamera.updateProjectionMatrix();
    if (App.menuComposer) App.menuComposer.setSize(w, h);
  }
  if (App.gameRenderer && App.gameCamera) {
    App.gameRenderer.setSize(w, h, false);
    App.gameCamera.aspect = w/h;
    App.gameCamera.updateProjectionMatrix();
    if (App.gameComposer) App.gameComposer.setSize(w, h);
  }
}
window.addEventListener('resize', handleResize, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(handleResize, 200), { passive: true });

// ---------------------------------------------------------------------------
// TRANSITION: MENU → GAME
// ---------------------------------------------------------------------------
async function enterGame() {
  const label = $('btnPlay');
  if (label) label.textContent = 'СОЗДАНИЕ РАЗЛОМА…';
  stopMenuLoop();

  const menuEl = $('menu'); if (menuEl) menuEl.style.display = 'none';
  const menuCanvas = $('menuCanvas'); if (menuCanvas) menuCanvas.style.display = 'none';
  const gameEl = $('game'); if (gameEl) gameEl.classList.add('active');
  const gameCanvas = $('gameCanvas'); if (gameCanvas) gameCanvas.style.display = 'block';

  // Rebuild player with chosen race
  if (App.gameScene && App.player) {
    App.gameScene.remove(App.player);
    App.player.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    buildPlayer(App.gameScene);
  }

  handleResize();
  if (App.gameClock) App.gameClock.getDelta();
  startGameLoop();
  showToast('ДОБРО ПОЖАЛОВАТЬ В AETHELGARD', 'magic');
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
async function boot() {
  try {
    LOADER.setPct(3);
    LOADER.setText('Проверка WebGL…');
    await new Promise(r => setTimeout(r, 80));

    const test = document.createElement('canvas');
    const gl = test.getContext('webgl2') || test.getContext('webgl');
    if (!gl) throw new Error('WebGL не поддерживается устройством');

    await loadThree();

    LOADER.setPct(30);
    LOADER.setText('Построение меню…');
    await new Promise(r => setTimeout(r, 100));
    buildMenuScene();

    LOADER.setPct(60);
    LOADER.setText('Генерация мира…');
    await new Promise(r => setTimeout(r, 100));
    buildGameScene();

    LOADER.setPct(85);
    LOADER.setText('Разогрев…');
    if (App.menuRenderer) {
      try { App.menuRenderer.compile(App.menuScene, App.menuCamera); } catch(e) {}
    }
    if (App.gameRenderer) {
      try { App.gameRenderer.compile(App.gameScene, App.gameCamera); } catch(e) {}
    }
    await new Promise(r => setTimeout(r, 150));

    buildRaceUI();
    initInput();

    LOADER.setPct(100);
    LOADER.setText('Готово!');
    LOADER.ready();

    window.__apexReady = true;

    const startBtn = $('loaderStart');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        LOADER.hide();
        setTimeout(() => {
          const m = $('menu'); if (m) m.style.display = 'block';
          handleResize();
          if (App.menuClock) App.menuClock.getDelta();
          startMenuLoop();
          console.log('[Boot] Menu started');
        }, 400);
      });
    }

    const btnPlay = $('btnPlay');
    if (btnPlay) {
      btnPlay.addEventListener('click', () => {
        enterGame().catch(e => console.error('[Play]', e));
      });
    }

    console.log('[Boot] Complete. Awaiting user to click ПРОДОЛЖИТЬ');
  } catch(e) {
    console.error('[Boot] Failed:', e);
    window.__apexFailed = true;
    LOADER.setText('Ошибка инициализации');
    LOADER.showError(e.message || 'Неизвестная ошибка');
  }
}

// Pause on hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopMenuLoop();
    stopGameLoop();
  } else {
    const gameEl = $('game');
    if (gameEl && gameEl.classList.contains('active')) {
      if (App.gameClock) App.gameClock.getDelta();
      startGameLoop();
    } else {
      const menuEl = $('menu');
      if (menuEl && menuEl.style.display !== 'none') {
        if (App.menuClock) App.menuClock.getDelta();
        startMenuLoop();
      }
    }
  }
}, { passive: true });

boot();
</script>
